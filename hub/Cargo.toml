[package]
name = "drh-hub"
version = "0.1.0"
edition = "2021"
description = "Deep Research Hub wrapper: spawns apps/, serves web/, keeps state"

# Every crate here is already used by an app under apps/ (cocoindex, Rust-Search-).
[dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Shell-tier exceptions to the crate rule (approved 2026-10-23): tray, window, single-instance lock, copied from nerve.
[target.'cfg(windows)'.dependencies]
tao = "=0.34.8"
wry = "=0.47.2"
tray-icon = "=0.19.3"
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_JobObjects"] }
