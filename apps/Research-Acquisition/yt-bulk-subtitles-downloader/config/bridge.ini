[server]
host = 127.0.0.1
port = 3456
base_url = http://127.0.0.1:3456

[clipboard]
; watch_enabled=0 keeps sync_server UI/API up without OpenClipboard polling.
; That poller was fighting Ditto/ExtraClipboard and breaking normal Ctrl+C/V.
; Set to 1 only if you want Python auto-ingest history and can tolerate the risk.
watch_enabled = 0
read_retries = 5
read_retry_ms = 50
settle_ms = 150
poll_ms = 800
aggregate_mode = true
aggregate_window_ms = 2000

[paths]
root = D:\DONT TOUCH BOOT UP\AHK
fastapi = D:\DONT TOUCH BOOT UP\AHK\sync_server.py
bridge = D:\DONT TOUCH BOOT UP\AHK\clipsync-bridge\clipsync_bridge.ahk
log_dir = D:\DONT TOUCH BOOT UP\AHK\logs

