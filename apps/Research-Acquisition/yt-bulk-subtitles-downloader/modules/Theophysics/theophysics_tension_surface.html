
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theophysics Hub – Tension & Contradiction Surface</title>
<style>
:root{
  --bg:#0B0C0F;
  --surface:#11131A;
  --surface2:#181B26;
  --border:rgba(244,246,255,0.08);
  --gold:#F2C94C;
  --gold-dim:rgba(242,201,76,0.10);
  --text:#F4F6FF;
  --muted:#8A8F9E;
  --muted2:#5A5F6E;
  --red:#E05C6E;
  --red-dim:rgba(224,92,110,0.10);
  --purple:#9B7FE8;
  --purple-dim:rgba(155,127,232,0.10);
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  display:flex;
  justify-content:center;
  padding:40px;
}
.kv-card{
  width:700px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:11px;
  overflow:hidden;
}
.kvc-hd{
  padding:12px 16px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:10px;
}
.kvc-title{
  font-weight:600;
  font-size:14px;
  color:var(--red);
}
.kvc-body{
  padding:14px 16px;
}
.tension-item{
  padding:10px 12px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:7px;
  margin-bottom:8px;
  cursor:pointer;
  transition:all .15s;
}
.tension-item:hover{
  border-color:rgba(224,92,110,.35);
}
.tension-title{
  font-size:13px;
  font-weight:600;
  color:var(--red);
  margin-bottom:3px;
}
.tension-meta{
  font-size:11px;
  color:var(--muted2);
  font-family:monospace;
}
.tension-status{
  display:inline-block;
  margin-top:5px;
  font-size:10px;
  padding:3px 8px;
  border-radius:10px;
  border:1px solid;
}
.unresolved{
  color:var(--red);
  background:var(--red-dim);
  border-color:rgba(224,92,110,.28);
}
.active{
  color:var(--gold);
  background:var(--gold-dim);
  border-color:rgba(242,201,76,.28);
}
.speculative{
  color:var(--purple);
  background:var(--purple-dim);
  border-color:rgba(155,127,232,.28);
}
#detailPanel{
  margin-top:20px;
  padding:15px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  display:none;
}
.detail-title{
  font-weight:700;
  color:var(--gold);
  margin-bottom:6px;
}
.detail-text{
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
}
</style>
</head>

<body>

<div>
<div class="kv-card">
<div class="kvc-hd">
<div>⚠️</div>
<div class="kvc-title">Framework Tensions</div>
</div>

<div class="kvc-body">

<div class="tension-item" onclick="showDetail('chi')">
<div class="tension-title">χ Field — Physical Definition</div>
<div class="tension-meta">Domain: Physics · 6 notes · last edit Mar 7</div>
<div class="tension-status unresolved">UNRESOLVED</div>
</div>

<div class="tension-item" onclick="showDetail('collapse')">
<div class="tension-title">Collapse Mechanism</div>
<div class="tension-meta">Domain: Quantum bridge · 11 notes</div>
<div class="tension-status active">ACTIVE</div>
</div>

<div class="tension-item" onclick="showDetail('grace')">
<div class="tension-title">Grace Operator (Ĝ)</div>
<div class="tension-meta">Domain: Theology/Physics boundary</div>
<div class="tension-status speculative">SPECULATIVE</div>
</div>

<div class="tension-item" onclick="showDetail('entropy')">
<div class="tension-title">Moral Conservation vs Entropy</div>
<div class="tension-meta">Paper 9–10 dependency</div>
<div class="tension-status unresolved">UNRESOLVED</div>
</div>

<div id="detailPanel">
<div class="detail-title" id="detailTitle"></div>
<div class="detail-text" id="detailText"></div>
</div>

</div>
</div>
</div>

<script>
function showDetail(type){

const panel=document.getElementById("detailPanel");
const title=document.getElementById("detailTitle");
const text=document.getElementById("detailText");

panel.style.display="block";

if(type==="chi"){
title.innerText="χ Field — Problem";
text.innerText="The χ field is currently defined conceptually as informational potential but lacks a fully formalized physical definition that can be tested experimentally.";
}

if(type==="collapse"){
title.innerText="Collapse Mechanism";
text.innerText="Wavefunction collapse has not yet been mathematically linked to the χ coherence field. Paper 2 (Quantum Bridge) depends on resolving this relationship.";
}

if(type==="grace"){
title.innerText="Grace Operator";
text.innerText="The grace operator (Ĝ) acts outside the closed system model. The exact mechanism by which it interacts with the moral sign operator remains speculative.";
}

if(type==="entropy"){
title.innerText="Moral Conservation vs Entropy";
text.innerText="Thermodynamic entropy increases in closed systems, while moral conservation suggests restoration via external intervention. The interaction boundary is unresolved.";
}

}
</script>

</body>
</html>
