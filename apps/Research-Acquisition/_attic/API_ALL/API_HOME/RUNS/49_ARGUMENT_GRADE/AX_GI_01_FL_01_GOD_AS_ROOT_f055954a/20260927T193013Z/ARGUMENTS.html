 of coherence, active, and personal, which matches classical divine attributes.", "items": {"st1": {"v": [2, 2], "quote": "Those properties have had a name for thousands of years", "why": ""}, "st2": {"v": [2, 2], "quote": "1. **Necessary** -- it cannot not exist, or the system collapses. 2. **Self-grounding** -- it cannot depend on something else (infinite regress). 3. **Origin of coherence** -- it must be the source of truth, order, beauty, goodness, life. 4. **Active** -- passive maintenance is thermodynamically impossible (the Second Law). 5. **Personal** -- only persons can ground moral facts (moral realism).", "why": ""}, "st3": {"v": [1, 1], "quote": "If closed systems collapse and the universe has not collapsed, then something external sustains it.", "why": ""}, "st4": {"v": [0, 1], "quote": "If coherence and decoherence are real, measurable, and universal, then the source of coherence must be equally real and universal.", "why": ""}, "st5": {"v": [0, 0], "quote": "", "why": ""}, "st6": {"v": [0, 1], "quote": "We started from five mathematical proofs and arrived at the exact description theologians have been writing about since the beginning.", "why": ""}, "st7": {"v": [0, 0], "quote": "", "why": ""}, "st8": {"v": [1, 1], "quote": "If closed systems collapse and the universe has not collapsed, then something external sustains it. If coherence and decoherence are real, measurable, and universal, then the source of coherence must be equally real and universal.", "why": ""}, "or1": {"v": [1, 1], "quote": "Those properties have had a name for thousands of years", "why": "A variant of the classical necessary-ground / cosmological argument re-expressed with five 'mathematical requirements'."}, "or2": {"v": [1, 1], "quote": "If coherence and decoherence are real, measurable, and universal, then the source of coherence must be equally real and universal.", "why": "Adds decoherence/coherence language as evidence, though it is asserted rather than documented."}, "or3"
