ns": "Connects to A01 (no numerical threshold) and A03 (high evidence is more important than consensus)."}, "reproduction_receipt": {"run_id": "", "timestamp": "", "source_hashes": {}, "commands": [], "exit_codes": [], "log_paths": [], "declarations_checked": []}, "corpus_links": {"human_companion": "", "corpus_claim_register": "", "supporting_summaries": []}}, {"identity": {"claim_id": "A02", "candidate_uuid": "lean4-A02-0004"}, "source_selection": {"exact_source_expression": "I've never counted. Except the empty tomb, and it's not one of the six, I never counted. ... The only time I've done that is the empty tomb.", "selection_disposition": "FORMALIZE", "reason": "This is a precise claim about the scope of counting: the only claim for which a scholarly consensus percentage was counted is the empty tomb. It can be modeled as a predicate on claims."}, "formal_object": {"object_type": "DEFINITION", "exact_proposed_statement": "A claim c is counted if and only if c is the empty tomb.", "fully_qualified_declaration": "def Counted (c : HistoricalClaim) : Prop := c = HistoricalClaim.emptyTomb", "project_root": "", "module": "Habermas.Threshold"}, "symbol_table": [{"term": "HistoricalClaim", "formal_definition": "opaque type HistoricalClaim", "reader_meaning": "A proposition about a past event.", "source_correspondence": "The facts discussed in the minimal-facts method."}, {"term": "emptyTomb", "formal_definition": "HistoricalClaim", "reader_meaning": "The claim that the tomb of Jesus was empty.", "source_correspondence": "The empty tomb, the only claim for which Habermas counted scholars."}, {"term": "Counted", "formal_definition": "c = HistoricalClaim.emptyTomb", "reader_meaning": "A claim is counted only if it is the empty tomb.", "source_correspondence": "A02: 'The only time I've done that is the empty tomb.'"}], "assumptions_and_dependencies": {"explicit_premises": ["HistoricalClaim is a type with at least one distinguished element emptyTomb."], "custom_axioms": [], ds doing so.", "what_it_does_not_show": "It does not establish that no evidential threshold exists, nor that his prior percentage was correct or incorrect.", "what_would_falsify_the_narrative": "A recording showing he never gave a percentage, or that he continues to give one."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "Anecdotal; functions as a rhetorical shield against the objection in A06."}, {"story_id": "st-002", "title_or_label": "The 51% agnostic-days teasing", "story_type": "historical_anecdote", "source_span": "S003, S019", "characters_or_agents": ["Gary Habermas", "Dale (interviewer)"], "setting_or_context": "Dale's former agnostic period, when he used a 51% evidential threshold", "plot_or_sequence": "Dale used to require 51% evidence; Habermas playfully mocked him; Dale laughed graciously; Habermas now declines to name his own number.", "intended_function": "motivate", "claims_illustrated": ["A01", "A06"], "emotional_or_rhetorical_load": "Warm, humorous, relationship-building", "boundaries": {"what_it_shows": "The interviewer once held a numerical threshold and Habermas found it worth teasing.", "what_it_does_not_show": "It does not show that numerical thresholds are irrational, only that Habermas avoids stating one.", "what_would_falsify_the_narrative": "Evidence that Dale never held a 51% threshold or that Habermas never teased him."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "Personal banter; separable from the substantive argument."}, {"story_id": "st-003", "title_or_label": "The 3,700 pages of sources", "story_type": "illustration", "source_span": "S003, S151-S152", "characters_or_agents": ["Gary Habermas"], "setting_or_context": "Habermas's personal research archive", "plot_or_sequence": "Habermas has feet of sources and a file cabinet of papers but no numerical count except for the empty tomb.", "intended_function": "persuade", "claims_illustrated": ["A02", "A03"], "emotional_or_rhetorical_load": "Defensive, earnest; appeals to labor and volume of research", "boundaries": {"what_it_shows": "Habermas possesses extensive source material and has not tabulated percentages for most facts.", "what_it_does_not_show": "It does not show that his evidence is strong, only that it is voluminous; volume is not warrant.", "what_would_falsify_the_narrative": "Discovery that he has in fact tabulated percentages for the minimal facts."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "Volume of sources is offered as a substitute for a numerical threshold; this is rhetorical, not evidential."}, {"story_id": "st-004", "title_or_label": "The empty tomb head count exception", "story_type": "historical_anecdote", "source_span": "S003, S005, S123-S135", "characters_or_agents": ["Gary Habermas"], "setting_or_context": "Habermas's own study on the empty tomb", "plot_or_sequence": "The only time Habermas counted scholarly opinion was his own empty-tomb study, which is not one of the minimal facts; he reports roughly 80% there and 90% descriptively for the minimal facts but insists he never counted the latter.", "intended_function": "explain", "claims_illustrated": ["A02", "A01"], "emotional_or_rhetorical_load": "Insistent, corrective", "boundaries": {"what_it_shows": "Habermas distinguishes his one counted study from his general practice.", "what_it_does_not_show": "It does not show that the 90% figure for the minimal facts is accurate; he explicitly disclaims having counted it.", "what_would_falsify_the_narrative": "Evidence that he has counted scholarly percentages for the minimal facts."}, "evidence_for_historical_content": [], "is_separable_from_argument": false, "notes": "Structurally load-bearing for A02; the distinction between counted and uncounted figures is central to his reply."}, {"story_id": "st-005", "title_or_label": "Jimmy Dunn and the early creed", "story_type": "testimony", "source_span": "S048-S083", "characters_or_agents": ["Jimmy Dunn", "Gary Habermas", "Bart Ehrman", "Gerd Lüdemann"], "setting_or_context": "Modern New Testament scholarship on the dating of the resurrection creed in 1 Corinthians 15", "plot_or_sequence": "Dunn, a non-evangelical scholar, is described as open to the data and as suggesting the creedal statements may have arisen within months of the crucifixion; Ehrman concedes it is a historical fact that the disciples thought they saw the risen Jesus; Lüdemann says the preaching began immediately.", "intended_function": "persuade", "claims_illustrated": ["A03", "A04"], "emotional_or_rhetorical_load": "Appreciative, strategic; uses hostile-witness appeal", "boundaries": {"what_it_shows": "Some non-evangelical scholars affirm early testimony and the disciples' experiences.", "what_it_does_not_show": "It does not show that the resurrection occurred; it shows only that certain scholars date the tradition early and grant the disciples' experiences.", "what_would_falsify_the_narrative": "Evidence that Dunn, Ehrman, or Lüdemann did not say these things or that their positions are misrepresented."}, "evidence_for_historical_content": ["A04"], "is_separable_from_argument": false, "notes": "Hostile-witness testimony is used as evidence for A04; the narrative itself is separable but the cited scholars' statements are treated as data."}, {"story_id": "st-006", "title_or_label": "Ancient historians reported the supernatural", "story_type": "historical_anecdote", "source_span": "S097-S119", "characters_or_agents": ["Herodotus", "Tacitus", "Suetonius", "the Caesars"], "setting_or_context": "Greco-Roman historiography", "plot_or_sequence": "Critics dismiss the Gospels for reporting miracles; Habermas counters that Herodotus, Tacitus, and Suetonius also report supernatural events, so the objection is inconsistent.", "intended_function": "persuade", "claims_illustrated": ["A05"], "emotional_or_rhetorical_load": "Confrontational, tu quoque", "boundaries": {"what_it_shows": "Some ancient historians reported supernatural events.", "what_it_does_not_show": "It does not show that any reported miracle occurred, nor that the Gospels' miracles are thereby credible; it only removes a consistency objection.", "what_would_falsify_the_narrative": "Evidence that these historians did not report supernatural events or that the comparison is anachronistic."}, "evidence_for_historical_content": ["A05"], "is_separable_from_argument": false, "notes": "A tu quoque move; the historical claim is supported by A05 but the inference to Gospel credibility is not warranted by the analogy alone."}, {"story_id": "st-007", "title_or_label": "The 85-90% of the game analogy", "story_type": "illustration", "source_span": "S159-S163", "characters_or_agents": ["Gary Habermas", "Dale"], "setting_or_context": "Discussion of the relative weight of criterion 1 versus criterion 2", "plot_or_sequence": "Habermas says criterion 1 (high evidence) is 85-90% of the game, while criterion 2 (scholarly consensus) is far less important.", "intended_function": "explain", "claims_illustrated": ["A03"], "emotional_or_rhetorical_load": "Casual, concessive", "boundaries": {"what_it_shows": "Habermas weights strong evidence far above scholarly consensus.", "what_it_does_not_show": "It does not quantify the actual weight; the 85-90% is an informal analogy, not a measured threshold.", "what_would_falsify_the_narrative": "Evidence that Habermas treats consensus as equally or more important."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "Ironically uses a percentage while disclaiming percentages; the analogy is explanatory, not evidential."}], "narrative_arc": {"opening_device": "Interviewer asks Habermas to specify his evidential threshold, invoking a prior playful exchange about 51%.", "central_tension": "Habermas wants to affirm strong evidence for the resurrection while refusing to name a numerical threshold, because any number will be misrepresented as a universal requirement.", "resolution_or_payoff": "He substitutes categories (multiple attestation, eyewitness, early sources) for numbers, cites non-evangelical scholars as corroboration, and ranks criterion 1 far above criterion 2.", "return_to_opening": true}, "notes": "The chapter is largely meta-methodological: it is about how Habermas frames evidence, not about new historical data. Most narrative content is anecdotal or illustrative and separable from the argument; the Dunn/Ehrman/Lüdemann and ancient-historian material is treated as evidence and is therefore less separable. No story here transfers warrant to the resurrection claim itself."}, "master_equation": {"core_relation": {"sentence": "Habermas's core relation is that a historical fact qualifies as a minimal fact when it is highly evidenced AND has scholarly consensus, but the evidential criterion is by far the more important and can alone suffice for rational belief.", "quote": "So, so in terms of that, uh the standard of evidential proof, it it sounds like you kind of follow most historians and sort of like Mike Licona. They they don't give percentages per se, but they they have these categories like it's very probable or proven beyond reasonable doubt, stuff stuff like that. is how you would Okay. >> Very common. I like that. I like categories and and I like better categories rather than weaker categories of data. So, if I have fewer names backing it up, I'll take that in instances where they strongly support multiple eyewitness early etc. I think we're going in the right direction. [S091-S096]"}, "core_relation_run2": {"sentence": "A historical fact qualifies as a 'minimal fact' for resurrection belief when it is both highly evidenced (by multiple, early, eyewitness-attested data) AND held by a vast majority of qualified scholars; the evidential criterion is the dominant and sufficient condition, with scholarly consensus as a secondary confirmation.", "quote": "So, if I have fewer names backing it up, I'll take that in instances where they strongly support multiple eyewitness early etc. [S095] ... That's by far the more important of the two. Way more. [S159/S160]"}, "product_test": {"run1": "multiplicative", "run2": "threshold", "status": "contested", "quote": "I think if I have non-evangelical saying those things, that that interests me, but I I think more in terms of data like multiple attestation, eyewitness, early testimony, and here's uh Jimmy Dunn saying, \"Maybe the same year.\" [S081]", "reason": "Habermas treats the criteria as jointly necessary: a fact qualifies only if it is both highly evidenced and has scholarly consensus; if either is missing (e.g., no multiple attestation or no early source), the argument for that fact fails entirely, not merely weakens. The language of 'categories' and 'stronger reasons' implies a threshold-like multiplicative conjunction."}, "slots": [{"slot": "G", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "External negentropy influx: the broader community of non-evangelical scholars providing independent attestation and data that Habermas cannot generate alone.", "quote": "But I mean, I can take I can pull Jimmy Dunn off my shelf, his Remembering Jesus book, which far as I know, he's not an he's not an evangelical, or if he is, it was late in his life. [S048]"}, {"slot": "M", "fit_1": "direct", "fit_2": "analogous", "status": "contested", "plays_role": "Alignment: Habermas aligns his method with mainstream historical criteria (multiple attestation, eyewitness, early testimony) rather than theological presuppositions, maximizing coupling with the evidence.", "quote": "So, after a while, I don't measure by how many do I have. I measure by do I have a fair number of multiple attestation? I'd say if I have multiple attestation, eyewitness, and early sources, that's not a list of names, that's a list of categories. [S042-S044]"}, {"slot": "E", "fit_1": "analogous", "fit_  '<p class="sub">Top words — '+Object.keys(TE.top_words||{}).filter(function(k){return Object.keys(TE.top_words[k]).length;}).map(function(k){return '<b>'+nm(k)+'</b>: '+esc(Object.keys(TE.top_words[k]).slice(0,6).join(', '));}).join(' · ')+'</p>';

/* 2 FRUITS: heat strip, paragraph love, spikes, verdict */
var s2=sec("fr","2 · Fruits of the Spirit",SS.scored+"/"+SS.total+" sentences scored","Every sentence is a column. Blue moves toward the fruit, red moves away, grey is neutral. Hover for the sentence, the reason and the trigger words.");
var hs=document.createElement("div");s2.appendChild(hs);
charts.push(function(){hs.innerHTML='';var n=D.sentences.length,W=1000,cw=W/n,rh=15;var s=svgIn(hs,W+80,9*rh+24);
 FR.forEach(function(f,j){tx(s,74,j*rh+11,nm(f),{"text-anchor":"end","font-size":10});});
 D.sentences.forEach(function(r,i){for(var j=0;j<9;j++)el("rect",{x:80+i*cw,y:j*rh,width:cw+.1,height:rh-2,fill:r.v?div(r.v[j]):css("--grid")},s);});
 var hit=el("rect",{x:80,y:0,width:W,height:9*rh,fill:"transparent"},s);hover(hit,function(e){var b=hit.getBoundingClientRect();var i=Math.max(0,Math.min(n-1,Math.floor((e.clientX-b.left)/b.width*n)));return sentTip(D.sentences[i]);});
 var step=Math.max(1,Math.round(n/6));for(var i=0;i<n;i+=step)tx(s,80+i*cw,9*rh+14,D.sentences[i].id,{"font-size":9,"class":"mut"});
});
var pl=document.createElement("div");s2.appendChild(pl);
charts.push(function(){var P=SS.paragraph_love||{},T=SS.paragraph_total||{},ks=Object.keys(P);pl.innerHTML='<h3>Love by paragraph <small class="id">bar = mean love, dot = mean of all nine</small></h3>';if(!ks.length)return;
 var W=1000,bw=W/ks.length,H=90,mid=H/2;var s=svgIn(pl,W+40,H+18);el("line",{x1:30,y1:mid,x2:30+W,y2:mid,stroke:css("--axis")},s);
 tx(s,26,8,"+2",{"text-anchor":"end","font-size":9,"class":"mut"});tx(s,26,H,"−2",{"text-anchor":"end","font-size":9,"class":"mut"});
 ks.forEach(function(k,i){var v=P[k],h=v/2*mid,x=30+i*bw;var r=el("rect",{x:x+1,y:v>=0?mid-h:mid,width:Math.max(1,bw-2),height:Math.max(1,Math.abs(h)),fill:v>=0?css("--g2"):css("--b2"),rx:1.5},s);
  el("circle",{cx:x+bw/2,cy:mid-(T[k]||0)/2*mid/4,r:1.8,fill:css("--ink"),"fill-opacity":.5},s);hover(r,'<div class="t1">'+k+'</div>love '+v+' · all nine '+(T[k]||0));});
});
var sp=document.createElement("div");sp.className="grid2";s2.appendChild(sp);
function spikeList(t,a,cls){return '<div><h3>'+t+'</h3>'+((a||[]).length?'<ul class="q">'+a.map(function(x){return '<li><span class="pill '+cls+'">'+(x.sum>0?'+':'')+x.sum+'</span> <span class="id">'+x.id+'</span> “'+esc(x.text)+'”'+(Object.keys(x.why||{}).length?'<br><span class="id">'+esc(Object.keys(x.why).map(function(k){return k+': '+x.why[k];}).join('; '))+'</span>':'')+'</li>';}).join('')+'</ul>':'<p class="sub">None.</p>')+'</div>';}
sp.innerHTML=spikeList("Strongest toward the fruits",SS.top_toward,"pos")+spikeList("Strongest away",SS.top_away,"neg")+spikeList("Counterfeit candidates (fruit words, anti-fruit work)",SS.counterfeit_candidates,"neg")+spikeList("Hidden fruit (fruit work, no fruit words)",SS.hidden_fruit,"pos");
var FV=D.fruits||{};if(FV.fruit_profile){var vd=document.createElement("div");s2.appendChild(vd);
 vd.innerHTML='<h3>Paper verdict, rubric v0.3.0 <small class="id">'+esc(FV.epistemic_status)+' · '+esc(FV.system_status)+' · confidence '+FV.confidence+'</small></h3>';
 table(vd,["Fruit","Score 0–4","Confidence","Counterfeit","Rationale"],FV.fruit_profile.map(function(p){return [nm(p.fruit_id.split(".").pop()),'<b>'+p.score+'</b>',p.confidence,(p.counterfeit||{}).flag?'<span class="pill neg">yes</span>':'no',esc(p.rationale)];}));
 table(vd,["Gate","Status","Hard","Rationale"],(FV.gate_results||[]).map(function(g){return [esc(g.gate_id),'<span class="pill '+(g.status==="PASS"?"pos":g.status==="FAIL"?"neg":"neu")+'">'+g.status+'</span>',g.hard?"hard":"",esc(g.rationale)];}));
 if((FV.repair_path||[]).length)vd.insertAdjacentHTML("beforeend",'<h3>Repair path</h3><ul class="q">'+FV.repair_path.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>');}

/* 3 AXIOMS */
var AX=D.axiom_nodes||{};var s3=sec("ax","3 · Axiom nodes",(AX.axiom_nodes||[]).length+" engaged · primary mode "+esc(AX.primary_mode||"—"),esc(AX.summary||""));
table(s3,["Node","Name","Mode","Alignment","Confidence","Quote"],(AX.axiom_nodes||[]).map(function(n){var a=n.alignment||"";return ['<span class="id">'+esc(n.node_id)+'</span>',esc(n.name),esc(n.mode),'<span class="pill '+(a==="contested"?"neg":a==="directly_asserted"||a==="supported"?"pos":"neu")+'">'+esc(a)+'</span>',esc(n.confidence),esc(n.evidence_quote)];}));
if((AX.unmapped_claims||[]).length)s3.insertAdjacentHTML("beforeend",'<p class="sub">Unmapped atoms: '+AX.unmapped_claims.map(esc).join(', ')+'</p>');

/* 4 ATOMS */
var AT=D.atoms||{};var s4=sec("at","4 · Atoms",(AT.atoms||[]).length+" · domain "+esc(AT.domainType||"—"),esc(AT.summary||""));
table(s4,["Id","Type","Stage","Name","Plain statement","Falsified if","Sentences"],(AT.atoms||[]).map(function(a){return ['<span class="id">'+a.atom_id+'</span>',esc(a.nodeType),esc(a.stage),'<b>'+esc(a.name)+'</b>',esc(a.statementPlain),esc(a.falsificationCondition),'<span class="id">'+esc((a.source_sentences||[]).slice(0,8).join(', '))+((a.source_sentences||[]).length>8?'…':'')+'</span>'];}));

/* 5 LEAN */
var LE=D.lean4||{};var s5=sec("le","5 · Lean 4 formalization candidates",(LE.formal_candidates||[]).length+" targets","The Lean corpus was not searched in this run; these are targets, not results.");
table(s5,["Claim","Disposition","Object","Proposed statement","What remains open"],(LE.formal_candidates||[]).map(function(c){return [esc((c.identity||{}).claim_id),esc((c.source_selection||{}).selection_disposition),esc((c.formal_object||{}).object_type),esc((c.formal_object||{}).exact_proposed_statement),esc((c.result_and_boundary||{}).what_remains_open)];}));

/* 6 STORIES */
var STo=D.stories||{},arc=STo.narrative_arc||{};var s6=sec("st","6 · Stories",(STo.stories||[]).length+" found",arc.opening_device?'Arc: <b>'+esc(arc.opening_device)+'</b> → <b>'+esc(arc.central_tension)+'</b> → <b>'+esc(arc.resolution_or_payoff)+'</b> · returns to opening: '+arc.return_to_opening:"");
table(s6,["Story","Type","Function","Span","Shows","Does not show","Load-bearing"],(STo.stories||[]).map(function(x){var b=x.boundaries||{};return ['<b>'+esc(x.title_or_label)+'</b>',esc(x.story_type),esc(x.intended_function),'<span class="id">'+esc(x.source_span)+'</span>',esc(b.what_it_shows),esc(b.what_it_does_not_show),x.is_separable_from_argument===false?'<span class="pill neg">yes</span>':'no'];}));

/* 7 MASTER EQUATION */
var pt=me.product_test||{},cr=me.core_relation||{};var s7=sec("me","7 · Master equation analog","strength "+(me.analog_strength!=null?me.analog_strength:"—")+" ("+(me.analog_strength_spread||"")+") · two independent runs",
 'χ = G·M·E·S<sub>eff</sub>·T·K·R·Q·F·C. Core relation: '+esc(cr.sentence||cr)+'<br>Product test: <b>'+esc(pt.run1)+'</b> / <b>'+esc(pt.run2)+'</b> ('+esc(pt.status)+') — '+esc(pt.reason));
var mdv=document.createElement("div");s7.appendChild(mdv);
charts.push(function(){mdv.innerHTML='';var sl=me.slots||[];if(!sl.length)return;var s=svgIn(mdv,10*64+10,110),fit={direct:1,analogous:.66,stretched:.33,absent:0};
 sl.forEach(function(r,i){var cx=36+i*64,v1=fit[r.fit_1],v2=fit[r.fit_2],v=((v1||0)+(v2||0))/2;
  var c=el("circle",{cx:cx,cy:44,r:6+v*18,fill:v>=.66?css("--g2"):v>=.33?css("--g1"):css("--mid"),stroke:r.status==="contested"?css("--b2"):"none","stroke-width":2.5,"stroke-dasharray":r.status==="contested"?"4 2":"none"},s);
  tx(s,cx,96,r.slot,{"text-anchor":"middle","font-weight":600});hover(c,'<div class="t1">'+r.slot+' · '+esc(r.fit_1)+' / '+esc(r.fit_2)+' ('+r.status+')</div>'+esc(r.plays_role)+'<br><span style="color:var(--muted)">'+esc(r.quote)+'</span>');});
});
s7.insertAdjacentHTML("beforeend",'<p class="sub">Circle size = fit (direct &gt; analogous &gt; stretched &gt; absent), averaged over both runs. Dashed red ring = the two runs disagree.</p>'+(me.one_line?'<p>“'+esc(me.one_line)+'”</p>':''));

/* 8 COHERENCE */
var s8=sec("co","8 · Coherence",co.score!=null?co.score+"/"+(co.score_ceiling||10):"",esc(co.summary||""));
(D.coherence&&D.coherence.dimensions||[]).forEach(function(d){s8.insertAdjacentHTML("beforeend",'<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><b>'+esc(nm(d.name||""))+'</b><span class="id">'+d.score+'/10</span></div><div class="bar"><i style="width:'+(d.score||0)*10+'%;background:'+((d.score||0)>=7?css("--g2"):(d.score||0)>=5?css("--g1"):css("--b2"))+'"></i></div><div class="sub" style="margin-top:4px">'+esc((d.reasons||[]).join(' · '))+'</div></div>');});
["contradictions","tensions","missing_definitions"].forEach(function(k){var a=(D.coherence||{})[k]||[];if(a.length)s8.insertAdjacentHTML("beforeend",'<h3>'+nm(k)+'</h3><ul class="q">'+a.map(function(x){return '<li>'+(typeof x==="object"?(x.term?'<b>'+esc(x.term)+'</b>: ':'')+esc(x.description||x.note||JSON.stringify(x))+(x.severity?' <span class="pill neu">'+esc(x.severity)+'</span>':''):esc(x))+'</li>';}).join('')+'</ul>');});

/* 9 ALL SENTENCES */
var s9=sec("ss","9 · Every sentence","searchable","Nine cells per sentence in fruit order (love … self-control). Type to filter by text, id or trigger word.");
s9.insertAdjacentHTML("beforeend",'<input class="search" id="q" placeholder="Filter sentences…">');var tb=document.createElement("div");s9.appendChild(tb);
function sentRows(f){f=(f||"").toLowerCase();var rs=D.sentences.filter(function(s){return !f||(s.id+" "+s.t+" "+JSON.stringify(s.x)+" "+JSON.stringify(s.w)).toLowerCase().indexOf(f)>=0;});
 tb.innerHTML='';table(tb,["Id","Fruits","Sentence","Why / trigger words"],rs.map(function(s){return ['<span class="id">'+s.id+'<br>'+s.p+'</span>','<span style="white-space:nowrap">'+FR.map(function(fr,j){var v=s.v?s.v[j]:null;return '<span class="cell" title="'+nm(fr)+' '+v+'" style="background:'+div(v)+';color:'+(Math.abs(v||0)===2?"#fff":"inherit")+'">'+(v?(v>0?'+':'−'):'')+'</span>';}).join('')+'</span>',esc(s.t),'<span class="id">'+esc(Object.keys(s.w).map(function(k){return k+': '+s.w[k];}).concat(Object.keys(s.x).map(function(k){return k.replace('_',' ')+': '+s.x[k].join(', ');})).join(' · '))+'</span>'];}));}
document.getElementById("q").addEventListener("input",function(e){sentRows(e.target.value);});

/* AUDIT */
var sa=sec("au","Audit","","Each call's tokens; reused = taken from an earlier run because its prompt had not changed.");
table(sa,["Call","Tokens","Status"],D.calls.map(function(c){return [esc(c.name),c.tokens.toLocaleString(),c.error?'<span class="pill neg">'+esc(c.error)+'</span>':c.reused?'<span class="pill neu">reused</span>':'<span class="pill pos">ok</span>'];}));

render();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",render);
