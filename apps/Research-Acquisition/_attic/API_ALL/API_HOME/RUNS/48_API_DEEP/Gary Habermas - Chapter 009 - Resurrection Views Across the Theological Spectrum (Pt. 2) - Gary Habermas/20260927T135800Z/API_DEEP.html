must be nonempty and include the resurrection connection."}, "verification_controls": [{"check": "module compilation", "command_or_evidence": "lake build ResurrectionFormalization.NewTestament", "status": "NOT_RUN", "interpretation": "Lean corpus not searched."}], "result_and_boundary": {"verification_status": "CANDIDATE", "what_is_established": "The formal theorem is a trivial consequence of the premises. It does not establish the actual counts.", "what_remains_open": "The actual textual counts and the definition of 'connection'.", "encoding_fidelity_review": "The formalization is a simple counting argument.", "interpretive_connections": "Supports the theological importance of the resurrection of believers."}, "reproduction_receipt": {}, "corpus_links": {}}], "existing_matches": [], "notes": "The Lean corpus was not searched in this run. All verification controls are NOT_RUN and verification statuses are CANDIDATE. The formal candidates are proposed formalizations of the logical structure of the claims, not verified theorems. They do not establish the historical or theological truth of the premises."}, "stories": {"station": "stories", "paper_uuid": "Gary Habermas - Chapter 009 - Resurrection Views Across the Theological Spectrum (Pt. 2) - Gary Habermas", "run_uuid": "deep-45bbe45eba68", "stories": [{"story_id": "story-001", "title_or_label": "Habermas's Personal Skepticism and Near-Conversion to Buddhism", "story_type": "testimony", "source_span": "P03 S228-S259", "characters_or_agents": ["Gary Habermas"], "setting_or_context": "Habermas's personal intellectual journey, spanning from his youth through his PhD and beyond, including his time as a skeptic and his near-conversion to a Buddhist metaphysical worldview.", "plot_or_sequence": "Habermas states he was a skeptic for ten straight years and off-and-on for another ten, totaling twenty years. He notes this occurred even after completing his PhD, about 12-15 years after. He mentions he came close to becoming a Buddhist, not in a meditative sense, but due to arguments in the late 70s and 80s that Buddhism provides a metaphysical background for physics. He claims this long period of doubt allows him to think like a skeptic and read more unbelieving material.", "intended_function": "persuade", "claims_illustrated": ["A06"], "emotional_or_rhetorical_load": "Moderate; establishes ethos and empathy with skeptics, positioning Habermas as someone who understands doubt from the inside.", "boundaries": {"what_it_shows": "Habermas personally experienced prolonged doubt and seriously considered a non-Christian worldview.", "what_it_does_not_show": "It does not provide evidence for or against the resurrection; it only explains his perspective and approach.", "what_would_falsify_the_narrative": "Evidence that Habermas was never a skeptic or never seriously considered Buddhism would falsify the testimony."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "This testimony is used to support his claim that he can think like a skeptic and that he reads more critical material."}, {"story_id": "story-002", "title_or_label": "The Wheat and the Tares: God as the Judge", "story_type": "illustration", "source_span": "P03 S016-S025", "characters_or_agents": ["Gary Habermas", "Dale", "God"], "setting_or_context": "A discussion about labeling people as Christian or non-Christian, referencing a German Baptist church upbringing.", "plot_or_sequence": "Habermas recalls an old statement from his German Baptist church: in heaven, we will find many people we thought were going to hell, and miss many we thought would be there. He concludes that God separates the wheat from the tares (or 'terrorists' as auto-captioned), and it is not his job to judge.", "intended_function": "explain", "claims_illustrated": ["A02"], "emotional_or_rhetorical_load": "Moderate; uses a familiar religious metaphor to justify his refusal to label others.", "boundaries": {"what_it_shows": "Habermas holds a theological view that final judgment belongs to God, not humans.", "what_it_does_not_show": "It does not provide evidence for the resurrection or for any historical claim.", "what_would_falsify_the_narrative": "If Habermas were shown to routinely label people as Christian or non-Christian, it would contradict this illustration."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "The auto-caption says 'terrorists' but likely means 'tares'."}, {"story_id": "story-003", "title_or_label": "The Canadian Buddhist Hockey Player at Liberty University", "story_type": "historical_anecdote", "source_span": "P03 S085-S090", "characters_or_agents": ["Gary Habermas", "Canadian Buddhist hockey player"], "setting_or_context": "Liberty University in 1993, where Habermas was ice hockey coach.", "plot_or_sequence": "Habermas mentions that one of his best players was a Canadian Buddhist, and no one at Liberty or elsewhere objected. He uses this to illustrate that Liberty University does not require students to be Christian and that fairness is important.", "intended_function": "illustrate", "claims_illustrated": ["A02"], "emotional_or_rhetorical_load": "Low; a brief anecdote to support his point about not labeling people.", "boundaries": {"what_it_shows": "At least one non-Christian student was accepted and valued at Liberty University.", "what_it_does_not_show": "It does not prove that Liberty University has no Christian requirements or that Habermas never labels people.", "what_would_falsify_the_narrative": "Evidence that the player was actually Christian or that Liberty enforced a Christian oath would weaken the anecdote."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "This is a personal recollection, not independently verified."}, {"story_id": "story-004", "title_or_label": "Tony Flew's Six-Page Letter and Possible Conversion", "story_type": "historical_anecdote", "source_span": "P03 S044-S052", "characters_or_agents": ["Gary Habermas", "Tony Flew", "friend of Habermas"], "setting_or_context": "Habermas received a six-page handwritten letter from philosopher Antony Flew around 2003.", "plot_or_sequence": "Habermas read the letter and ran to show a friend, saying it looked like Flew was converting to Christianity. He told Flew this. The letter complimented arguments like intelligent design, fine-tuning, NDEs, and resurrection data.", "intended_function": "illustrate", "claims_illustrated": ["A02"], "emotional_or_rhetorical_load": "Moderate; highlights the unpredictability of scholars' views and supports Habermas's caution about labeling.", "boundaries": {"what_it_shows": "Flew expressed interest in arguments for Christianity and may have been moving toward belief.", "what_it_does_not_show": "It does not confirm Flew became a Christian; Habermas says he doesn't know where Flew ended up.", "what_would_falsify_the_narrative": "If the letter were shown to be misremembered or not indicative of any shift, the anecdote would lose force."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "Antony Flew later became a deist, not a Christian, but this anecdote is about Habermas's perception at the time."}, {"story_id": "story-005", "title_or_label": "John Cook's Thesis on Paul's Bodily Resurrection View", "story_type": "illustration", "source_span": "P03 S133-S170", "characters_or_agents": ["John Cook", "Gary Habermas", "Ben", "Mike Licona", "Dale Allison", "Tom Wright", "Robert Gundry"], "setting_or_context": "Discussion of scholarly works on resurrection, particularly John Cook's volumes in a German series.", "plot_or_sequence": "Habermas describes how John Cook, a non-Christian scholar, begins his book with a thesis that Paul's view of the resurrection is of the same bodily appearances described in the Gospels, not a 'Casper' view. Habermas finds this stunning and notes it was unpopular but is now widely accepted. He also mentions similar comments by Tom Wright, Mike Licona, and Robert Gundry.", "intended_function": "illustrate", "claims_illustrated": ["A03"], "emotional_or_rhetorical_load": "High; emphasizes the surprising nature of a critical scholar affirming bodily resurrection.", "boundaries": {"what_it_shows": "Some critical scholars affirm that Paul believed in a bodily resurrection.", "what_it_does_not_show": "It does not prove that the resurrection actually happened; it only shows scholarly opinion on Paul's belief.", "what_would_falsify_the_narrative": "If Cook's thesis were misrepresented or if he later recanted, the illustration would be undermined."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "This is used to support the claim that even skeptical scholars admit early belief in bodily appearances."}, {"story_id": "story-006", "title_or_label": "Dale Allison's Easter Church Statement", "story_type": "testimony", "source_span": "P03 S186-S213", "characters_or_agents": ["Dale Allison", "Gary Habermas"], "setting_or_context": "Dale Allison's book on resurrection, volume three.", "plot_or_sequence": "Habermas reads a sentence from Dale Allison's book: 'I believe that the disciples saw Jesus and that he saw them and next Easter will find me in church.' Habermas finds this stunning and memorable, noting Allison is a critical scholar who nonetheless accepts the resurrection appearances.", "intended_function": "illustrate", "claims_illustrated": ["A03"], "emotional_or_rhetorical_load": "High; a personal statement of faith from a critical scholar is rhetorically powerful.", "boundaries": {"what_it_shows": "Dale Allison personally believes the disciples saw Jesus and plans to attend church.", "what_it_does_not_show": "It does not provide historical evidence for the resurrection; it is a personal testimony.", "what_would_falsify_the_narrative": "If Allison denied saying this or if the quote were taken out of context, it would be misleading."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "This quote is used to show that even critical scholars can accept the resurrection appearances."}, {"story_id": "story-007", "title_or_label": "The Jesus Seminar's Admission on the Creed", "story_type": "historical_anecdote", "source_span": "P03 S379-S398", "characters_or_agents": ["Jesus Seminar", "Paul", "Gary Habermas"], "setting_or_context": "Discussion of the dating of the 1 Corinthians 15 creed.", "plot_or_sequence": "Habermas notes that the Jesus Seminar, despite rejecting 91% of Jesus's words, admits that the creed in 1 Corinthians 15:3-5 existed before Paul's conversion. He argues this supports an early date in the 30s AD.", "intended_function": "persuade", "claims_illustrated": ["A04", "A08"], "emotional_or_rhetorical_load": "Moderate; uses an unlikely source (Jesus Seminar) to bolster the early dating.", "boundaries": {"what_it_shows": "Even a skeptical group like the Jesus Seminar dates the creed early.", "what_it_does_not_show": "It does not prove the resurrection happened; it only supports the early dating of the belief.", "what_would_falsify_the_narrative": "If the Jesus Seminar did not actually make this admission, the argument would be weakened."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "This is a key piece of evidence for Habermas's minimal facts argument."}, {"story_id": "story-008", "title_or_label": "Scholars Criticizing Each Other as Mini Book Reviews", "story_type": "illustration", "source_span": "P03 S422-S472", "characters_or_agents": ["Gary Habermas", "Dale", "Albert Schweitzer", "David Strauss", "Rudolf Bultmann", "Jimmy Dunn", "Mickey Mantle", "Babe Ruth"], "setting_or_context": "Habermas's section in volume three where scholars criticize other scholars.", "plot_or_sequence": "Habermas explains he included this section because he was interested in how scholars like Bultmann were criticized, and because these comments are like one-comment book reviews. He compares it to baseball players criticizing each other, and notes it humanizes the debate. He mentions David Strauss's harsh criticisms of other scholars.", "intended_function": "explain", "claims_illustrated": ["A05"], "emotional_or_rhetorical_load": "Moderate; uses humor and human interest to justify the section.", "boundaries": {"what_it_shows": "Scholars engage in personal criticism, which can be interesting and humanizing.", "what_it_does_not_show": "It does not provide evidence for the resurrection; it is about the sociology of scholarship.", "what_would_falsify_the_narrative": "If the section were shown to be merely ad hominem and not informative, its value would be questioned."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "This section is a unique feature of Habermas's volume three."}, {"story_id": "story-009", "title_or_label": "The Resurrection as a Miracle First Called in Volume Four", "story_type": "illustration", "source_span": "P03 S502-S509", "characters_or_agents": ["Gary Habermas"], "setting_or_context": "Discussion of volume four on theology and practice.", "plot_or_sequence": "Habermas states that not until volume four does he actually call the resurrection a miracle, even though he discusses miracles in volume one. He clarifies that in volume one he defines miracles but does not label the resurrection as one until volume four.", "intended_function": "explain", "claims_illustrated": ["A10"], "emotional_or_rhetorical_load": "Low; a clarification of terminology.", "boundaries": {"what_it_shows": "Habermas makes a terminological distinction about when he uses the word 'miracle' for the resurrection.", "what_it_does_not_show": "It does not affect the evidence for the resurrection; it is a semantic point.", "what_would_falsify_the_narrative": "If Habermas called the resurrection a miracle in an earlier volume, this claim would be false."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "This is a minor point about his writing."}, {"story_id": "story-010", "title_or_label": "The Resurrection of Believers as the Most Linked Theology", "story_type": "illustration", "source_span": "P03 S510-S521", "characters_or_agents": ["Gary Habermas", "his sister-in-law", "his wife"], "setting_or_context": "Discussion of the practical implications of the resurrection in volume four.", "plot_or_sequence": "Habermas notes that the New Testament links the resurrection of Jesus to the resurrection of believers more than any other theology, mentioning it about twenty times. He shares that his sister-in-law just died and his wife died in 1995, and at such times the hope of resurrection is practical. He also mentions that if the resurrection is true, it should affect how you spend your money and treat others.", "intended_function": "motivate", "claims_illustrated": ["A09", "A11"], "emotional_or_rhetorical_load": "High; personal grief and hope make the theological point poignant.", "boundaries": {"what_it_shows": "The resurrection has practical and emotional significance for believers, especially in grief.", "what_it_does_not_show": "It does not provide evidence for the resurrection; it assumes it to be true.", "what_would_falsify_the_narrative": "If the New Testament did not link the resurrection of believers to Jesus's resurrection, the claim would be false."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "This is a motivational illustration for the practical importance of the resurrection."}], "narrative_arc": {"opening_device": "Host Dale introduces the second half of the interview with Gary Habermas on volume three, focusing on scholarly perspectives.", "central_tension": "Clarifying Habermas's claim that he cites more critical than believing scholars, and defending his approach against misunderstandings, while also discussing the content of volume three.", "resolution_or_payoff": "Habermas clarifies his terminology (critical vs. believing, not Christian vs. non-Christian), shares memorable scholarly quotes, and discusses the practical implications of the resurrection, leading into volume four.", "return_to_opening": false}, "notes": "The paper is an interview transcript with two main speakers: Dale (host) and Gary Habermas. The stories are mostly anecdotes and illustrations used to support Habermas's points about scholarly views and his personal approach. None of the stories provide independent historical evidence for the resurrection; they serve rhetorical and explanatory purposes."}, "master_equation": {"core_relation": {"sentence": "The persuasiveness of the resurrection case depends on the convergence of multiple independent lines of evidence—early pre-Pauline creeds, the admitted eyewitness status of Paul, the bodily-resurrection testimony of both friendly and critical scholars, and the historical reliability of the sources—such that removing any one line weakens but does not by itself destroy the cumulative argument.", "quote": "What keeps the creeds from being expanded until they become myth? And they're not really the words of the eyewitnesses. Critics admit that Paul was an eyewitness. They admit that Paul's their hero, good guy. They like them. And they always grant those se first the seven books. [S401-S407]"}, "core_relation_run2": {"sentence": "The paper's argument is that scholarly citation practice—not the scholar's personal label—is what determines where a scholar stands on the resurrection, so the conclusion depends jointly on the ratio of critical citations to believing citations, the early dating of the creeds, and the charitable interpretation of context.", "quote": "What I meant was I will cite the liberals over and over and over more times than I will cite believers. [S266]"}, "product_test": {"run1": "additive", "run2": "additive", "status": "agreed", "quote": "So, if it if it can be taken either way in context, why don't you find five more places where I said it the the way you're blaming me with? Instead of using one cloudy one, why don't you give me five more clear ones? [S317-S318]", "reason": "Habermas's argument is explicitly cumulative: multiple early creeds, multiple sources, multiple scholars across the spectrum. He repeatedly asks for 'five more' instances rather than treating a single counterexample as fatal. The conclusion (resurrection is historically knowable) would be weakened but not zeroed by losing one line of evidence. The paper shows no single ingredient whose absence collapses the entire case."}, "slots": [{"slot": "G", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "External negentropy influx — the outside source that keeps the coherence of the resurrection testimony from dissipating into myth. For Habermas, this is the pre-Pauline creedal tradition that enters the historical record from outside Paul's own authorship and before his conversion.", "quote": "They said that creed or its component parts was already in existence before Paul took his walk to Damascus. [S388]"}, {"slot": "M", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "Alignment — the coupling between the researcher and the evidence. Habermas aligns with the data by reading critics and believers equally, refusing to prejudge who is a Christian.", "quote": "I have no right to label somebody a Christian or a non-Christian. [S015]"}, {"slot": "E", "fit_1": "direct", "fit_2": "direct", "status": "agreed", "plays_role": "Signal fidelity — whether the historical truth survives transmission through the noise of scholarly distortion and myth. The early creeds are the signal that must not be corrupted.", "quote": "What keeps the creeds from being expanded until they become myth? And they're not really the words of the eyewitnesses. [S401-S402]"}, {"slot": "S_eff", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "Effective entropy — the noise that lowers coherence: the gap between the resurrection event and the written sources, which critics claim allows myth to develop.", "quote": "33 to 48 is only 15 years. That's really But if you go with me with I'd say 30 to 50, that's 20 years. That's earlier than Mark, earlier in all the gospels. [S350-S352]"}, {"slot": "T", "fit_1": "direct", "fit_2": "direct", "status": "agreed", "plays_role": "Temporal integration — the accumulation of historical consequence over time. The shorter the gap between event and creed, the stronger the case; time turns possibility into accumulated evidence.", "quote": "33 to 48 is only 15 years. That's really But if you go with me with I'd say 30 to 50, that's 20 years. That's earlier than Mark, earlier in all the gospels. [S350-S352]"}, {"slot": "K", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "Compression — ordered meaning compresses and noise does not. The creeds are compressed summaries of the earliest eyewitness testimony; the minimal facts are a compression of the scholarly consensus.", "quote": "I often talk about the creeds. I have a lot I have a lot of stuff on the creeds. I often count the creeds. [S341-S343]"}, {"slot": "R", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "Phase transition — a threshold that changes state, not just degree. The conversion of a skeptic or the shift of a scholar's view (e.g., Jimmy Dunn moving right, Tony Flew's letter) is treated as a qualitative change.", "quote": "Read these six pages. It looks like he's converting to Christianity. [S049-S050]"}, {"slot": "Q", "fit_1": "analogous", "fit_2": "stretched", "status": "contested", "plays_role": "Superposition — open possibility stays unresolved until actualized. Habermas refuses to resolve the question of who is a Christian or where a person stands before God, leaving it open.", "quote": "I don't ever want to say whether I think so and so is a Christian var hs=document.createElement("div");s2.appendChild(hs);
charts.push(function(){hs.innerHTML='';var n=D.sentences.length,W=1000,cw=W/n,rh=15;var s=svgIn(hs,W+80,9*rh+24);
 FR.forEach(function(f,j){tx(s,74,j*rh+11,nm(f),{"text-anchor":"end","font-size":10});});
 D.sentences.forEach(function(r,i){for(var j=0;j<9;j++)el("rect",{x:80+i*cw,y:j*rh,width:cw+.1,height:rh-2,fill:r.v?div(r.v[j]):css("--grid")},s);});
 var hit=el("rect",{x:80,y:0,width:W,height:9*rh,fill:"transparent"},s);hover(hit,function(e){var b=hit.getBoundingClientRect();var i=Math.max(0,Math.min(n-1,Math.floor((e.clientX-b.left)/b.width*n)));return sentTip(D.sentences[i]);});
 var step=Math.max(1,Math.round(n/6));for(var i=0;i<n;i+=step)tx(s,80+i*cw,9*rh+14,D.sentences[i].id,{"font-size":9,"class":"mut"});
});
var pl=document.createElement("div");s2.appendChild(pl);
charts.push(function(){var P=SS.paragraph_love||{},T=SS.paragraph_total||{},ks=Object.keys(P);pl.innerHTML='<h3>Love by paragraph <small class="id">bar = mean love, dot = mean of all nine</small></h3>';if(!ks.length)return;
 var W=1000,bw=W/ks.length,H=90,mid=H/2;var s=svgIn(pl,W+40,H+18);el("line",{x1:30,y1:mid,x2:30+W,y2:mid,stroke:css("--axis")},s);
 tx(s,26,8,"+2",{"text-anchor":"end","font-size":9,"class":"mut"});tx(s,26,H,"−2",{"text-anchor":"end","font-size":9,"class":"mut"});
 ks.forEach(function(k,i){var v=P[k],h=v/2*mid,x=30+i*bw;var r=el("rect",{x:x+1,y:v>=0?mid-h:mid,width:Math.max(1,bw-2),height:Math.max(1,Math.abs(h)),fill:v>=0?css("--g2"):css("--b2"),rx:1.5},s);
  el("circle",{cx:x+bw/2,cy:mid-(T[k]||0)/2*mid/4,r:1.8,fill:css("--ink"),"fill-opacity":.5},s);hover(r,'<div class="t1">'+k+'</div>love '+v+' · all nine '+(T[k]||0));});
});
var sp=document.createElement("div");sp.className="grid2";s2.appendChild(sp);
function spikeList(t,a,cls){return '<div><h3>'+t+'</h3>'+((a||[]).length?'<ul class="q">'+a.map(function(x){return '<li><span class="pill '+cls+'">'+(x.sum>0?'+':'')+x.sum+'</span> <span class="id">'+x.id+'</span> “'+esc(x.text)+'”'+(Object.keys(x.why||{}).length?'<br><span class="id">'+esc(Object.keys(x.why).map(function(k){return k+': '+x.why[k];}).join('; '))+'</span>':'')+'</li>';}).join('')+'</ul>':'<p class="sub">None.</p>')+'</div>';}
sp.innerHTML=spikeList("Strongest toward the fruits",SS.top_toward,"pos")+spikeList("Strongest away",SS.top_away,"neg")+spikeList("Counterfeit candidates (fruit words, anti-fruit work)",SS.counterfeit_candidates,"neg")+spikeList("Hidden fruit (fruit work, no fruit words)",SS.hidden_fruit,"pos");
var FV=D.fruits||{};if(FV.fruit_profile){var vd=document.createElement("div");s2.appendChild(vd);
 vd.innerHTML='<h3>Paper verdict, rubric v0.3.0 <small class="id">'+esc(FV.epistemic_status)+' · '+esc(FV.system_status)+' · confidence '+FV.confidence+'</small></h3>';
 table(vd,["Fruit","Score 0–4","Confidence","Counterfeit","Rationale"],FV.fruit_profile.map(function(p){return [nm(p.fruit_id.split(".").pop()),'<b>'+p.score+'</b>',p.confidence,(p.counterfeit||{}).flag?'<span class="pill neg">yes</span>':'no',esc(p.rationale)];}));
 table(vd,["Gate","Status","Hard","Rationale"],(FV.gate_results||[]).map(function(g){return [esc(g.gate_id),'<span class="pill '+(g.status==="PASS"?"pos":g.status==="FAIL"?"neg":"neu")+'">'+g.status+'</span>',g.hard?"hard":"",esc(g.rationale)];}));
 if((FV.repair_path||[]).length)vd.insertAdjacentHTML("beforeend",'<h3>Repair path</h3><ul class="q">'+FV.repair_path.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>');}

/* 3 AXIOMS */
var AX=D.axiom_nodes||{};var s3=sec("ax","3 · Axiom nodes",(AX.axiom_nodes||[]).length+" engaged · primary mode "+esc(AX.primary_mode||"—"),esc(AX.summary||""));
table(s3,["Node","Name","Mode","Alignment","Confidence","Quote"],(AX.axiom_nodes||[]).map(function(n){var a=n.alignment||"";return ['<span class="id">'+esc(n.node_id)+'</span>',esc(n.name),esc(n.mode),'<span class="pill '+(a==="contested"?"neg":a==="directly_asserted"||a==="supported"?"pos":"neu")+'">'+esc(a)+'</span>',esc(n.confidence),esc(n.evidence_quote)];}));
if((AX.unmapped_claims||[]).length)s3.insertAdjacentHTML("beforeend",'<p class="sub">Unmapped atoms: '+AX.unmapped_claims.map(esc).join(', ')+'</p>');

/* 4 ATOMS */
var AT=D.atoms||{};var s4=sec("at","4 · Atoms",(AT.atoms||[]).length+" · domain "+esc(AT.domainType||"—"),esc(AT.summary||""));
table(s4,["Id","Type","Stage","Name","Plain statement","Falsified if","Sentences"],(AT.atoms||[]).map(function(a){return ['<span class="id">'+a.atom_id+'</span>',esc(a.nodeType),esc(a.stage),'<b>'+esc(a.name)+'</b>',esc(a.statementPlain),esc(a.falsificationCondition),'<span class="id">'+esc((a.source_sentences||[]).slice(0,8).join(', '))+((a.source_sentences||[]).length>8?'…':'')+'</span>'];}));

/* 5 LEAN */
var LE=D.lean4||{};var s5=sec("le","5 · Lean 4 formalization candidates",(LE.formal_candidates||[]).length+" targets","The Lean corpus was not searched in this run; these are targets, not results.");
table(s5,["Claim","Disposition","Object","Proposed statement","What remains open"],(LE.formal_candidates||[]).map(function(c){return [esc((c.identity||{}).claim_id),esc((c.source_selection||{}).selection_disposition),esc((c.formal_object||{}).object_type),esc((c.formal_object||{}).exact_proposed_statement),esc((c.result_and_boundary||{}).what_remains_open)];}));

/* 6 STORIES */
var STo=D.stories||{},arc=STo.narrative_arc||{};var s6=sec("st","6 · Stories",(STo.stories||[]).length+" found",arc.opening_device?'Arc: <b>'+esc(arc.opening_device)+'</b> → <b>'+esc(arc.central_tension)+'</b> → <b>'+esc(arc.resolution_or_payoff)+'</b> · returns to opening: '+arc.return_to_opening:"");
table(s6,["Story","Type","Function","Span","Shows","Does not show","Load-bearing"],(STo.stories||[]).map(function(x){var b=x.boundaries||{};return ['<b>'+esc(x.title_or_label)+'</b>',esc(x.story_type),esc(x.intended_function),'<span class="id">'+esc(x.source_span)+'</span>',esc(b.what_it_shows),esc(b.what_it_does_not_show),x.is_separable_from_argument===false?'<span class="pill neg">yes</span>':'no'];}));

/* 7 MASTER EQUATION */
var pt=me.product_test||{},cr=me.core_relation||{};var s7=sec("me","7 · Master equation analog","strength "+(me.analog_strength!=null?me.analog_strength:"—")+" ("+(me.analog_strength_spread||"")+") · two independent runs",
 'χ = G·M·E·S<sub>eff</sub>·T·K·R·Q·F·C. Core relation: '+esc(cr.sentence||cr)+'<br>Product test: <b>'+esc(pt.run1)+'</b> / <b>'+esc(pt.run2)+'</b> ('+esc(pt.status)+') — '+esc(pt.reason));
var mdv=document.createElement("div");s7.appendChild(mdv);
charts.push(function(){mdv.innerHTML='';var sl=me.slots||[];if(!sl.length)return;var s=svgIn(mdv,10*64+10,110),fit={direct:1,analogous:.66,stretched:.33,absent:0};
 sl.forEach(function(r,i){var cx=36+i*64,v1=fit[r.fit_1],v2=fit[r.fit_2],v=((v1||0)+(v2||0))/2;
  var c=el("circle",{cx:cx,cy:44,r:6+v*18,fill:v>=.66?css("--g2"):v>=.33?css("--g1"):css("--mid"),stroke:r.status==="contested"?css("--b2"):"none","stroke-width":2.5,"stroke-dasharray":r.status==="contested"?"4 2":"none"},s);
  tx(s,cx,96,r.slot,{"text-anchor":"middle","font-weight":600});hover(c,'<div class="t1">'+r.slot+' · '+esc(r.fit_1)+' / '+esc(r.fit_2)+' ('+r.status+')</div>'+esc(r.plays_role)+'<br><span style="color:var(--muted)">'+esc(r.quote)+'</span>');});
});
s7.insertAdjacentHTML("beforeend",'<p class="sub">Circle size = fit (direct &gt; analogous &gt; stretched &gt; absent), averaged over both runs. Dashed red ring = the two runs disagree.</p>'+(me.one_line?'<p>“'+esc(me.one_line)+'”</p>':''));

/* 8 COHERENCE */
var s8=sec("co","8 · Coherence",co.score!=null?co.score+"/"+(co.score_ceiling||10):"",esc(co.summary||""));
(D.coherence&&D.coherence.dimensions||[]).forEach(function(d){s8.insertAdjacentHTML("beforeend",'<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><b>'+esc(nm(d.name||""))+'</b><span class="id">'+d.score+'/10</span></div><div class="bar"><i style="width:'+(d.score||0)*10+'%;background:'+((d.score||0)>=7?css("--g2"):(d.score||0)>=5?css("--g1"):css("--b2"))+'"></i></div><div class="sub" style="margin-top:4px">'+esc((d.reasons||[]).join(' · '))+'</div></div>');});
["contradictions","tensions","missing_definitions"].forEach(function(k){var a=(D.coherence||{})[k]||[];if(a.length)s8.insertAdjacentHTML("beforeend",'<h3>'+nm(k)+'</h3><ul class="q">'+a.map(function(x){return '<li>'+(typeof x==="object"?(x.term?'<b>'+esc(x.term)+'</b>: ':'')+esc(x.description||x.note||JSON.stringify(x))+(x.severity?' <span class="pill neu">'+esc(x.severity)+'</span>':''):esc(x))+'</li>';}).join('')+'</ul>');});

/* 9 ALL SENTENCES */
var s9=sec("ss","9 · Every sentence","searchable","Nine cells per sentence in fruit order (love … self-control). Type to filter by text, id or trigger word.");
s9.insertAdjacentHTML("beforeend",'<input class="search" id="q" placeholder="Filter sentences…">');var tb=document.createElement("div");s9.appendChild(tb);
function sentRows(f){f=(f||"").toLowerCase();var rs=D.sentences.filter(function(s){return !f||(s.id+" "+s.t+" "+JSON.stringify(s.x)+" "+JSON.stringify(s.w)).toLowerCase().indexOf(f)>=0;});
 tb.innerHTML='';table(tb,["Id","Fruits","Sentence","Why / trigger words"],rs.map(function(s){return ['<span class="id">'+s.id+'<br>'+s.p+'</span>','<span style="white-space:nowrap">'+FR.map(function(fr,j){var v=s.v?s.v[j]:null;return '<span class="cell" title="'+nm(fr)+' '+v+'" style="background:'+div(v)+';color:'+(Math.abs(v||0)===2?"#fff":"inherit")+'">'+(v?(v>0?'+':'−'):'')+'</span>';}).join('')+'</span>',esc(s.t),'<span class="id">'+esc(Object.keys(s.w).map(function(k){return k+': '+s.w[k];}).concat(Object.keys(s.x).map(function(k){return k.replace('_',' ')+': '+s.x[k].join(', ');})).join(' · '))+'</span>'];}));}
document.getElementById("q").addEventListener("input",function(e){sentRows(e.target.value);});

/* AUDIT */
var sa=sec("au","Audit","","Each call's tokens; reused = taken from an earlier run because its prompt had not changed.");
table(sa,["Call","Tokens","Status"],D.calls.map(function(c){return [esc(c.name),c.tokens.toLocaleString(),c.error?'<span class="pill neg">'+esc(c.error)+'</span>':c.reused?'<span class="pill neu">reused</span>':'<span class="pill pos">ok</span>'];}));

render();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",render);
</script></body></html>
