entPlain": "Having strong evidence matters much more than having a majority of scholars agree.", "claimClass": "definition", "falsificationCondition": "If it can be shown that scholarly consensus alone is sufficient for rational belief, or that high evidence is not necessary, the claim is falsified.", "verificationStatus": "informal", "challengeStatus": "challenged-open", "edges": [{"type": "dependsOn", "target": "", "grade": "structural_identity", "propagates": true}], "source_sentences": ["S325", "S326", "S327", "S329", "S330", "S385", "S403"], "atom_id": "A02"}, {"nodeType": "claim", "stage": "01_canonical", "name": "Habermas does not use a numerical threshold for evidence", "statementTechnical": "Habermas does not require a specific percentage or number of evidences to consider a fact highly evidenced; he uses categories like multiple attestation, eyewitness, and early sources.", "statementPlain": "Gary doesn't say you need a certain percentage of evidence; he looks for things like many sources, eyewitnesses, and early accounts.", "claimClass": "definition", "falsificationCondition": "If Habermas is shown to consistently apply a numerical threshold, the claim is falsified.", "verificationStatus": "informal", "challengeStatus": "challenged-open", "edges": [{"type": "dependsOn", "target": "", "grade": "structural_identity", "propagates": true}], "source_sentences": ["S206", "S213", "S214", "S225", "S226", "S227", "S228", "S229", "S230"], "atom_id": "A03"}, {"nodeType": "claim", "stage": "01_canonical", "name": "Habermas has never counted scholarly consensus percentages except for the empty tomb", "statementTechnical": "Habermas has not conducted a numerical count of scholarly support for the minimal facts, except for a study on the empty tomb.", "statementPlain": "Gary hasn't actually counted what percentage of scholars agree on most things, except for the empty tomb.", "claimClass": "empirical-anchor", "falsificationCondition": "If evidence shows Habermas has cou  var hit=el("rect",{x:80,y:0,width:W,height:9*rh,fill:"transparent"},s);hover(hit,function(e){var b=hit.getBoundingClientRect();var i=Math.max(0,Math.min(n-1,Math.floor((e.clientX-b.left)/b.width*n)));return sentTip(D.sentences[i]);});
 var step=Math.max(1,Math.round(n/6));for(var i=0;i<n;i+=step)tx(s,80+i*cw,9*rh+14,D.sentences[i].id,{"font-size":9,"class":"mut"});
});

 var W=1000,bw=W/ks.length,H=90,mid=H/2;var s=svgIn(pl,W+40,H+18);el("line",{x1:30,y1:mid,x2:30+W,y2:mid,stroke:css("--axis")},s);

 ks.forEach(function(k,i){var v=P[k],h=v/2*mid,x=30+i*bw;var r=el("rect",{x:x+1,y:v>=0?mid-h:mid,width:Math.max(1,bw-2),height:Math.max(1,Math.abs(h)),fill:v>=0?css("--g2"):css("--b2"),rx:1.5},s);
  el("circle",{cx:x+bw/2,cy:mid-(T[k]||0)/2*mid/4,r:1.8,fill:css("--ink"),"fill-opacity":.5},s);hover(r,'<div class="t1">'+k+'</div>love '+v+' · all nine '+(T[k]||0));});
});

 table(vd,["Gate","Status","Hard","Rationale"],(FV.gate_results||[]).map(function(g){return [esc(g.gate_id),'<span class="pill '+(g.status==="PASS"?"pos":g.status==="FAIL"?"neg":"neu")+'">'+g.status+'</span>',g.hard?"hard":"",esc(g.rationale)];}));

table(s6,["Story","Type","Function","Span","Shows","Does not show","Load-bearing"],(STo.stories||[]).map(function(x){var b=x.boundaries||{};return ['<b>'+esc(x.title_or_label)+'</b>',esc(x.story_type),esc(x.intended_function),'<span class="id">'+esc(x.source_span)+'</span>',esc(b.what_it_shows),esc(b.what_it_does_not_show),x.is_separable_from_argument===false?'<span class="pill neg">yes</span>':'no'];}));

  var c=el("circle",{cx:cx,cy:44,r:6+v*18,fill:v>=.66?css("--g2"):v>=.33?css("--g1"):css("--mid"),stroke:r.status==="contested"?css("--b2"):"none","stroke-width":2.5,"stroke-dasharray":r.status==="contested"?"4 2":"none"},s);
  tx(s,cx,96,r.slot,{"text-anchor":"middle","font-weight":600});hover(c,'<div class="t1">'+r.slot+' · '+esc(r.fit_1)+' / '+esc(r.fit_2)+' ('+r.status+')</div>'+esc(r.plays_role)+'<br><span style="color:var(--muted)">'+esc(r.quote)+'</span>');});
});
