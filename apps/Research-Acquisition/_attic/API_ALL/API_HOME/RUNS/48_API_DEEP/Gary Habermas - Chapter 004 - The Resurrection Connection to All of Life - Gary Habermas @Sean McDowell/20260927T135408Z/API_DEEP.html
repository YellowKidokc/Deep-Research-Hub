ing_premises": "Jesus rose bodily, and believers will rise bodily. This is a theological premise.", "non_vacuity_requirement": "The propositional atoms must be independently instantiable to avoid vacuous implication."}, "verification_controls": [{"check": "module compilation", "command_or_evidence": "lake build ResurrectionFormalization.Death", "status": "NOT_RUN", "interpretation": "Lean corpus was not searched; no build attempted."}, {"check": "proof escape", "command_or_evidence": "Check for sorry in the proof.", "status": "NOT_RUN", "interpretation": "Requires a complete proof term."}], "result_and_boundary": {"verification_status": "CANDIDATE", "what_is_established": "A formal implication chain from bodily resurrection to the removal of the fear of death. This captures the logical structure of the claim.", "what_remains_open": "Whether the premises are true. The Lean model does not establish any historical or theological fact.", "encoding_fidelity_review": "The model is a simple propositional chain. It does not capture the richness of 'bodily resurrection' or 'fear of death'; it only captures the logical implication.", "interpretive_connections": "Connects to S291-S296 where Habermas discusses Plato, Philippians 1:23, and Philippians 3:10."}, "reproduction_receipt": {"run_id": "", "timestamp": "", "source_hashes": {}, "commands": [], "exit_codes": [], "log_paths": [], "declarations_checked": []}, "corpus_links": {"human_companion": "", "corpus_claim_register": "", "supporting_summaries": []}}], "existing_matches": [], "notes": "The Lean corpus was not searched in this run. All verification controls are NOT_RUN and all verification statuses are CANDIDATE or NOT_ATTEMPTED. The formal candidates are structural models of the logical shape of the claims, not proofs of their theological or historical truth. No reproduction receipts or corpus links are provided because no Lean build was executed."}, "stories": {"station": "stories", "paper_uuid": "Gary Habermas - Chapter 004 - The Resurrection Connection to All of Life - Gary Habermas @Sean McDowell", "run_uuid": "deep-c61084f7fb40", "stories": [{"story_id": "story-001", "title_or_label": "Habermas's personal journey from evidential apologetics to theology and practice", "story_type": "testimony", "source_span": "P03 S024-S042; P04 S113-S191; P05 S532-S559", "characters_or_agents": ["Gary Habermas", "Sean McDowell", "Habermas's first wife", "Eileen (second wife)"], "setting_or_context": "Habermas's academic career and personal life, spanning from his PhD through 1990-1995 and up to the present (age 76).", "plot_or_sequence": "Habermas began by studying the historical evidence for the resurrection because he went through serious doubt after his PhD, almost leaving the faith. Around 1990-1995, a conviction grew that he needed to relate the resurrection to theology and practice. His first wife died of stomach cancer in 1995. He later wrote a four-volume defense of the resurrection, with the fourth volume on meaning and practice. His second wife, Eileen, was diagnosed with pancreatic cancer. He continues to hold to the resurrection as the center of everything, including suffering.", "intended_function": "motivate", "claims_illustrated": ["A01", "A02", "A03", "A04", "A05", "A06", "A07", "A08", "A09"], "emotional_or_rhetorical_load": "High. Personal grief, doubt, and perseverance are used to motivate the audience to take the resurrection seriously in all of life.", "boundaries": {"what_it_shows": "Habermas personally experienced doubt, suffering, and loss, and found the resurrection to be central to his faith and practice.", "what_it_does_not_show": "It does not provide historical evidence that the resurrection occurred, nor does it prove that the resurrection is the correct explanation for his experiences.", "what_would_falsify_the_narrative": "If Habermas had abandoned Christianity or found the resurrection irrelevant to his suffering, the narrative would be falsified."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "This testimony is used to illustrate the practical relevance of the resurrection but does not serve as evidence for its truth."}, {"story_id": "story-002", "title_or_label": "The parable of the Good Samaritan as a model for radical commitment", "story_type": "parable", "source_span": "P04 S074-S087", "characters_or_agents": ["Jesus", "a lawyer", "a man beaten on the road", "a Samaritan", "an innkeeper"], "setting_or_context": "A dialogue between Jesus and a lawyer about the greatest commandment, followed by the parable.", "plot_or_sequence": "A lawyer asks Jesus what he must do to inherit eternal life. Jesus asks him what the law says. The lawyer answers: love God with all your heart, soul, strength, and mind, and love your neighbor as yourself. The lawyer asks, 'Who is my neighbor?' Jesus tells the parable of the Good Samaritan, who sacrificially helps a beaten man, and ends with 'Go and do likewise.'", "intended_function": "illustrate", "claims_illustrated": ["A02"], "emotional_or_rhetorical_load": "Moderate. The parable is familiar and evokes a sense of moral obligation.", "boundaries": {"what_it_shows": "It illustrates that radical commitment involves sacrificial love for others, as exemplified by the Samaritan.", "what_it_does_not_show": "It does not prove that the resurrection occurred or that such commitment is salvific; it is an illustration of a command.", "what_would_falsify_the_narrative": "If the parable were not in the biblical text or if Jesus did not intend it as a model, the illustration would lose its force."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "This is a biblical parable used to illustrate the ethical implications of the resurrection."}, {"story_id": "story-003", "title_or_label": "Marriage analogy for radical commitment", "story_type": "illustration", "source_span": "P04 S078-S080; S088-S091", "characters_or_agents": ["a married couple"], "setting_or_context": "Habermas uses the analogy of marriage to explain the radical commitment Christians should have to Jesus.", "plot_or_sequence": "When people marry, they say to each other, 'All of me belongs to you, and all of you belongs to me.' Similarly, when we come to know Jesus, we say that to Him. After marriage, good works naturally follow as a response to the relationship.", "intended_function": "explain", "claims_illustrated": ["A02"], "emotional_or_rhetorical_load": "Low to moderate. It uses a familiar relationship to make an abstract commitment concrete.", "boundaries": {"what_it_shows": "It shows that radical commitment is a total self-giving, analogous to marriage, and that good works are a natural outflow.", "what_it_does_not_show": "It does not prove that this commitment is required or that it is salvific; it is an analogy.", "what_would_falsify_the_narrative": "If marriage did not involve mutual self-giving or if good works did not follow from a relationship, the analogy would be weakened."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "This analogy is used to explain the relationship between grace and works."}, {"story_id": "story-004", "title_or_label": "Joseph Son's response to Russian guards", "story_type": "historical_anecdote", "source_span": "P05 S223-S227", "characters_or_agents": ["Joseph Son", "Russian guards"], "setting_or_context": "Eastern European pastor under persecution, likely during the Soviet era.", "plot_or_sequence": "Joseph Son told his Russian guards that if they took his life, they would be doing him a favor by sending him to heaven faster. He kept saying this for years, and eventually the guards left him alone, afraid to do anything to him.", "intended_function": "illustrate", "claims_illustrated": ["A03", "A05"], "emotional_or_rhetorical_load": "Moderate. It uses a dramatic example of courage in the face of persecution.", "boundaries": {"what_it_shows": "It illustrates how belief in the resurrection and heaven can remove the fear of death and neutralize persecution.", "what_it_does_not_show": "It does not provide evidence that the resurrection occurred or that Joseph Son's belief was justified; it is an anecdote.", "what_would_falsify_the_narrative": "If Joseph Son had been killed or had recanted, the anecdote would lose its illustrative power."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "This anecdote is used to illustrate the practical power of resurrection hope under persecution."}, {"story_id": "story-005", "title_or_label": "Habermas's use of cognitive therapy to overcome fear", "story_type": "testimony", "source_span": "P06 S313-S336", "characters_or_agents": ["Gary Habermas", "the Holy Spirit"], "setting_or_context": "Habermas's personal struggle with fear related to his wife's cancer.", "plot_or_sequence": "Habermas, dealing with his wife's cancer, prayed to feel the Holy Spirit's power. He began practicing a discipline: every time fear came into his mind, he would say, 'Time out. What does the resurrection say about this?' and bring the resurrection to mind. Within about a week, the fear stopped coming.", "intended_function": "motivate", "claims_illustrated": ["A04", "A06"], "emotional_or_rhetorical_load": "High. It is a personal, vulnerable account of applying the resurrection to emotional struggle.", "boundaries": {"what_it_shows": "It shows that Habermas personally found the resurrection to be an effective counter to fear and emotional doubt.", "what_it_does_not_show": "It does not prove that this method works for everyone or that the resurrection is true; it is a personal testimony.", "what_would_falsify_the_narrative": "If Habermas's fear had not subsided or if he had abandoned this practice, the testimony would be weakened."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "This testimony is used to illustrate the practical application of the resurrection to emotional doubt."}, {"story_id": "story-006", "title_or_label": "The card with the message about walking hand in hand in heaven", "story_type": "testimony", "source_span": "P06 S392-S405", "characters_or_agents": ["Gary Habermas", "his deceased first wife"], "setting_or_context": "After the death of Habermas's first wife, he received a card.", "plot_or_sequence": "Habermas kept the last card he received after his wife died. It said, 'What are you going to do when you walk down the streets of heaven hand in hand with your deceased wife?' He reflects that this is the resurrection, and if the resurrection lets him see her again, he can wait.", "intended_function": "motivate", "claims_illustrated": ["A05", "A07"], "emotional_or_rhetorical_load": "Very high. It is a deeply personal and emotional illustration of resurrection hope.", "boundaries": {"what_it_shows": "It shows how the hope of resurrection and heaven can comfort someone grieving the loss of a spouse.", "what_it_does_not_show": "It does not provide evidence for the resurrection or heaven; it is a personal reflection.", "what_would_falsify_the_narrative": "If Habermas had lost hope or if the card had not provided comfort, the testimony would be weakened."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "This testimony is used to illustrate the comfort of resurrection hope in grief."}, {"story_id": "story-007", "title_or_label": "The publisher who was convicted by volume four", "story_type": "testimony", "source_span": "P07 S429-S440", "characters_or_agents": ["a publisher", "Gary Habermas", "Sean McDowell"], "setting_or_context": "A publisher read the manuscript of volume four and was deeply moved.", "plot_or_sequence": "A publisher told Habermas that while reading the manuscript of volume four, he was so convicted about applying the resurrection to his own life that he dropped to his knees beside his bed and cried out to God for forgiveness for not making a better application.", "intended_function": "persuade", "claims_illustrated": ["A08"], "emotional_or_rhetorical_load": "High. It uses a third-party testimony to show the transformative power of the book's message.", "boundaries": {"what_it_shows": "It shows that at least one reader found the material on applying the resurrection to be personally convicting and transformative.", "what_it_does_not_show": "It does not prove that the resurrection is true or that the book's application is correct; it is an anecdote.", "what_would_falsify_the_narrative": "If the publisher had not had this reaction or if the story were fabricated, the testimony would be falsified."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "This testimony is used to persuade the audience of the practical value of the resurrection."}, {"story_id": "story-008", "title_or_label": "John Wesley's radical giving", "story_type": "historical_anecdote", "source_span": "P07 S524-S526", "characters_or_agents": ["John Wesley", "widows and orphans"], "setting_or_context": "John Wesley's practice of giving away all his money.", "plot_or_sequence": "John Wesley would immediately pass out freewill offerings to the widows and orphans who sat in the front row. He said, 'If I die and you find 20 pounds in my pocket, I have renounced the Lord.'", "intended_function": "illustrate", "claims_illustrated": ["A02"], "emotional_or_rhetorical_load": "Moderate. It provides a striking example of radical commitment and simple living.", "boundaries": {"what_it_shows": "It illustrates the principle of radical commitment and simple living as an application of the resurrection.", "what_it_does_not_show": "It does not prove that Wesley's practice is normative or that the resurrection is true; it is an anecdote.", "what_would_falsify_the_narrative": "If Wesley had not practiced such giving or if the quote were misattributed, the anecdote would be weakened."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "This anecdote is used to illustrate the radical commitment that Habermas argues flows from the resurrection."}, {"story_id": "story-009", "title_or_label": "Habermas's thought experiment about asking God why suffering happened", "story_type": "thought_experiment", "source_span": "P08 S542-S554", "characters_or_agents": ["Gary Habermas", "God", "Paul"], "setting_or_context": "Habermas imagines the afterlife and asking God about the reasons for suffering.", "plot_or_sequence": "Habermas says that in heaven he will take a 'postgrad course' with Paul or someone else and find out why suffering happened. He imagines God explaining it in one sentence, and he will be glad he did not walk away from Christianity over that question.", "intended_function": "explain", "claims_illustrated": ["A09"], "emotional_or_rhetorical_load": "Moderate. It uses a hypothetical scenario to make the problem of suffering more bearable.", "boundaries": {"what_it_shows": "It shows how belief in an afterlife can provide hope that suffering will be explained and made right.", "what_it_does_not_show": "It does not provide an actual answer to the problem of suffering or evidence for the afterlife; it is a thought experiment.", "what_would_falsify_the_narrative": "If there is no afterlife or if God does not provide explanations, the thought experiment would be falsified."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "This thought experiment is used to illustrate how resurrection hope can help believers live with unanswered questions about suffering."}], "narrative_arc": {"opening_device": "Sean McDowell introduces Gary Habermas and the topic of the resurrection's centrality to all of life.", "central_tension": "How can the resurrection be practically connected to all areas of life, especially suffering, doubt, and persecution?", "resolution_or_payoff": "Habermas argues that the resurrection is the center of everything, providing hope, power over sin and fear, and the promise of heaven, and he shares personal testimonies of its application.", "return_to_opening": true}, "notes": "The paper is a conversational interview with many personal testimonies and illustrations. The stories are primarily used to motivate and illustrate the claims, not to provide evidence for the resurrection. The narrative arc is cyclical, returning to the theme of the resurrection's centrality."}, "master_equation": {"core_relation": {"sentence": "The resurrection is the central, non-removable linchpin of the Christian message and practice: remove it and the whole gospel, all doctrine, and all practical application collapse.", "quote": "Paul says, 'Remove that one thing and forget all the heavy theology we talk about.' ... If it's not for X, you know, and that X is the resurrection. It gives meaning to the deity, the death, the resurrection, what we call the gospel message. But all of pastoral theology, all of practice [S051][S054][S055][S056]"}, "core_relation_run2": {"sentence": "The resurrection is the necessary, all-or-nothing center of the gospel, theology, practice, and every application of the Christian life; remove it and everything else collapses.", "quote": "Paul says, \"Remove that one thing and forget all the heavy theology we talk about.\" [S005]"}, "product_test": {"run1": "multiplicative", "run2": "multiplicative", "status": "agreed", "quote": "It's everything. Paul says, 'Remove that one thing and forget all the heavy theology we talk about.' [S004][S005] / So you need the resurrection to complete the gospel. [S035] / if Jesus died but does wasn't raised his death was in vain. [S034]", "reason": "The paper repeatedly states that removing the resurrection zeroes out the gospel, the cross, all doctrine, and all practice; it is not merely weakened but rendered void. This is the zero-collapse structure of a multiplicative relation."}, "slots": [{"slot": "G", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "External negentropy influx: the resurrection itself as the outside source that sustains meaning, hope, and coherence in life, especially under suffering and doubt.", "quote": "if Jesus is raised from the dead, I've got nothing but pain. As bad as that is, I've got nothing but pain to worry about. It doesn't mess with my message. [S232][S233][S234]"}, {"slot": "M", "fit_1": "direct", "fit_2": "analogous", "status": "contested", "plays_role": "Alignment: radical commitment and love of God with all heart, soul, strength, and mind; marriage as total mutual belonging.", "quote": "Love God with all your heart, soul, strength of mind. ... I use the example of um marriage uh when we get married basically we're saying to each other all of me belongs to you. All of you belongs to me. [S081][S078][S079]"}, {"slot": "E", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "Signal fidelity: truth that survives transmission, especially the minimal facts argument that the resurrection can be known even if the Bible has errors.", "quote": "if there are errors in scripture and you think you're going to disprove Christianity, you're barking up the wrong tree. And that's why the minimal facts argument says I can get there without. [S157][S158]"}, {"slot": "S_eff", "fit_1": "direct", "fit_2": "analogous", "status": "contested", "plays_role": "Effective entropy: suffering, emotional doubt, fear of death, and sin as the disorder that lowers coherence and is counteracted by resurrection truth.", "quote": "Emotional doubts by far the most common 70 to 80%. ... what's the for the Christian, what's the what's the counter? It's it's the gospel message is the truth. What's the center of the gospel message? The resurrection. [S240][S250][S251][S252][S253]"}, {"slot": "T", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "Temporal integration: time as the arena where resurrection faith is applied repeatedly, questions are lived with, and heaven is awaited.", "quote": "I can wait for heaven if it means seeing her again, but I'm only going to get there if I stay true to the Lord and I have the resurrection. [S404]"}, {"slot": "K", "fit_1": "direct", "fit_2": "analogous", "status": "contested", "plays_role": "Compression: the gospel message compresses to the core formula 'deity, death, resurrection' and the resurrection as the one essential truth.", "quote": "Deity, death, resurrection. If that's true, whatever you say about the New Testament doesn't stop the gospel message. [S201][S202]"}, {"slot": "R", "fit_1": "direct", "fit_2": "analogous", "status": "contested", "plays_role": "Phase transition: the resurrection as the threshold event that changes everything—if true, Christianity is true; if false, the cross means nothing.", "quote": "And if Jesus rose from the dead, Christianity is true. That's the one evidential point I'd like people want to hear here. If there's a resurrection, Christianity is true. [S203][S204][S205]"}, {"slot": "Q", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "Superposition: unresolved questions about suffering and God's purposes are held open, with the resurrection as the guarantee that answers exist.", "quote": "There may be answers, but that doesn't mean Gary Habermass knows the answers. But I can trust God who's omnipotent, omnicient, underpresent, omni, benevolent. [S576][S577]"}, {"slot": "F", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "Non-local correlation: communal resurrection—believers are raised together with Christ, and the resurrection connects all doctrines and practices.", "quote": "He says I'm suffering from these questions but you and I it's communal resurrection. He says you and I will be raised together and sit with Christ in heaven. [S594][S595]"}, {"slot": "C", "fit_1": "direct", "fit_2": "analogous", "status": "contested", "plays_role": "Integration: the resurrection as the local integrator inside the product—it is the nexus that ties together deity, death, gospel, pastoral theology, and practice.", "quote": "All these things are tied together, but the nexus is easily the deity, death, and resurrection. And the nexus of that nexus is the resurrection because Paul said, 'You don't have any of the others without that.' [S039][S040]"}], "contested": ["M", "S_eff", "K", "R", "C"], "analog_strength": 3, "analog_strength_spread": "3-4", "confidence": ["medium", "medium"], "one_line": "The resurrection functions as the multiplicative linchpin of Christian life and thought, analogous to the master equation's product structure where removing it collapses the whole.", "breaks": ["The paper treats the resurrection as a binary historical fact rather than a continuous variable; the master equation's factors are generally continuous, so the analogy is more discrete than the reference.", "The role of G (external negentropy) is not a separate input but is identified with the resurrection itself, collapsing the distinction between source and event.", "The paper's 'radical commitment' (M) is said to be a response to grace, not a co-requisite for salvation; this introduces a directional asymmetry not present in the symmetric product of the master equation.", "The Holy Spirit is mentioned as an agent but not mapped to a distinct slot, suggesting an extra factor without a clear slot.", "The paper treats the resurrection as a single non-negotiable factor, whereas the master equation is a product of ten distinct factors; the paper does not distinguish separate multiplicative components.", "The paper's 'radical commitment' (M) is presented as a response to grace, not as a factor that must be non-zero for the gospel to be true; it is more consequence than condition.", "The paper does not treat S_eff as a factor that can be zeroed out; suffering is real but not a variable that can collapse the equation.", "The paper's logic is more binary (resurrection true/false) than multiplicative across ten slots."], "extra_factors": [["The Holy Spirit as the one who brings about conviction and application (S438-S439).", "The role of community and mentorship (e.g., Ben Shaw, Mike Licona) as transmitters of the resurrection message (S466-S467)."], ["Heaven as the conclusion and unbreakable chain from resurrection", "The Holy Spirit as the agent of application and conviction", "Scripture (New Testament) as the source of evidence and truth"]], "equations_present": false}, "master_equation_b": null, "coherence": {"station": "coherence_score", "paper_uuid": "Gary Habermas - Chapter 004 - The Resurrection Connection to All of Life - Gary Habermas @Sean McDowell", "run_uuid": "deep-c61084f7fb40", "overall": {"score": 8, "score_ceiling": 10, "status": "ASSESSED", "summary": "The chapter's claims cohere tightly around a single central thesis—the resurrection as the nexus of doctrine, practice, suffering, doubt, and hope—with only minor definitional looseness and one unresolved tension between radical commitment and salvation by grace."}, "dimensions": [{"name": "internal_consistency", "score": 8, "reasons": ["A01 (S003-S008, S049-S058) and A09 (S187, S555-S559) consistently place the resurrection at the center of everything, including suffering; no claim contradicts this.", "A02 (S073-S102) explicitly reconciles radical commitment with salvation by grace ('not by, but unto' good works, S092-S098), preempting the most obvious internal contradiction.", "A03 (S198-S234) and A05 (S288-S302) reinforce rather than compete with A01's centrality claim; suffering and death are both subsumed under the resurrection's hope.", "A04 (S238-S256) and A06 (S313-S336) both prescribe the same cognitive move ('what does the resurrection say about this?'), so the practical claims are mutually reinforcing rather than conflicting.", "Minor tension: A02's call to 'give everything' (S099-S101) sits alongside Habermas's admission charts.push(function(){hs.innerHTML='';var n=D.sentences.length,W=1000,cw=W/n,rh=15;var s=svgIn(hs,W+80,9*rh+24);
 FR.forEach(function(f,j){tx(s,74,j*rh+11,nm(f),{"text-anchor":"end","font-size":10});});
 D.sentences.forEach(function(r,i){for(var j=0;j<9;j++)el("rect",{x:80+i*cw,y:j*rh,width:cw+.1,height:rh-2,fill:r.v?div(r.v[j]):css("--grid")},s);});
 var hit=el("rect",{x:80,y:0,width:W,height:9*rh,fill:"transparent"},s);hover(hit,function(e){var b=hit.getBoundingClientRect();var i=Math.max(0,Math.min(n-1,Math.floor((e.clientX-b.left)/b.width*n)));return sentTip(D.sentences[i]);});
 var step=Math.max(1,Math.round(n/6));for(var i=0;i<n;i+=step)tx(s,80+i*cw,9*rh+14,D.sentences[i].id,{"font-size":9,"class":"mut"});
});
var pl=document.createElement("div");s2.appendChild(pl);
charts.push(function(){var P=SS.paragraph_love||{},T=SS.paragraph_total||{},ks=Object.keys(P);pl.innerHTML='<h3>Love by paragraph <small class="id">bar = mean love, dot = mean of all nine</small></h3>';if(!ks.length)return;
 var W=1000,bw=W/ks.length,H=90,mid=H/2;var s=svgIn(pl,W+40,H+18);el("line",{x1:30,y1:mid,x2:30+W,y2:mid,stroke:css("--axis")},s);
 tx(s,26,8,"+2",{"text-anchor":"end","font-size":9,"class":"mut"});tx(s,26,H,"−2",{"text-anchor":"end","font-size":9,"class":"mut"});
 ks.forEach(function(k,i){var v=P[k],h=v/2*mid,x=30+i*bw;var r=el("rect",{x:x+1,y:v>=0?mid-h:mid,width:Math.max(1,bw-2),height:Math.max(1,Math.abs(h)),fill:v>=0?css("--g2"):css("--b2"),rx:1.5},s);
  el("circle",{cx:x+bw/2,cy:mid-(T[k]||0)/2*mid/4,r:1.8,fill:css("--ink"),"fill-opacity":.5},s);hover(r,'<div class="t1">'+k+'</div>love '+v+' · all nine '+(T[k]||0));});
});
var sp=document.createElement("div");sp.className="grid2";s2.appendChild(sp);
function spikeList(t,a,cls){return '<div><h3>'+t+'</h3>'+((a||[]).length?'<ul class="q">'+a.map(function(x){return '<li><span class="pill '+cls+'">'+(x.sum>0?'+':'')+x.sum+'</span> <span class="id">'+x.id+'</span> “'+esc(x.text)+'”'+(Object.keys(x.why||{}).length?'<br><span class="id">'+esc(Object.keys(x.why).map(function(k){return k+': '+x.why[k];}).join('; '))+'</span>':'')+'</li>';}).join('')+'</ul>':'<p class="sub">None.</p>')+'</div>';}
sp.innerHTML=spikeList("Strongest toward the fruits",SS.top_toward,"pos")+spikeList("Strongest away",SS.top_away,"neg")+spikeList("Counterfeit candidates (fruit words, anti-fruit work)",SS.counterfeit_candidates,"neg")+spikeList("Hidden fruit (fruit work, no fruit words)",SS.hidden_fruit,"pos");
var FV=D.fruits||{};if(FV.fruit_profile){var vd=document.createElement("div");s2.appendChild(vd);
 vd.innerHTML='<h3>Paper verdict, rubric v0.3.0 <small class="id">'+esc(FV.epistemic_status)+' · '+esc(FV.system_status)+' · confidence '+FV.confidence+'</small></h3>';
 table(vd,["Fruit","Score 0–4","Confidence","Counterfeit","Rationale"],FV.fruit_profile.map(function(p){return [nm(p.fruit_id.split(".").pop()),'<b>'+p.score+'</b>',p.confidence,(p.counterfeit||{}).flag?'<span class="pill neg">yes</span>':'no',esc(p.rationale)];}));
 table(vd,["Gate","Status","Hard","Rationale"],(FV.gate_results||[]).map(function(g){return [esc(g.gate_id),'<span class="pill '+(g.status==="PASS"?"pos":g.status==="FAIL"?"neg":"neu")+'">'+g.status+'</span>',g.hard?"hard":"",esc(g.rationale)];}));
 if((FV.repair_path||[]).length)vd.insertAdjacentHTML("beforeend",'<h3>Repair path</h3><ul class="q">'+FV.repair_path.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>');}

/* 3 AXIOMS */
var AX=D.axiom_nodes||{};var s3=sec("ax","3 · Axiom nodes",(AX.axiom_nodes||[]).length+" engaged · primary mode "+esc(AX.primary_mode||"—"),esc(AX.summary||""));
table(s3,["Node","Name","Mode","Alignment","Confidence","Quote"],(AX.axiom_nodes||[]).map(function(n){var a=n.alignment||"";return ['<span class="id">'+esc(n.node_id)+'</span>',esc(n.name),esc(n.mode),'<span class="pill '+(a==="contested"?"neg":a==="directly_asserted"||a==="supported"?"pos":"neu")+'">'+esc(a)+'</span>',esc(n.confidence),esc(n.evidence_quote)];}));
if((AX.unmapped_claims||[]).length)s3.insertAdjacentHTML("beforeend",'<p class="sub">Unmapped atoms: '+AX.unmapped_claims.map(esc).join(', ')+'</p>');

/* 4 ATOMS */
var AT=D.atoms||{};var s4=sec("at","4 · Atoms",(AT.atoms||[]).length+" · domain "+esc(AT.domainType||"—"),esc(AT.summary||""));
table(s4,["Id","Type","Stage","Name","Plain statement","Falsified if","Sentences"],(AT.atoms||[]).map(function(a){return ['<span class="id">'+a.atom_id+'</span>',esc(a.nodeType),esc(a.stage),'<b>'+esc(a.name)+'</b>',esc(a.statementPlain),esc(a.falsificationCondition),'<span class="id">'+esc((a.source_sentences||[]).slice(0,8).join(', '))+((a.source_sentences||[]).length>8?'…':'')+'</span>'];}));

/* 5 LEAN */
var LE=D.lean4||{};var s5=sec("le","5 · Lean 4 formalization candidates",(LE.formal_candidates||[]).length+" targets","The Lean corpus was not searched in this run; these are targets, not results.");
table(s5,["Claim","Disposition","Object","Proposed statement","What remains open"],(LE.formal_candidates||[]).map(function(c){return [esc((c.identity||{}).claim_id),esc((c.source_selection||{}).selection_disposition),esc((c.formal_object||{}).object_type),esc((c.formal_object||{}).exact_proposed_statement),esc((c.result_and_boundary||{}).what_remains_open)];}));

/* 6 STORIES */
var STo=D.stories||{},arc=STo.narrative_arc||{};var s6=sec("st","6 · Stories",(STo.stories||[]).length+" found",arc.opening_device?'Arc: <b>'+esc(arc.opening_device)+'</b> → <b>'+esc(arc.central_tension)+'</b> → <b>'+esc(arc.resolution_or_payoff)+'</b> · returns to opening: '+arc.return_to_opening:"");
table(s6,["Story","Type","Function","Span","Shows","Does not show","Load-bearing"],(STo.stories||[]).map(function(x){var b=x.boundaries||{};return ['<b>'+esc(x.title_or_label)+'</b>',esc(x.story_type),esc(x.intended_function),'<span class="id">'+esc(x.source_span)+'</span>',esc(b.what_it_shows),esc(b.what_it_does_not_show),x.is_separable_from_argument===false?'<span class="pill neg">yes</span>':'no'];}));

/* 7 MASTER EQUATION */
var pt=me.product_test||{},cr=me.core_relation||{};var s7=sec("me","7 · Master equation analog","strength "+(me.analog_strength!=null?me.analog_strength:"—")+" ("+(me.analog_strength_spread||"")+") · two independent runs",
 'χ = G·M·E·S<sub>eff</sub>·T·K·R·Q·F·C. Core relation: '+esc(cr.sentence||cr)+'<br>Product test: <b>'+esc(pt.run1)+'</b> / <b>'+esc(pt.run2)+'</b> ('+esc(pt.status)+') — '+esc(pt.reason));
var mdv=document.createElement("div");s7.appendChild(mdv);
charts.push(function(){mdv.innerHTML='';var sl=me.slots||[];if(!sl.length)return;var s=svgIn(mdv,10*64+10,110),fit={direct:1,analogous:.66,stretched:.33,absent:0};
 sl.forEach(function(r,i){var cx=36+i*64,v1=fit[r.fit_1],v2=fit[r.fit_2],v=((v1||0)+(v2||0))/2;
  var c=el("circle",{cx:cx,cy:44,r:6+v*18,fill:v>=.66?css("--g2"):v>=.33?css("--g1"):css("--mid"),stroke:r.status==="contested"?css("--b2"):"none","stroke-width":2.5,"stroke-dasharray":r.status==="contested"?"4 2":"none"},s);
  tx(s,cx,96,r.slot,{"text-anchor":"middle","font-weight":600});hover(c,'<div class="t1">'+r.slot+' · '+esc(r.fit_1)+' / '+esc(r.fit_2)+' ('+r.status+')</div>'+esc(r.plays_role)+'<br><span style="color:var(--muted)">'+esc(r.quote)+'</span>');});
});
s7.insertAdjacentHTML("beforeend",'<p class="sub">Circle size = fit (direct &gt; analogous &gt; stretched &gt; absent), averaged over both runs. Dashed red ring = the two runs disagree.</p>'+(me.one_line?'<p>“'+esc(me.one_line)+'”</p>':''));

/* 8 COHERENCE */
var s8=sec("co","8 · Coherence",co.score!=null?co.score+"/"+(co.score_ceiling||10):"",esc(co.summary||""));
(D.coherence&&D.coherence.dimensions||[]).forEach(function(d){s8.insertAdjacentHTML("beforeend",'<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><b>'+esc(nm(d.name||""))+'</b><span class="id">'+d.score+'/10</span></div><div class="bar"><i style="width:'+(d.score||0)*10+'%;background:'+((d.score||0)>=7?css("--g2"):(d.score||0)>=5?css("--g1"):css("--b2"))+'"></i></div><div class="sub" style="margin-top:4px">'+esc((d.reasons||[]).join(' · '))+'</div></div>');});
["contradictions","tensions","missing_definitions"].forEach(function(k){var a=(D.coherence||{})[k]||[];if(a.length)s8.insertAdjacentHTML("beforeend",'<h3>'+nm(k)+'</h3><ul class="q">'+a.map(function(x){return '<li>'+(typeof x==="object"?(x.term?'<b>'+esc(x.term)+'</b>: ':'')+esc(x.description||x.note||JSON.stringify(x))+(x.severity?' <span class="pill neu">'+esc(x.severity)+'</span>':''):esc(x))+'</li>';}).join('')+'</ul>');});

/* 9 ALL SENTENCES */
var s9=sec("ss","9 · Every sentence","searchable","Nine cells per sentence in fruit order (love … self-control). Type to filter by text, id or trigger word.");
s9.insertAdjacentHTML("beforeend",'<input class="search" id="q" placeholder="Filter sentences…">');var tb=document.createElement("div");s9.appendChild(tb);
function sentRows(f){f=(f||"").toLowerCase();var rs=D.sentences.filter(function(s){return !f||(s.id+" "+s.t+" "+JSON.stringify(s.x)+" "+JSON.stringify(s.w)).toLowerCase().indexOf(f)>=0;});
 tb.innerHTML='';table(tb,["Id","Fruits","Sentence","Why / trigger words"],rs.map(function(s){return ['<span class="id">'+s.id+'<br>'+s.p+'</span>','<span style="white-space:nowrap">'+FR.map(function(fr,j){var v=s.v?s.v[j]:null;return '<span class="cell" title="'+nm(fr)+' '+v+'" style="background:'+div(v)+';color:'+(Math.abs(v||0)===2?"#fff":"inherit")+'">'+(v?(v>0?'+':'−'):'')+'</span>';}).join('')+'</span>',esc(s.t),'<span class="id">'+esc(Object.keys(s.w).map(function(k){return k+': '+s.w[k];}).concat(Object.keys(s.x).map(function(k){return k.replace('_',' ')+': '+s.x[k].join(', ');})).join(' · '))+'</span>'];}));}
document.getElementById("q").addEventListener("input",function(e){sentRows(e.target.value);});

/* AUDIT */
var sa=sec("au","Audit","","Each call's tokens; reused = taken from an earlier run because its prompt had not changed.");
table(sa,["Call","Tokens","Status"],D.calls.map(function(c){return [esc(c.name),c.tokens.toLocaleString(),c.error?'<span class="pill neg">'+esc(c.error)+'</span>':c.reused?'<span class="pill neu">reused</span>':'<span class="pill pos">ok</span>'];}));

render();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",render);
</script></body></html>
