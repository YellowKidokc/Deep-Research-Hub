[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FolderWatcher"
version = "1.0.0"
description = "A reusable folder-watcher plugin for Linux and macOS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
folder-watcher = "FolderWatcher:_cli_entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["FolderWatcher*"]
