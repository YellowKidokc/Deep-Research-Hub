# DRIFT RUBRIC
# Defines how to measure δ (drift) = misalignment + pressure
# Version: minimal_v1
# Last Updated: 2026-01-15

version: "minimal_v1"

# δ₁: Misalignment - Claimed vs Observed
# Maps entity claims to measurable metrics
misalignment_mappings:
  
  # For Nations
  nation:
    constitutional_claims:
      - claim: "equal protection under law"
        metrics:
          - name: "corruption_index"
            source: "Transparency International CPI"
            expected: "> 70"  # Higher = less corrupt
            weight: 1.0
          
          - name: "rule_of_law"
            source: "World Justice Project"
            expected: "> 0.7"
            weight: 1.0
      
      - claim: "promote general welfare"
        metrics:
          - name: "poverty_rate"
            source: "World Bank"
            expected: "< 10"  # Percent
            weight: 0.8
          
          - name: "life_expectancy"
            source: "WHO"
            expected: "> 75"  # Years
            weight: 0.6
    
    founding_principles:
      - claim: "family as basic unit"
        metrics:
          - name: "marriage_rate"
            source: "Census Bureau"
            expected: "> 6.5"  # Per 1000
            weight: 0.7
          
          - name: "birth_rate"
            source: "CDC"
            expected: "> 2.1"  # Replacement level
            weight: 0.8
  
  # For Religions
  religion:
    moral_commands:
      - claim: "care for poor and widow"
        metrics:
          - name: "charitable_giving"
            source: "Giving USA"
            expected: "> 2.0"  # Percent of income
            weight: 1.0
          
          - name: "volunteer_hours"
            source: "Bureau of Labor Statistics"
            expected: "> 50"  # Hours per year
            weight: 0.8
      
      - claim: "preserve marriage covenant"
        metrics:
          - name: "divorce_rate"
            source: "CDC NCHS"
            expected: "< 3.0"  # Per 1000
            weight: 0.9
    
    community_claims:
      - claim: "love one another"
        metrics:
          - name: "trust_index"
            source: "General Social Survey"
            expected: "> 0.4"  # Fraction trusting
            weight: 1.0


# δ₂: Decoherence Pressure - Entropy winning
# Detects when system is losing coherence despite efforts
pressure_detectors:
  
  trend_loss:
    description: "Negative slope in χ over time"
    method: "linear_regression"
    parameters:
      window_years: 5
      threshold: -0.05  # Slope threshold for "losing"
  
  volatility:
    description: "High variance indicates fragility"
    method: "rolling_std"
    parameters:
      window_years: 5
      threshold: 0.15  # Std dev threshold
  
  correction_failure:
    description: "Reforms/policies don't improve trend"
    method: "intervention_test"
    parameters:
      lookback_years: 2
      min_improvement: 0.02  # Min χ increase post-intervention


# Weight allocation
weights:
  w_misalignment: 0.5  # How much δ₁ contributes to total δ
  w_pressure: 0.5      # How much δ₂ contributes to total δ


# Interpretation thresholds
interpretation:
  high_drift: "> 0.5"
  moderate_drift: "0.2 - 0.5"
  minor_drift: "0.0 - 0.2"
  stable: "≤ 0.0"
