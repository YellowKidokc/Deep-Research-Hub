[Integrations]
; Master switch for all companion applications.
Enabled=1

; Delay lets the main AI-HUB finish building its GUI first.
StartupDelayMs=2500

; Each tool runs in its own AutoHotkey v2 process.
; AI-HUB already provides Ctrl+Alt+T to pin/unpin the active window.
; Keep the imported standalone source available without launching a duplicate.
AlwaysOnTop=0
ExtraClipboard=0
LLMAssistant=1
Stratum=1
WindowCaptureRouter=0
CommandCenter=1
