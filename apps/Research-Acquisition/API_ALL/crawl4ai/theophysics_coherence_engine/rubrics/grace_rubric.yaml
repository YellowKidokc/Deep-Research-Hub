# GRACE RUBRIC
# Defines how to detect and classify Grace (G) events
# Version: residual_v1
# Last Updated: 2026-01-15

version: "residual_v1"

# Grace Detection Parameters
detection:
  method: "residual_analysis"
  description: "G = χ_observed - χ_predicted from internal dynamics"
  
  prediction_model:
    type: "trend_with_drift"
    window_years: 5
    includes_drift: true
  
  threshold:
    minimum_magnitude: 0.1  # |G| must exceed this to count as event
    confidence_level: 0.7    # How certain before classifying


# Grace Event Taxonomy
# Classifies detected residuals by signature
event_types:
  
  resource_windfall:
    code: "G+"
    description: "External resource injection"
    signatures:
      - type: "economic"
        indicators:
          - "sudden GDP jump"
          - "aid/loan influx"
          - "commodity boom"
          - "trade surplus spike"
      
      - type: "technological"
        indicators:
          - "major innovation adoption"
          - "productivity leap"
    
    expected_effects:
      - "short-term χ increase"
      - "may not sustain without internalization"
    
    examples:
      - "Marshall Plan for Europe"
      - "Oil discovery in Norway"
      - "Tech boom 1990s"
  
  
  existential_threat:
    code: "G-"
    description: "Crisis forcing unity (paradoxical positive)"
    signatures:
      - type: "military"
        indicators:
          - "invasion"
          - "war declaration"
          - "territorial threat"
      
      - type: "collapse_pressure"
        indicators:
          - "hyperinflation"
          - "regime collapse risk"
          - "societal breakdown imminent"
    
    expected_effects:
      - "rapid trust increase"
      - "voluntary cooperation spike"
      - "corruption reduction"
      - "shared sacrifice"
    
    paradox: "Threat increases coherence by forcing alignment"
    
    examples:
      - "Britain 1940 (Dunkirk → unity)"
      - "Israel 1967/1973"
      - "US post-Pearl Harbor"
  
  
  revival:
    code: "Gr"
    description: "Moral/spiritual rebind - voluntary behavior change"
    signatures:
      - type: "behavioral"
        indicators:
          - "trust index sudden jump"
          - "voluntary giving spike"
          - "fertility rebound"
          - "marriage rate increase"
          - "crime rate drop"
      
      - type: "institutional"
        indicators:
          - "legitimacy restoration"
          - "scandal rate drop"
          - "corruption decrease"
      
      - type: "narrative"
        indicators:
          - "documented revival movement"
          - "mass behavioral shift"
          - "community reformation"
    
    expected_effects:
      - "sustained χ increase"
      - "self-reinforcing"
      - "multi-generational impact"
    
    key_distinction: "Not forced by external threat - voluntary internal change"
    
    examples:
      - "Second Great Awakening (US 1790-1840)"
      - "Welsh Revival (1904-1905)"
      - "Meiji Restoration moral component (Japan 1868)"
  
  
  unknown_positive:
    code: "G?"
    description: "Positive residual without clear signature"
    when_to_use:
      - "G > threshold"
      - "No matching external events"
      - "No clear behavioral signature"
    
    interpretation: "Exogenous factor present but unidentified"


# Attribution Rules
# How to decide which event type applies
attribution:
  priority:
    - "If behavioral_signature AND no_external_resource → revival"
    - "If existential_threat AND unity_spike → existential_threat"
    - "If resource_influx AND economic_data → resource_windfall"
    - "Else → unknown_positive"
  
  confidence_factors:
    high_confidence: "> 0.8"
      - "Multiple signature indicators present"
      - "Historical documentation"
      - "Clear mechanism"
    
    medium_confidence: "0.5 - 0.8"
      - "Some signature indicators"
      - "Plausible mechanism"
    
    low_confidence: "< 0.5"
      - "Residual detected but unclear cause"


# Change-Point Detection
# For identifying structural breaks
changepoint:
  method: "cusum"  # Cumulative Sum control chart
  parameters:
    threshold: 5.0
    drift: 0.5
  
  alternatives:
    - "bayesian_online"  # Bayesian Online Change Point Detection
    - "ruptures_binseg"  # Binary Segmentation (ruptures library)


# Grace Effect Duration
# How long should grace effects persist?
persistence:
  resource_windfall:
    typical_duration: "2-5 years"
    decay_pattern: "exponential"
  
  existential_threat:
    typical_duration: "5-10 years"
    decay_pattern: "linear then plateau"
  
  revival:
    typical_duration: "20-50 years"
    decay_pattern: "slow decay or multi-generational"
    note: "May spark self-sustaining coherence"


# Interpretation Thresholds
interpretation:
  major_grace: "|G| > 0.3"
  moderate_grace: "|G| = 0.1-0.3"
  minor_grace: "|G| = 0.05-0.1"
  noise: "|G| < 0.05"
