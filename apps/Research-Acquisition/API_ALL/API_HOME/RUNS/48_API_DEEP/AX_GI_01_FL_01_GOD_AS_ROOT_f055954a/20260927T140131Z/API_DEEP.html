"v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S261", "p": "P72", "t": "In the completions.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S262", "p": "P73", "t": "The more science explains, the clearer the portrait gets.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S263", "p": "P73", "t": "God does not live in what we do not know.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S264", "p": "P73", "t": "God is written into what we DO know.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S265", "p": "P73", "t": "We just were not reading it together.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {"fruit": ["just"]}}, {"id": "S266", "p": "P74", "t": "Bonhoeffer saw this in 1944 and wrote it from prison: we should not use God as a stopgap for the incompleteness of our knowledge.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S267", "p": "P74", "t": "The theologians who make that argument are building on sand.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S268", "p": "P74", "t": "They are betting that science will stop.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S269", "p": "P74", "t": "It will not.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S270", "p": "P74", "t": "This framework does not make that argument.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {"grounding": ["framework"], "academic_jargon": ["framework"]}}, {"id": "S271", "p": "P74", "t": "It makes the opposite argument.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {"contradiction": ["opposite"]}}, {"id": "S272", "p": "P74", "t": "And it has data.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {"grounding": ["data"]}}, {"id": "S273", "p": "P75", "t": "## Holding God Accountable", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {"fruit": ["accountable"]}}, {"id": "S274", "p": "P76", "t": "If God is Truth, the framework must let its claims be tested, corrected, and held to account.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 1], "w": {}, "x": {"fruit": ["truth", "corrected"], "grounding": ["framework", "tested"], "academic_jargon": ["framework"]}}, {"id": "S275", "p": "P76", "t": "This is the method page.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S276", "p": "P77", "t": "The Cross-Resolution Method requires every major claim to be read in the register where it belongs:", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S277", "p": "P78", "t": "- **Theology:** what Christian doctrine, Scripture, and confession say.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S278", "p": "P78", "t": "- **Physics:** what established models, equations, and experiments permit or forbid by themselves.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S279", "p": "P78", "t": "- **Mathematics:** what follows from definitions and proofs.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S280", "p": "P78", "t": "- **Lived reality:** what people actually recognize in conscience, grief, love, guilt, beauty, and hope.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {"fruit": ["conscience", "love", "hope"], "contradiction": ["actually"]}}, {"id": "S281", "p": "P78", "t": "- **Bridge:** where the same structure appears across registers as analogy, resonance, model, theorem, convergence, or open conjecture.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {"fruit": ["open"], "grounding": ["appears", "model"]}}, {"id": "S282", "p": "P79", "t": "Physics is not allowed to smuggle in theology.", "v": [0, 0, 0, 0, 0, 0, 1, 0, 1], "w": {}, "x": {}}, {"id": "S283", "p": "P79", "t": "Theology is not allowed to rescue weak physics.", "v": [0, 0, 0, 0, 0, 0, 1, 0, 1], "w": {}, "x": {}}, {"id": "S284", "p": "P79", "t": "Story is not allowed to pretend it is proof.", "v": [0, 0, 0, 0, 0, 0, 1, 0, 1], "w": {}, "x": {"fruit": ["proof"], "grounding": ["proof"]}}, {"id": "S285", "p": "P79", "t": "Formal proof is not allowed to pretend it has captured the whole meaning of lived experience.", "v": [0, 0, 0, 0, 0, 0, 1, 0, 1], "w": {}, "x": {"fruit": ["proof", "whole"], "anti_fruit": ["lived experience"], "grounding": ["proof"]}}, {"id": "S286", "p": "P80", "t": "But when the same structure appears across registers, we do not dismiss it merely because it crosses a boundary.", "v": [0, 0, 1, 0, 0, 0, 0, 0, 0], "w": {}, "x": {"grounding": ["appears", "because"], "contradiction": ["but"]}}, {"id": "S287", "p": "P80", "t": "We mark the bridge, name its strength, state its limits, and keep testing.", "v": [0, 0, 0, 1, 0, 0, 1, 0, 1], "w": {}, "x": {}}, {"id": "S288", "p": "P80", "t": "No hidden upgrades.", "v": [0, 0, 0, 0, 0, 0, 1, 0, 1], "w": {}, "x": {}}, {"id": "S289", "p": "P81", "t": "## The Necessary Ground", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S290", "p": "P82", "t": "If closed systems collapse and the universe has not collapsed, then something external sustains it.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S291", "p": "P82", "t": "If coherence and decoherence are real, measurable, and universal, then the source of coherence must be equally real and universal.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {"fruit": ["source"], "grounding": ["source"]}}, {"id": "S292", "p": "P83", "t": "What are the required properties of that source?", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {"fruit": ["source"], "grounding": ["source"]}}, {"id": "S293", "p": "P84", "t": "1. **Necessary** -- it cannot not exist, or the system collapses.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {"propaganda": ["the system"]}}, {"id": "S294", "p": "P84", "t": "2. **Self-grounding** -- it cannot depend on something else (infinite regress).", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S295", "p": "P84", "t": "3. **Origin of coherence** -- it must be the source of truth, order, beauty, goodness, life.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {"fruit": ["source", "truth", "goodness"], "grounding": ["source"]}}, {"id": "S296", "p": "P84", "t": "4. **Active** -- passive maintenance is thermodynamically impossible (the Second Law).", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S297", "p": "P84", "t": "5. **Personal** -- only persons can ground moral facts (moral realism).", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S298", "p": "P85", "t": "Those properties have had a name for thousands of years:", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S299", "p": "P86", "t": "| Mathematical Requirement | Theological Term |", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S300", "p": "P86", "t": "| Necessary existence | Aseity |", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S301", "p": "P86", "t": "| Self-grounding | Self-sufficiency |", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S302", "p": "P86", "t": "| Eternal | Eternality |", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S303", "p": "P86", "t": "| Universal | Omnipresence |", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S304", "p": "P86", "t": "| Origin of coherence | Logos (Reason/Order) |", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S305", "p": "P86", "t": "| Active sustenance | Providence |", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S306", "p": "P86", "t": "| Personal ground of morality | Personhood |", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S307", "p": "P87", "t": "Here is what is remarkable: we did not start from theology and work toward physics.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S308", "p": "P87", "t": "We started from five mathematical proofs and arrived at the exact description theologians have been writing about since the beginning.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {"fruit": ["exact"], "grounding": ["exact"]}}, {"id": "S309", "p": "P88", "t": "The math gave us all the tools to find Him.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {"propaganda": ["all"]}}, {"id": "S310", "p": "P88", "t": "And then -- in the deepest irony in the history of thought -- those same tools prove they cannot prove Him from within themselves.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S311", "p": "P88", "t": "Godel guarantees it.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S312", "p": "P88", "t": "The answer is real, necessary, and unprovable from inside the system it sustains.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {"propaganda": ["the system"]}}, {"id": "S313", "p": "P89", "t": "## The Narrative Maps", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S314", "p": "P90", "t": "### The Descent", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S315", "p": "P91", "t": "The whole causal chain in 24 steps: God creates.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {"fruit": ["whole"]}}, {"id": "S316", "p": "P91", "t": "Creation stands.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S317", "p": "P91", "t": "What stands is distinguishable.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S318", "p": "P91", "t": "Distinction makes being intelligible.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S319", "p": "P91", "t": "What is intelligible carries information.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S320", "p": "P91", "t": "What carries information can stand in relation.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S321", "p": "P91", "t": "What can stand in relation can be kept or broken, ordered or disordered, honored or violated.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x": {}}, {"id": "S322", "p": "P91", "t": "Therefore relation reveals value.", "v": [0, 0, 0, 0, 0, 0, 0, 0, 0], "w": {}, "x" ype and show SameGapType fails.", "status": "NOT_RUN", "interpretation": "Confirms the predicate is not vacuous."}], "result_and_boundary": {"verification_status": "CANDIDATE", "what_is_established": "If formalized, the definition and theorem would establish that the ten law pairs as listed share a common missing-variable type. This is a bookkeeping result about the paper's own table.", "what_remains_open": "Whether the physical laws actually have the properties the paper attributes to them; whether the spiritual readings are warranted; whether the shared gap is evidence of a single Person rather than a coincidence or an artifact of the paper's framing.", "encoding_fidelity_review": "The formalization is faithful to the paper's table but does not engage the physics. The 'missing variable' is treated as a type-level annotation, not as a substantive claim about the laws.", "interpretive_connections": "Connects to A04 (God in the completions) and to the paper's kill condition (S410: 'a force with no matching structure')."}, "reproduction_receipt": {"run_id": "", "timestamp": "", "source_hashes": {}, "commands": [], "exit_codes": [], "log_paths": [], "declarations_checked": []}, "corpus_links": {"human_companion": "", "corpus_claim_register": "", "supporting_summaries": []}}, {"identity": {"claim_id": "A06", "candidate_uuid": "lc-0004-A06-descent-chain"}, "source_selection": {"exact_source_expression": "Follow being all the way down and you arrive at the Cross. [P91-S315..S338]", "selection_disposition": "FORMALIZE", "reason": "The Descent is presented as a 24-step causal chain with the explicit claim 'No premise smuggled. No step skipped.' (S339–S340). This is a claim of logical validity of a chain of implications. It can be formalized as a sequence of implications in Lean, with each step as a hypothesis and the conclusion as the final step. The formalization would test whether the chain is valid as stated."}, "formal_object": {"object_type": "THEOREM", "exact_proposed_statement": "Given a sequence of propositions P1, ..., P24 corresponding to the 24 steps of the Descent, and given implications P1 → P2, P2 → P3, ..., P23 → P24, the conclusion P24 (Christ is the convergence point) follows from P1 (God creates).", "fully_qualified_declaration": "GodAsRoot.Descent.descent_chain_valid", "project_root": "GodAsRoot", "module": "GodAsRoot.Descent"}, "symbol_table": [{"term": "DescentStep", "formal_definition": "inductive DescentStep : Type | s01 | s02 | ... | s24", "reader_meaning": "The 24 steps of the causal chain.", "source_correspondence": "P91-S315..S338"}, {"term": "StepProp", "formal_definition": "def StepProp : DescentStep → Prop | s01 => GodCreates | s02 => CreationStands | ... | s24 => ChristConvergence", "reader_meaning": "The proposition asserted at each step.", "source_correspondence": "P91-S315..S338"}, {"term": "ChainValid", "formal_definition": "def ChainValid : Prop := ∀ n, n < 24 → StepProp n → StepProp (n+1)", "reader_meaning": "Each step implies the next.", "source_correspondence": "P91-S339..S340"}], "assumptions_and_dependencies": {"explicit_premises": ["The 24 steps are as listed in S315–S338.", "Each step's proposition is well-defined.", "Each implication StepProp n → StepProp (n+1) holds."], "custom_axioms": ["The implications themselves are the substantive content; if assumed as axioms, the theorem is trivial. The formalization challenge is to derive them from more basic premises."], "theological_starting_premises": "The first step (God creates) is a theological premise. The chain is conditional on it.", "non_vacuity_requirement": "The chain must have at least one step and the propositions must be jointly satisfiable."}, "verification_controls": [{"check": "module compilation", "command_or_evidence": "lake build GodAsRoot.Descent", "status": "NOT_RUN", "interpretation": "Not attempted."}, {"check": "declaration inspection", "command_or_evidence": "#check GodAsRoot.Descent.descent_chain_valid", "status": "NOT_RUN", "interpretation": "Proposed declaration."}, {"check": "negative control", "command_or_evidence": "Remove one implication and show the conclusion no longer follows.", "status": "NOT_RUN", "interpretation": "Confirms each step is load-bearing."}], "result_and_boundary": {"verification_status": "CANDIDATE", "what_is_established": "If formalized with the implications as hypotheses, the theorem establishes only that the chain is valid as a sequence of implications. It does not establish that any step is true.", "what_remains_open": "Whether each implication is actually true; whether the steps are correctly identified; whether the chain is complete (no smuggled premises).", "encoding_fidelity_review": "The formalization captures the logical structure but not the content of each step. The paper's claim 'No premise smuggled' (S339) is a claim about the derivation of each implication, which is not formalized here.", "interpretive_connections": "Connects to A05 (necessary ground) and to the paper's CDR grammar (S409)."}, "reproduction_receipt": {"run_id": "", "timestamp": "", "source_hashes": {}, "commands": [], "exit_codes": [], "log_paths": [], "declarations_checked": []}, "corpus_links": {"human_companion": "", "corpus_claim_register": "", "supporting_summaries": []}}, {"identity": {"claim_id": "A09", "candidate_uuid": "lc-0005-A09-empty-tomb-physics"}, "source_selection": {"exact_source_expression": "The empty tomb says the pattern outlives the substrate and decay gets reversed from outside. [P61-S219..S223]", "selection_disposition": "FORMALIZE", "reason": "The paper explicitly frames the empty tomb as two physics claims: (1) information survives the destruction of its container, and (2) entropy gets locally reversed by connecting the system to an external source. These are precise enough to be stated as formal propositions about information preservation and entropy reversal in open systems."}, "formal_object": {"object_type": "THEOREM", "exact_proposed_statement": "In a physical system S with a substrate and a pattern, if the pattern is encoded in the substrate and the substrate is destroyed, then the pattern can survive only if it is also encoded in a source external to S. Furthermore, if S is a closed system with increasing entropy, then a local decrease in entropy in S requires an external source of order.", "fully_qualified_declaration": "GodAsRoot.EmptyTomb.pattern_survives_substrate_and_entropy_reversed", "project_root": "GodAsRoot", "module": "GodAsRoot.EmptyTomb"}, "symbol_table": [{"term": "PhysicalSystem", "formal_definition": "structure PhysicalSystem where Substrate : Type; Pattern : Type; encodes : Substrate → Pattern → Prop; Entropy : ℝ; Closed : Prop", "reader_meaning": "A physical system with a substrate, a pattern, an encoding relation, and an entropy value.", "source_correspondence": "P61-S219..S223"}, {"term": "SubstrateDestroyed", "formal_definition": "def SubstrateDestroyed (S : PhysicalSystem) : Prop := ∀ s : S.Substrate, False", "reader_meaning": "The substrate no longer exists.", "source_correspondence": "P61-S221"}, {"term": "PatternSurvives", "formal_definition": "def PatternSurvives (S : PhysicalSystem) (p : S.Pattern) : Prop := ∃ s : S.Substrate, S.encodes s p", "reader_meaning": "The pattern is still encoded somewhere.", "source_correspondence": "P61-S221"}, {"term": "ExternalSource", "formal_definition": "def ExternalSource (S : PhysicalSystem) : Prop := ∃ T : PhysicalSystem, T ≠ S ∧ T.Entropy < S.Entropy", "reader_meaning": "A source outside S with lower entropy.", "source_correspondence": "P61-S223"}], "assumptions_and_dependencies": {"explicit_premises": ["The pattern is encoded in the substrate.", "The substrate is destroyed.", "The system is closed and its entropy increases.", "A local entropy decrease requires an external source."], "custom_axioms": ["The claim that information cannot be destroyed (a physical principle, not a theorem of pure logic).", "The Second Law of Thermodynamics for closed systems."], "theological_starting_premises": "The identification of the empty tomb with these physics claims is a bridge claim. The physics claims themselves are conditional.", "non_vacuity_requirement": "There must exist at least one physical system with a substrate and a pattern."}, "verification_controls": [{"check": "module compilation", "command_or_evidence": "lake build GodAsRoot.EmptyTomb", "status": "NOT_RUN", "interpretation": "Not attempted."}, {"check": "declaration inspection", "command_or_evidence": "#check GodAsRoot.EmptyTomb.pattern_survives_substrate_and_entropy_reversed", "status": "NOT_RUN", "interpretation": "Proposed declaration."}, {"check": "negative control", "command_or_evidence": "Construct a system where the pattern is only encoded in the substrate and show it does not survive destruction.", "status": "NOT_RUN", "interpretation": "Confirms the external-source hypothesis is needed."}], "result_and_boundary": {"verification_status": "CANDIDATE", "what_is_established": "If formalized, the theorem would establish conditional claims: pattern survival requires external encoding, and local entropy decrease requires an external source. These are restatements of known physics principles.", "what_remains_open": "Whether the empty tomb actually occurred; whether the pattern of a person is the kind of thing that can be externally encoded; whether the external source is God.", "encoding_fidelity_review": "The formalization captures the structural claims but not the empirical content. The paper's claim that the empty tomb 'proves' these things is stronger than what the formalization supports.", "interpretive_connections": "Connects to A05 (necessary ground) and to the paper's CDR grammar (S409)."}, "reproduction_receipt": {"run_id": "", "timestamp": "", "source_hashes": {}, "commands": [], "exit_codes": [], "log_paths": [], "declarations_checked": []}, "corpus_links": {"human_companion": "", "corpus_claim_register": "", "supporting_summaries": []}}], "existing_matches": [], "notes": "The Lean corpus was not searched in this run. All verification controls are NOT_RUN and all verification statuses are CANDIDATE or NOT_ATTEMPTED. The five candidates are ordered by strength of formalizability: A05 (necessary ground) is the strongest because the paper itself presents it as a mathematical argument with five requirements; A01 (ground axiom) is a meta-mathematical claim; A03 (ten laws) is a structural bookkeeping claim; A06 (Descent) is a logical-validity claim; A09 (empty tomb) is a physics-conditional claim. Claims A02, A04, A07, A08, A10–A17, A19–A21 were not selected for formalization because they are either narrative, methodological, empirical, or question-form claims that do not admit precise Lean statements without substantial additional interpretation. No existing Lean declarations were searched or matched."}, "stories": {"station": "stories", "paper_uuid": "AX_GI_01_FL_01_GOD_AS_ROOT_f055954a", "run_uuid": "deep-c4257a456793", "stories": [{"story_id": "st_001", "title_or_label": "The Ground Before the Building (axiom-floor metaphor)", "story_type": "illustration", "source_span": "P06-P15, S009-S045", "characters_or_agents": [], "setting_or_context": "Formal systems and their foundational axioms", "plot_or_sequence": "Every formal system has a floor it cannot dig beneath. Set theory pays nine axioms, Peano arithmetic five, general relativity two. This framework pays one: God. The axiom cannot be proven, and that inability is the signature of a genuine Layer 0.", "intended_function": "explain", "claims_illustrated": ["A01", "A05"], "emotional_or_rhetorical_load": "Low-to-moderate; uses architectural/building metaphor to make axiomatic grounding intuitive.", "boundaries": {"what_it_shows": "That axiomatic systems require unprovable foundations, and that the framework positions God as such a foundation.", "what_it_does_not_show": "That God actually is the correct or only possible ground axiom; that the analogy between mathematical axioms and metaphysical grounding is valid.", "what_would_falsify_the_narrative": "Demonstration that a system can be fully grounded without an unprovable axiom, or that the Trinity is derivable from something deeper."}, "evidence_for_historical_content": [], "is_separable_from_argument": false, "notes": "Structurally load-bearing: the axiom-floor metaphor is the paper's opening move and frames the entire argument."}, {"story_id": "st_002", "title_or_label": "Physics as the Grammar of Love (created-medium narrative)", "story_type": "illustration", "source_span": "P17-P33, S049-S121", "characters_or_agents": ["God", "creatures"], "setting_or_context": "The created order as a medium for love, choice, and redemption", "plot_or_sequence": "If God is sovereign, why physics? Because creatures who can receive and return love need a world that is not God, stable enough to be known, with real consequence, time, limits, and repair. Physics is the grammar of that world — not the Author, but the ordered language the Author speaks.", "intended_function": "explain", "claims_illustrated": ["A02", "A14"], "emotional_or_rhetorical_load": "Moderate; appeals to intuitions about love requiring real conditions.", "boundaries": {"what_it_shows": "A conceptual account of why a sovereign God might create a physical world.", "what_it_does_not_show": "That God actually did create for these reasons; that physics is in fact a 'medium' rather than a brute given.", "what_would_falsify_the_narrative": "A demonstration that love and free choice are possible without any of the listed conditions (non-God world, consequence, time, limits, repair)."}, "evidence_for_historical_content": [], "is_separable_from_argument": false, "notes": "Provides the theological rationale for the physics-theology bridge; structurally load-bearing."}, {"story_id": "st_003", "title_or_label": "The Portrait of Christ in Ten Forces", "story_type": "illustration", "source_span": "P34-P52, S122-S175", "characters_or_agents": ["God", "Christ"], "setting_or_context": "Properties of the four fundamental forces and other physical laws", "plot_or_sequence": "Physics tells you WHAT each force does, not WHY. But when you collect the properties of all ten forces and read them together, they compose a portrait so specific that only one Person matches it. Gravity reads as grace; the strong force as love; electromagnetism as truth; thermodynamics as necessity; information as the Word.", "intended_function": "persuade", "claims_illustrated": ["A03", "A04"], "emotional_or_rhetorical_load": "High; uses poetic parallel structure and scriptural quotations to create a sense of recognition.", "boundaries": {"what_it_shows": "That the measured properties of physical forces can be described in language that resonates with Christian character descriptions.", "what_it_does_not_show": "That this resonance is anything more than analogy or coincidence; that the forces were designed to have these properties; that the mapping is unique or non-arbitrary.", "what_would_falsify_the_narrative": "A force whose properties cannot be mapped to any spiritual reading, or a demonstration that the mappings are arbitrary and could be reversed."}, "evidence_for_historical_content": [], "is_separable_from_argument": false, "notes": "Central rhetorical set-piece; the Hessian matrix claim (S151-S156) is presented as independent confirmation but is not independently evidenced in this paper."}, {"story_id": "st_004", "title_or_label": "The 'You Are God' Thought Experiment", "story_type": "thought_experiment", "source_span": "P53-P61, S176-S223", "characters_or_agents": ["God", "the adversary", "humanity"], "setting_or_context": "Hypothetical: if you woke up as God, what would you build, risk, permit, and redeem?", "plot_or_sequence": "A nine-step sequence: God is self-sufficient goodness; love freely creates real others; real others require genuine agency; agency allows refusal; refusal closes the receiver against the source; a closed system decays; restoration must come from outside without destroying freedom; incarnation enters without coercing; cross and resurrection restore from within while preserving identity. Then four questions: Why must the witness be free? Why a tree? Why not make God impossible to miss? What about the cross? What does the empty tomb prove?", "intended_function": "explain", "claims_illustrated": ["A06", "A15", "A16", "A17", "A09"], "emotional_or_rhetorical_load": "High; uses second-person immersion and narrative tension to make theological claims feel like necessary design decisions.", "boundaries": {"what_it_shows": "That a coherent narrative can be constructed in which the major Christian story beats follow from a small set of premises about love, agency, and consequence.", "what_it_does_not_show": "That this is the only or best possible narrative; that the premises are true; that the sequence is logically necessary rather than narratively plausible.", "what_would_falsify_the_narrative": "A demonstration that the sequence contains a logical gap, or that an equally coherent alternative narrative exists from the same premises."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "The thought experiment is presented as a narrative device; it is separable from the formal argument but carries much of the paper's persuasive weight."}, {"story_id": "st_005", "title_or_label": "The Descent: 24 Steps to the Cross", "story_type": "sermon_arc", "source_span": "P90-P92, S314-S341", "characters_or_agents": ["God", "creation", "the Enemy", "Christ"], "setting_or_context": "A causal chain from God's creation to the Cross", "plot_or_sequence": "God creates; creation stands; what stands is distinguishable; distinction makes being intelligible; what is intelligible carries information; what carries information can stand in relation; relation can be kept or broken; relation reveals value; value opens moral valence; moral valence makes right and wrong meaningful; right and wrong require agents who can choose; choice requires a world of rules, limits, time, and consequences; such a world permits decay, vulnerability, and loss; decay opens the possibility of adversarial refusal; the Enemy exploits disorder; adversarial action creates debt; perfect Justice requires payment; perfect Mercy wills restoration; Justice and Mercy together require a cost-bearing source beyond the damaged order; that source is Grace; Grace restores creation toward God; Christ is the convergence point.", "intended_function": "persuade", "claims_illustrated": ["A06"], "emotional_or_rhetorical_load": "High; builds a sense of inexorable logic culminating in the Cross.", "boundaries": {"what_it_shows": "A step-by-step narrative chain connecting creation to redemption.", "what_it_does_not_show": "That each step is logically necessary; that no alternative chain is possible; that the chain is not question-begging at key junctures (e.g., the move from 'value' to 'moral valence' to 'agents who can choose').", "what_would_falsify_the_narrative": "Identification of a non sequitur in the chain, or a demonstration that the chain can be run in reverse or to a different conclusion."}, "evidence_for_historical_content": [], "is_separable_from_argument": false, "notes": "Presented as a formal derivation ('No premise smuggled. No step skipped.'), but functions as a narrative arc. The claim of no smuggled premises is itself a claim requiring independent verification."}, {"story_id": "st_006", "title_or_label": "Progressive Revelation as Reference-Frame Building", "story_type": "illustration", "source_span": "P93-P96, S342-S354", "characters_or_agents": ["God", "Israel", "the prophets"], "setting_or_context": "Biblical history from slavery in Egypt through exile", "plot_or_sequence": "God does not dump the full signal on Day One because receivers cannot parse it. He meets them in slavery and turns deliverance into vocabulary for rescue. He meets them in wilderness and teaches provision. He meets them under Law so they can understand failing to keep it. He meets them through prophets building the pattern. He meets them in exile so they can understand return. This is not God being slow; this is God being a teacher.", "intended_function": "explain", "claims_illustrated": ["A07"], "emotional_or_rhetorical_load": "Moderate; uses pedagogical analogy to reframe apparent divine slowness as intentional pedagogy.", "boundaries": {"what_it_shows": "That the biblical narrative can be read as a progressive educational process.", "what_it_does_not_show": "That this is the correct or intended reading; that God actually operates this way; that alternative readings (e.g., gradual human moral development) are inferior.", "what_would_falsify_the_narrative": "Evidence that biblical revelation does not follow a progressive pattern, or that the pedagogical analogy breaks down at key points."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "Illustrative rather than load-bearing; could be removed without affecting the core argument."}, {"story_id": "st_007", "title_or_label": "God in the Completions, Not the Gaps", "story_type": "historical_anecdote", "source_span": "P69-P74, S251-S272", "characters_or_agents": ["Bonhoeffer", "scientists", "theologians"], "setting_or_context": "The history of the 'God of the gaps' argument and its failures", "plot_or_sequence": "Every generation, someone points at something science cannot explain and says 'therefore God.' Every generation, science explains it and God gets smaller. Darwin. Plate tectonics. Neuroscience. The gaps close. This paper does the opposite: it takes ten things science DID explain and shows that when read together, they describe a Person. Bonhoeffer saw this in 1944 and wrote from prison that we should not use God as a stopgap.", "intended_function": "persuade", "claims_illustrated": ["A04"], "emotional_or_rhetorical_load": "Moderate-to-high; uses the historical failure of gap arguments to position this framework as superior.", "boundaries": {"what_it_shows": "That 'God of the gaps' arguments have historically failed and that this framework claims to avoid them.", "what_it_does_not_show": "That this framework actually avoids the gap problem; that reading ten laws together genuinely produces a portrait rather than a projection.", "what_would_falsify_the_narrative": "Demonstration that the framework itself relies on gaps, or that the completions reading is as vulnerable to reinterpretation as gap arguments."}, "evidence_for_historical_content": ["Bonhoeffer's 1944 prison writings are cited but not directly quoted or referenced with a specific source."], "is_separable_from_argument": false, "notes": "The Bonhoeffer reference is a historical claim; the paper does not provide a specific citation, so it remains unverified within this document."}, {"story_id": "st_008", "title_or_label": "The Necessary Ground Argument", "story_type": "illustration", "source_span": "P81-P88, S289-S312", "characters_or_agents": [], "setting_or_context": "Philosophical argument from cosmological and coherence requirements", "plot_or_sequence": "If closed systems collapse and the universe has not collapsed, something external sustains it. If coherence and decoherence are real, the source of coherence must be equally real. The required properties are: necessary, self-grounding, origin of coherence, active, personal. These properties have had a name for thousands of years: aseity, self-sufficiency, eternality, omnipresence, Logos, providence, personhood. We did not start from theology; we started from five mathematical proofs and arrived at the exact description theologians have been writing about.", "intended_function": "persuade", "claims_illustrated": ["A05"], "emotional_or_rhetorical_load": "Moderate; presents itself as a neutral derivation from mathematics to theology.", "boundaries": {"what_it_shows": "That a set of required properties for a sustaining source can be mapped to classical divine attributes.", "what_it_does_not_show": "That the five mathematical proofs actually exist or are valid; that the mapping is unique; that the source must be personal rather than impersonal.", "what_would_falsify_the_narrative": "Demonstration that the five proofs are invalid, or that the required properties can be satisfied by an impersonal source."}, "evidence_for_historical_content": [], "is_separable_from_argument": false, "notes": "The five mathematical proofs are referenced but not presented in this paper; the argument is structurally load-bearing but its premises are not independently evidenced here."}, {"story_id": "st_009", "title_or_label": "Every Door Leads to the Same Room", "story_type": "illustration", "source_span": "P104-P106, S367-S371", "characters_or_agents": [], "setting_or_context": "Convergence of multiple lines of inquiry", "plot_or_sequence": "You can enter through logic, physics, information theory, biology, mathematics, cosmology, or the measurement of good and evil itself. Every path converges. Not because we forced it — but because reality has one substrate, and that substrate has been telling us its name since the beginning.", "intended_function": "motivate", "claims_illustrated": ["A05"], "emotional_or_rhetorical_load": "High; uses the metaphor of converging paths to create a sense of inevitability and discovery.", "boundaries": {"what_it_shows": "That the paper claims multiple independent lines of inquiry converge on the same conclusion.", "what_it_does_not_show": "That these lines are actually independent; that the convergence is not an artifact of the framework's assumptions; that the 'same room' is not defined by the framework itself.", "what_would_falsify_the_narrative": "Demonstration that the paths do not converge, or that they converge only because they share hidden assumptions."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "Rhetorical flourish; separable from the formal argument but contributes to the paper's persuasive arc."}, {"story_id": "st_010", "title_or_label": "The Cross-Resolution Method (methodological narrative)", "story_type": "illustration", "source_span": "P75-P80, S273-S288", "characters_or_agents": [], "setting_or_context": "Methodological framework for testing claims across registers", "plot_or_sequence": "If God is Truth, the framework must let its claims be tested. Every major claim is read in its proper register: theology, physics, mathematics, lived reality, bridge. Physics is not allowed to smuggle in theology. Theology is not allowed to rescue weak physics. Story is not allowed to pretend it is proof. But when the same structure appears across registers, we mark the bridge, name its strength, state its limits, and keep testing. No hidden upgrades.", "intended_function": "persuade", "claims_illustrated": ["A08"], "emotional_or_rhetorical_load": "Moderate; positions the framework as intellectually honest and self-critical.", "boundaries": {"what_it_shows": "A stated methodology for cross-register testing.", "what_it_does_not_show": "That the methodology is actually followed in the paper; that the bridges are as weak as claimed; that the method prevents smuggling.", "what_would_falsify_the_narrative": "Evidence that the paper violates its own method (e.g., smuggling theology into physics, or treating story as proof)."}, "evidence_for_historical_content": [], "is_separable_from_argument": false, "notes": "The method page is structurally important because it sets the rules for evaluating the paper's claims."}], "narrative_arc": {"opening_device": "The axiom-floor metaphor: every formal system has a floor it cannot dig beneath, and this framework pays one axiom: God.", "central_tension": "The tension between the claim that God is the necessary ground of all reality and the admission that this ground cannot be proven from within the system it sustains.", "re COULD be proven, God would not be the ground. [S045]", "reason": "The paper explicitly treats the root axiom as non-optional: if the Trinitarian ground is removed or zeroed, the four debts (existence, distinction, relation, orientation) are unpaid and the entire derivation grammar collapses. The logic is conjunctive, not additive — every downstream claim depends on the axiom holding."}, "slots": [{"slot": "G", "fit_1": "direct", "fit_2": "direct", "status": "agreed", "plays_role": "The external negentropy influx is God as the necessary, self-grounding source that sustains a universe which would otherwise run down; grace enters from beyond the closed system.", "quote": "If closed systems collapse and the universe has not collapsed, then something external sustains it. [S290]"}, {"slot": "M", "fit_1": "direct", "fit_2": "direct", "status": "agreed", "plays_role": "Alignment is love as the ground-state coupling between the Trinitarian persons and the orientation of creation toward God; the system is aligned when it is rightly related to its source.", "quote": "Love: the ground state of the coupling between them. [S022]"}, {"slot": "E", "fit_1": "direct", "fit_2": "direct", "status": "agreed", "plays_role": "Signal fidelity is truth, the Word, and information that survives transmission — light never degrades in transit, and revelation is the signal God transmits to creatures.", "quote": "Never degrades in transit -- a photon from 13 billion years ago arrives with its original information intact. [S159]"}, {"slot": "S_eff", "fit_1": "direct", "fit_2": "direct", "status": "agreed", "plays_role": "Effective entropy is the Second Law and the decay of closed systems; it is what lowers coherence and makes grace necessary.", "quote": "The Second Law: entropy always increases in a closed system. You cannot cheat it. [S164-S165]"}, {"slot": "T", "fit_1": "direct", "fit_2": "direct", "status": "agreed", "plays_role": "Temporal integration is time as the medium of covenant, sequence, patience, hope, and the progressive revelation that builds a reference frame over history.", "quote": "Time is not a prison. It is the medium of covenant. [S095-S096]"}, {"slot": "K", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "Compression is the Logos — the ordered language and formal grammar through which the infinite God is compressed into intelligible law, story, and equation.", "quote": "Physics is the grammar of that world. It is not the Author. It is the ordered language the Author speaks... [S069-S071]"}, {"slot": "R", "fit_1": "direct", "fit_2": "direct", "status": "agreed", "plays_role": "Phase transition is the cross and resurrection: a threshold event where entropy is locally reversed and the system changes state rather than degree.", "quote": "Second: entropy -- the rule that everything falls apart when left alone -- gets locally reversed by connecting the system to a source outside itself. [S223]"}, {"slot": "Q", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "Superposition is open possibility and genuine agency — the unresolved capacity to choose, refuse, or receive, which must be actualized by free will.", "quote": "Agency allows refusal. [S186]"}, {"slot": "F", "fit_1": "direct", "fit_2": "direct", "status": "agreed", "plays_role": "Non-local correlation is perichoresis and the entanglement-like mutual indwelling of the Trinitarian persons, and by extension the constitutive relation between God and creation.", "quote": "Relation is perichoresis -- the persons indwell each other constitutively. [S035]"}, {"slot": "C", "fit_1": "direct", "fit_2": "direct", "status": "agreed", "plays_role": "Integration is the local integrator: the Trinitarian structure itself as the single axiom that integrates existence, distinction, relation, and orientation into one coherent ground.", "quote": "The Trinity pays all four from one structure. [S032]"}], "contested": [], "analog_strength": 4, "analog In an isolated system, the total entropy (disorder) never decreases over time.", "symbols": [{"symbol": "entropy", "definition": "thermodynamic entropy S", "units_or_type": "J/K", "scope": "thermodynamics"}, {"symbol": "closed system", "definition": "a system that exchanges no matter or energy with its surroundings", "units_or_type": "system boundary condition", "scope": "thermodynamics"}], "types_domain_codomain": "S: state function -> real scalar", "units": "J/K", "premises_and_boundary_conditions": "Applies to isolated/closed systems; statistical statement; local decreases possible in open systems.", "status": "checked", "dimensional_check": "PASS", "source_span": "S164", "atom_uuids": []}, {"equation_id": "eq-descent-chain-001", "exact_expression": "God creates -> Creation stands -> What stands is distinguishable -> Distinction makes being intelligible -> What is intelligible carries information -> What carries information can stand in relation -> What can stand in relation can be kept or broken -> Therefore relation reveals value -> What has value can be regarded rightly or wrongly -> Thus value opens moral valence -> Moral valence makes right and wrong meaningful -> Right and wrong require agents who can choose -> Choice requires a world of rules, limits, time, and consequences -> Such a world permits decay, vulnerability, and loss -> Decay and vulnerability open the possibility of adversarial refusal of coherence -> The Enemy is that agency of refusal -> Adversarial action creates real debt, damage, and disorder -> Perfect Justice requires that this be truthfully answered and paid -> Perfect Mercy wills restoration rather than abandonment -> Justice and Mercy together require a cost-bearing source beyond the damaged order itself -> That source must preserve truth while making restoration possible -> That source is Grace -> Grace restores creation toward God -> Christ is the convergence point where justice, mercy, truth, and restoration meet", "plain_meaning":   el("circle",{cx:x+bw/2,cy:mid-(T[k]||0)/2*mid/4,r:1.8,fill:css("--ink"),"fill-opacity":.5},s);hover(r,'<div class="t1">'+k+'</div>love '+v+' · all nine '+(T[k]||0));});
});

sp.innerHTML=spikeList("Strongest toward the fruits",SS.top_toward,"pos")+spikeList("Strongest away",SS.top_away,"neg")+spikeList("Counterfeit candidates (fruit words, anti-fruit work)",SS.counterfeit_candidates,"neg")+spikeList("Hidden fruit (fruit work, no fruit words)",SS.hidden_fruit,"pos");

 table(vd,["Fruit","Score 0–4","Confidence","Counterfeit","Rationale"],FV.fruit_profile.map(function(p){return [nm(p.fruit_id.split(".").pop()),'<b>'+p.score+'</b>',p.confidence,(p.counterfeit||{}).flag?'<span class="pill neg">yes</span>':'no',esc(p.rationale)];}));
 table(vd,["Gate","Status","Hard","Rationale"],(FV.gate_results||[]).map(function(g){return [esc(g.gate_id),'<span class="pill '+(g.status==="PASS"?"pos":g.status==="FAIL"?"neg":"neu")+'">'+g.status+'</span>',g.hard?"hard":"",esc(g.rationale)];}));

table(s3,["Node","Name","Mode","Alignment","Confidence","Quote"],(AX.axiom_nodes||[]).map(function(n){var a=n.alignment||"";return ['<span class="id">'+esc(n.node_id)+'</span>',esc(n.name),esc(n.mode),'<span class="pill '+(a==="contested"?"neg":a==="directly_asserted"||a==="supported"?"pos":"neu")+'">'+esc(a)+'</span>',esc(n.confidence),esc(n.evidence_quote)];}));
if((AX.unmapped_claims||[]).length)s3.insertAdjacentHTML("beforeend",'<p class="sub">Unmapped atoms: '+AX.unmapped_claims.map(esc).join(', ')+'</p>');

/* 4 ATOMS */
var AT=D.atoms||{};var s4=sec("at","4 · Atoms",(AT.atoms||[]).length+" · domain "+esc(AT.domainType||"—"),esc(AT.summary||""));
table(s4,["Id","Type","Stage","Name","Plain statement","Falsified if","Sentences"],(AT.atoms||[]).map(function(a){return ['<span class="id">'+a.atom_id+'</span>',esc(a.nodeType),esc(a.stage),'<b>'+esc(a.name)+'</b>',esc(a.statementPlain),esc(a.falsificationCondition),'<span class="id">'+esc((a.source_sentences||[]).slice(0,8).join(', '))+((a.source_sentences||[]).length>8?'…':'')+'</span>'];}));

table(s5,["Claim","Disposition","Object","Proposed statement","What remains open"],(LE.formal_candidates||[]).map(function(c){return [esc((c.identity||{}).claim_id),esc((c.source_selection||{}).selection_disposition),esc((c.formal_object||{}).object_type),esc((c.formal_object||{}).exact_proposed_statement),esc((c.result_and_boundary||{}).what_remains_open)];}));

var STo=D.stories||{},arc=STo.narrative_arc||{};var s6=sec("st","6 · Stories",(STo.stories||[]).length+" found",arc.opening_device?'Arc: <b>'+esc(arc.opening_device)+'</b> → <b>'+esc(arc.central_tension)+'</b> → <b>'+esc(arc.resolution_or_payoff)+'</b> · returns to opening: '+arc.return_to_opening:"");
table(s6,["Story","Type","Function","Span","Shows","Does not show","Load-bearing"],(STo.stories||[]).map(function(x){var b=x.boundaries||{};return ['<b>'+esc(x.title_or_label)+'</b>',esc(x.story_type),esc(x.intended_function),'<span class="id">'+esc(x.source_span)+'</span>',esc(b.what_it_shows),esc(b.what_it_does_not_show),x.is_separable_from_argument===false?'<span class="pill neg">yes</span>':'no'];}));

var pt=me.product_test||{},cr=me.core_relation||{};var s7=sec("me","7 · Master equation analog","strength "+(me.analog_strength!=null?me.analog_strength:"—")+" ("+(me.analog_strength_spread||"")+") · two independent runs",
 'χ = G·M·E·S<sub>eff</sub>·T·K·R·Q·F·C. Core relation: '+esc(cr.sentence||cr)+'<br>Product test: <b>'+esc(pt.run1)+'</b> / <b>'+esc(pt.run2)+'</b> ('+esc(pt.status)+') — '+esc(pt.reason));
var mdv=document.createElement("div");s7.appendChild(mdv);
charts.push(function(){mdv.innerHTML='';var sl=me.slots||[];if(!sl.length)return;var s=svgIn(mdv,10*64+10,110),fit={direct:1,analogous:.66,stretched:.33,absent:0};
 sl.forEach(function(r,i){var cx=36+i*64,v1=fit[r.fit_1],v2=fit[r.fit_2],v=((v1||0)+(v2||0))/2;
  var c=el("circle",{cx:cx,cy:44,r:6+v*18,fill:v>=.66?css("--g2"):v>=.33?css("--g1"):css("--mid"),stroke:r.status==="contested"?css("--b2"):"none","stroke-width":2.5,"stroke-dasharray":r.status==="contested"?"4 2":"none"},s);
  tx(s,cx,96,r.slot,{"text-anchor":"middle","font-weight":600});hover(c,'<div class="t1">'+r.slot+' · '+esc(r.fit_1)+' / '+esc(r.fit_2)+' ('+r.status+')</div>'+esc(r.plays_role)+'<br><span style="color:var(--muted)">'+esc(r.quote)+'</span>');});
});
s7.insertAdjacentHTML("beforeend",'<p class="sub">Circle size = fit (direct &gt; analogous &gt; stretched &gt; absent), averaged over both runs. Dashed red ring = the two runs disagree.</p>'+(me.one_line?'<p>“'+esc(me.one_line)+'”</p>':''));

(D.coherence&&D.coherence.dimensions||[]).forEach(function(d){s8.insertAdjacentHTML("beforeend",'<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><b>'+esc(nm(d.name||""))+'</b><span class="id">'+d.score+'/10</span></div><div class="bar"><i style="width:'+(d.score||0)*10+'%;background:'+((d.score||0)>=7?css("--g2"):(d.score||0)>=5?css("--g1"):css("--b2"))+'"></i></div><div class="sub" style="margin-top:4px">'+esc((d.reasons||[]).join(' · '))+'</div></div>');});
["contradictions","tensions","missing_definitions"].forEach(function(k){var a=(D.coherence||{})[k]||[];if(a.length)s8.insertAdjacentHTML("beforeend",'<h3>'+nm(k)+'</h3><ul class="q">'+a.map(function(x){return '<li>'+(typeof x==="object"?(x.term?'<b>'+esc(x.term)+'</b>: ':'')+esc(x.description||x.note||JSON.stringify(x))+(x.severity?' <span class="pill neu">'+esc(x.severity)+'</span>':''):esc(x))+'</li>';}).join('')+'</ul>');});
