 because the same facts are acknowledged even by skeptical and liberal scholars.", "quote": "So, if anything, I think I'm prejudiced, Dale. I admit it. But, I think I bend over backwards with a lot of these things and what I put in there without a comment. [S099]"}, "product_test": {"run1": "multiplicative", "run2": "multiplicative", "status": "agreed", "quote": "if if that was true, then the empty tomb would be a minimal fact. Not You know, if if they're all just a bunch of Christians, why on earth are Christians denying the empty tomb? It's because even though they're Christians, they're basing their conclusions on the data. [S062-S064]", "reason": "The argument collapses if the sample is not informed or not data-driven: if scholars were merely biased Christians, the consensus would be worthless; if they did not publish in the field, their opinions would not count. Both conditions are treated as necessary, not merely contributing."}, "slots": [{"slot": "G", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "The external source of negentropy is the published, peer-reviewed literature and the scholars who produce it; the argument depends on an outside body of evidence and expert testimony that the individual apologist does not generate alone.", "quote": "when I say I want a scholar, I don't want somebody who shoots from the hip. [S128]"}, {"slot": "M", "fit_1": "direct", "fit_2": "direct", "status": "agreed", "plays_role": "Alignment is the scholar's methodological commitment to follow the evidence wherever it leads, rather than to a prior ideological or religious commitment.", "quote": "I try to go where the evidence leads. [S139]"}, {"slot": "E", "fit_1": "direct", "fit_2": "analogous", "status": "contested", "plays_role": "Signal fidelity is the accurate transmission of the historical data through the scholarly literature; the argument depends on the data surviving scrutiny and being reported correctly.", "quote": "they're being honest to the data, right? Because if if that was true, then the empty tomb would be a minimal fact. [S061-S062]"}, {"slot": "S_eff", "fit_1": "analogous", "fit_2": "direct", "status": "contested", "plays_role": "Effective entropy is the bias, presupposition, or ignorance that lowers the reliability of a scholar's testimony; the argument works by minimizing this noise through careful selection of informed scholars.", "quote": "You're just going to say that's true? I think that's kind of weak. [S159-S160]"}, {"slot": "T", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "Temporal integration is the long history of scholarly research from the 19th century to the present, which accumulates into a consensus that cannot be dismissed as a momentary fad.", "quote": "I started the study of 1970 uh five on because my dissertation was done in '76. [S130]"}, {"slot": "K", "fit_1": "direct", "fit_2": "direct", "status": "agreed", "plays_role": "Compression is the minimal facts themselves—a short list of six facts that condenses a vast amount of scholarly debate into a compact, usable summary.", "quote": "I can find my six facts over and over and over and over and over in James D. G. Dunn. [S039-S041]"}, {"slot": "R", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "Phase transition is the qualitative shift from a general scholarly opinion to a minimal fact: when a fact is accepted even by skeptical scholars, it crosses a threshold from contested to consensus.", "quote": "the data is so strong in the case of your six minimal facts, that's why there is that strong consensus. [S065]"}, {"slot": "Q", "fit_1": "stretched", "fit_2": "stretched", "status": "agreed", "plays_role": "Superposition is the unresolved state of a historical question before the evidence is weighed; the argument aims to collapse this into a definite conclusion by appealing to the consensus.", "quote": "People wonder why we don't have any words that are purported from the resurrected Jesus in the Gospels. There's a reason for it. Dead men don't rise. [S155-S157]"}, {"slot": "F", "fit_1": "analogous", "fit_2": "direct", "status": "contested", "plays_role": "Non-local correlation is the interconnectedness of the scholarly community: a conclusion reached by one scholar is correlated with the work of others, so that consensus is not independent but mutually reinforcing.", "quote": "he lists all these scholars, many, many, many way far to the left, and then it gives column after column after column, what verses do they accept? [S076]"}, {"slot": "C", "fit_1": "direct", "fit_2": "analogous", "status": "contested", "plays_role": "Integration is Habermas himself, the local integrator who collects, evaluates, and synthesizes the diverse scholarly opinions into a coherent minimal-facts argument.", "quote": "I use this so often. There's a There's 20 books here that I use so often in my writing. [S009-S010]"}], "contested": ["E", "S_eff", "F", "C"], "analog_strength": 3, "analog_strength_spread": "3-3", "confidence": ["medium", "medium"], "one_line": "The paper's argument for the minimal facts is analogous to the master equation in that it depends on a multiplicative set of conditions—informed scholars, data-driven method, and consensus—but it treats bias as non-fatal and lacks a clear external negentropy source.", "breaks": ["The paper treats the Christian bias of scholars as irrelevant to the validity of their conclusions, whereas in the master equation any misalignment (M) would reduce the product; here the bias is explicitly discounted as long as the data is followed.", "The role of the Holy Spirit or divine action as an external negentropy source is absent; the external source is purely human scholarship and evidence.", "The paper does not require all ten factors to be present simultaneously; it allows for lenient exceptions and acknowledges that some scholars may not meet all criteria yet still be cited.", "The product test i
