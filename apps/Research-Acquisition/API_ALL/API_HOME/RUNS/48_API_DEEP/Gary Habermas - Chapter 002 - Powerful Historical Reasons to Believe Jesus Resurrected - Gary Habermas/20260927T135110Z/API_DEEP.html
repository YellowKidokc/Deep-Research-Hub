t Professor and the Stolen Body", "story_type": "historical_anecdote", "source_span": "P379-P403", "characters_or_agents": ["Gary Habermas", "unnamed atheist college professor"], "setting_or_context": "A formal debate between Habermas and an atheist professor, in a room with a 'no smoking' sign; the professor lights a pipe before the debate.", "plot_or_sequence": "Habermas presents the minimal facts. The professor, when asked what he thinks happened, says 'I don't know. Someone stole the body.' Habermas presses for reasons. The professor becomes angry, says Habermas is 'starting to make me really angry,' and quits the debate.", "intended_function": "illustrate", "claims_illustrated": ["A05", "A10"], "emotional_or_rhetorical_load": "Humorous and adversarial; portrays the naturalistic alternative as ad hoc and its defenders as evasive or emotionally reactive.", "boundaries": {"what_it_shows": "One skeptic, in one debate, offered an unsupported 'stolen body' hypothesis and ended the exchange when pressed.", "what_it_does_not_show": "It does not show that the stolen-body hypothesis is false, that all skeptics behave this way, or that the resurrection occurred.", "what_would_falsify_the_narrative": "Evidence that the professor did provide reasons, that the exchange was misreported, or that the 'stolen body' hypothesis has strong independent support."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "Anecdotal; functions rhetorically to discredit naturalistic theories by association rather than by argument."}, {"story_id": "story-002", "title_or_label": "Paul Meyer on Enemy Attestation of Julius Caesar", "story_type": "illustration", "source_span": "P044-P052", "characters_or_agents": ["Paul Meyer (ancient historian)", "Julius Caesar", "an enemy of Caesar"], "setting_or_context": "A hypothetical or reported ancient testimony: an enemy of Julius Caesar concedes Caesar's military brilliance.", "plot_or_sequence": "An enemy of Caesar says text": "Habermas cites a book called 'The Buddhist Scriptures' where a Buddhist PhD reproduces key Buddhist texts.", "plot_or_sequence": "On page one, the book says to Christian readers: 'We don't have what you have. You have the words of your Lord. We don't. You have the words of those who study under your Lord. We don't. You have the words of those who study under those who study under your Lord. No can do.' The sources are 600-800 years after Buddha.", "intended_function": "persuade", "claims_illustrated": ["A02"], "emotional_or_rhetorical_load": "Comparative; uses a non-Christian source to highlight the earliness of Christian texts.", "boundaries": {"what_it_shows": "That one Buddhist source acknowledges a lack of early texts compared to Christianity.", "what_it_does_not_show": "It does not show that Christian texts are therefore true, or that Buddhist texts are historically worthless.", "what_would_falsify_the_narrative": "Evidence that the Buddhist source does not say this, or that early Buddhist texts exist comparable in date to Christian creeds."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "Comparative illustration; supports the uniqueness of early Christian creeds."}, {"story_id": "story-006", "title_or_label": "The Blind Date Analogy", "story_type": "parable", "source_span": "P671-P689", "characters_or_agents": ["a best friend", "a blind date", "the person being set up", "James Crossley"], "setting_or_context": "A hypothetical scenario: a friend sets up a blind date.", "plot_or_sequence": "The friend says the person will be impressive. The date is impressive. The friend says, 'Let's get married. Can I be your best man?' The person replies: 'You're right. This person is exceptional, but you wrongly infer that I want to get married. Maybe someday I'm not interested in getting married.'", "intended_function": "explain", "claims_illustrated": ["A11", "A12"], "emotional_or_rhetorical_load": "Light, relatable; clarifies ents": ["Elvis Presley", "Superman", "Clark Kent", "Gary Habermas", "Mike Licona"], "setting_or_context": "Habermas and Licona's book on the resurrection includes 'wild' naturalistic theories.", "plot_or_sequence": "Examples: Jesus was a visitor from another planet (Superman); Elvis Presley was raised from the dead and seen pumping gas in Kalamazoo, bald.", "intended_function": "persuade", "claims_illustrated": ["A05", "A10"], "emotional_or_rhetorical_load": "Humorous, mocking; frames naturalistic theories as absurd.", "boundaries": {"what_it_shows": "That some naturalistic theories are absurd.", "what_it_does_not_show": "It does not show that all naturalistic theories are absurd, or that the resurrection is the best explanation.", "what_would_falsify_the_narrative": "If a serious naturalistic theory were shown to be plausible and well-evidenced."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "Rhetorical humor; not an argument against specific naturalistic theories."}, {"story_id": "story-009", "title_or_label": "The Shroud of Turin as Evidence of Death by Crucifixion", "story_type": "illustration", "source_span": "P490-P498", "characters_or_agents": ["the man in the Shroud of Turin", "Jesus"], "setting_or_context": "A discussion of medical evidence for death by crucifixion.", "plot_or_sequence": "If the Shroud of Turin is Jesus's burial cloth, the man in it shows rigor mortis, postmortem blood flow, and separation of blood and serum—about six evidences that he was dead.", "intended_function": "illustrate", "claims_illustrated": ["A07"], "emotional_or_rhetorical_load": "Evidential, somewhat sensational; adds a physical artifact to the argument.", "boundaries": {"what_it_shows": "That if the Shroud is authentic, it provides medical evidence of death by crucifixion.", "what_it_does_not_show": "It does not show that the Shroud is authentic, or that the man is Jesus.", "what_would_falsify_the_narrative": "Evidence that the Shroud fute naturalistic theories, and yet do not compel faith—faith is a response to the data, illustrated by the blind date analogy and the doubter's email.", "return_to_opening": true}, "notes": "The paper is a lecture/interview with a strong rhetorical arc. Stories function mainly to illustrate criteria, discredit naturalistic theories, and motivate faith. None of the stories independently establish the resurrection; they are separable from the formal argument, though some (e.g., the Jesus Seminar anecdote) are used as evidence of scholarly concession."}, "master_equation": {"core_relation": {"sentence": "The conclusion that Jesus was resurrected rests on a set of 'minimal facts' that are (1) multiply attested by many independent pieces of evidence and (2) conceded by virtually all critical scholars, so that the historical case stands only if every one of these facts holds.", "quote": "Number one, I will use no data that are not strongly evidenced by many other pieces of data. This is not the same as multiple attestation of texts, but you could call it multiple attestation of arguments. Every fact I use will have many facts coming in. [S348-S350]"}, "core_relation_run2": {"sentence": "The resurrection conclusion rests on a set of minimal historical facts (crucifixion, burial, appearances, transformation, early proclamation, skeptic conversions) that are individually conceded by critical scholars and jointly require a resurrection explanation, since no naturalistic theory can account for all of them.", "quote": "And I argued that I'm going to use two kinds of facts. Number one is by far the most important criterion. Number one, I will use no data that are not strongly evidenced by many other pieces of data. This is not the same as multiple attestation of texts, but you could call it multiple attestation of arguments. Every fact I use will have many facts coming in. [S348][S349][S350]"}, "product_test": {"run1": "multiplicative", "run2": "multiplicative", "status": "agreed", "quote": "If you take this approved list, you can refute you can give the major reputations of every naturalistic theory. [S646-S647] ... these facts are enough. Critics don't go after them. [S667-S668]", "reason": "Habermas treats the six minimal facts as a joint necessary set: the resurrection conclusion is argued to follow only when all six are granted together, and the apologetic force is presented as collapsing if any single fact is removed (e.g., 'he's got to be dead before he could be raised' [S364], and the whole naturalistic-theory rebuttal depends on the full approved list). The framing is conjunctive rather than additive."}, "slots": [{"slot": "G", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "External negentropy influx: the revelatory/divine initiative that supplies the data and the resurrection event itself, which the human evidence cannot generate on its own.", "quote": "if he's raised from the dead, dead men can't raise themselves. So the father would have according to Jesus, the father acted on him. [S469-S470]"}, {"slot": "M", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "Alignment: the apostolic eyewitnesses' alignment with the reference (Jesus), evidenced by their willingness to suffer and die rather than recant.", "quote": "the disciples were transformed. I don't say I can prove all the disciples died as martyrs. I say they were willing to die. [S431-S434]"}, {"slot": "E", "fit_1": "direct", "fit_2": "direct", "status": "agreed", "plays_role": "Signal fidelity: the transmission of testimony through early creeds and eyewitness chains, argued to preserve the original message without corruption.", "quote": "I delivered unto you that which I also received. I gave you what I was given. See, it's not mine. [S142-S144]"}, {"slot": "S_eff", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "Effective entropy: the noise/doubt/naturalistic theories and the passage of time that would degrade the testimony, which the early dating and multiple attestation are said to counteract.", "quote": "Most critics today have given up naturalistic theories. [S649] ... History can't prove miracles, comma. But neither can history disprove miracles. [S698-S701]"}, {"slot": "T", "fit_1": "direct", "fit_2": "direct", "status": "agreed", "plays_role": "Temporal integration: the very short time gap between the cross and the creeds (2-3 years, or 20 years max) is the central argument that the tradition is early and therefore reliable.", "quote": "Bartman says, 'We have several of these high christologology texts from two to three years after the cross.' [S266]"}, {"slot": "K", "fit_1": "direct", "fit_2": "analogous", "status": "contested", "plays_role": "Compression: the creedal passages are compact summaries that encode the core gospel (deity, death, resurrection) in highly compressible form.", "quote": "They're little tiny snippets that appear in the text. [S153] ... these couple dozen creedle texts are 80% of them are on the facts of the gospel, deity, death, resurrection of Jesus. [S199]"}, {"slot": "R", "fit_1": "stretched", "fit_2": "analogous", "status": "contested", "plays_role": "Phase transition: the resurrection is treated as a discrete, non-gradual event that changes the state of the disciples and the worldview, not merely a degree of improvement.", "quote": "if Jesus predicted ahead of time, that means he had knowledge of it. If he had knowledge of it, he's part of the plan. And if he's part of the plan, it's bigger than him. [S467-S469]"}, {"slot": "Q", "fit_1": "stretched", "fit_2": "stretched", "status": "agreed", "plays_role": "Superposition: the open possibility that the evidence could be explained by a naturalistic theory until the minimal facts are actualized as a cumulative case; Habermas notes critics may 'fill in the blank' with any theory.", "quote": "What really happened was fill in the blank. You say whatever you want. [S651-S653]"}, {"slot": "F", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "Non-local correlation: the appearances to groups and individuals, and the chain of eyewitnesses (Peter, James, Paul) whose testimonies are correlated and mutually reinforcing.", "quote": "Six. Three appearances to individuals, three appearances to groups. That's very, very important. The group appearances in particular. [S147-S151]"}, {"slot": "C", "fit_1": "direct", "fit_2": "analogous", "status": "contested", "plays_role": "Integration: the historian/apologist (Habermas) as the local integrator who assembles the minimal facts into a coherent cumulative case.", "quote": "I'm going to use two kinds of facts. Number one is by far the most important criterion. Number one, I will use no data that are not strongly evidenced by many other pieces of data. [S347-S348]"}], "contested": ["K", "R", "C"], "analog_strength": 3, "analog_strength_spread": "3-3", "confidence": ["medium", "medium"], "one_line": "Habermas's minimal-facts argument is a conjunctive historical case whose reliability factors (early dating, eyewitness testimony, creedal compression, multiple attestation) map analogously onto the master equation's product, though the paper's explicit treatment of faith and the empty tomb as optional weakens the strict multiplicative analogy.", "breaks": ["The paper treats the empty tomb as an optional additional fact (conceded by ~75% of scholars) rather than a required factor, whereas the master equation treats all factors as jointly necessary.", "The 'minimal facts' are not strictly multiplicative in the sense of a single zero collapsing the whole: Habermas allows that some facts are conceded by 'virtually every' scholar while others (empty tomb) are not, and the argument can proceed with a subset. This weakens the strict product analogy.", "The role of faith is explicitly separated from evidence ('Faith is a response to data' [S710]) and is not modeled as a factor in the historical equation, introducing an element with no clean slot.", "The paper treats the empty tomb as optional (conceded by only ~75% of scholars), whereas the master equation requires all factors; Habermas explicitly brackets it out of the six minimal facts.", "The role of G (external negentropy) is asserted theologically rather than demonstrated historically; the paper's method is strictly historical and cannot itself supply the outside action it needs.", "The product test is applied to the facts, not to the conclusion: the facts multiply, but the inference to resurrection is presented as best explanation, which is closer to abductive reasoning than to a multiplicative product.", "Q (superposition) is not genuinely unresolved in the paper's own framing — Habermas treats the resurrection as the conclusion the evidence forces, so the slot is stretched."], "extra_factors": [["The concept of 'enemy attestation' [S051] — a compliment from a hostile source — functions as an additional reliability multiplier not clearly mapped to any single slot.", "The 'criteria' of authenticity (embarrassment, Aramaic substrata, eyewitness, early date) [S012-S113] act as a meta-methodological layer, not a slot.", "The distinction between 'faith' as a response to data vs. a way of knowing [S706-S715] is an epistemological addition outside the product."], ["The criteria of authenticity (eyewitness, early, embarrassment, enemy attestation, Aramaic substrata) function as a meta-factor governing which data enter the product, with no direct slot.", "The distinction between 'minimal facts' conceded by critics and 'maximal facts' held by believers introduces a two-tier structure not present in the master equation.", "The 'I do' of salvation as a volitional response to data is an additional factor (personal commitment) that is not one of the ten slots."]], "equations_present": false}, "master_equation_b": null, "coherence": {"station": "coherence_score", "paper_uuid": "Gary Habermas
