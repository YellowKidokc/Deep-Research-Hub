": "medium", "notes": "The core historical claim is that the original apostolic testimony was conserved intact through Paul's direct verification with Peter and James, ruling out lossy transmission."}, {"node_id": "BC8", "name": "BC8 — Voluntary Coupling", "mode": "HY_EVIDENCE", "alignment": "relevant_but_not_asserted", "evidence_quote": "", "confidence": "low", "notes": "The martyrdoms of Paul, Peter, and James are cited as evidence of sincerity, which is adjacent to voluntary coupling, but the lecture does not develop a coupling axiom."}, {"node_id": "A9.1", "name": "A9.1 — External Intervention Required", "mode": "HY_EVIDENCE", "alignment": "relevant_but_not_asserted", "evidence_quote": "", "confidence": "low", "notes": "Paul's conversion is presented as an external encounter ('He meets Jesus') that reverses his prior hostility, but the lecture does not state an axiom of required external intervention."}, {"node_id": "C8.2", "name": "C8.2 — Works Salvation Impossible", "mode": "HY_EVIDENCE", "alignment": "directly_asserted", "evidence_quote": "Good works will not get you in heaven.", "confidence": "high", "notes": "Explicitly asserted in the closing application, with the qualification that post-salvation works determine reward capacity."}, {"node_id": "P9.2", "name": "P9.2 — Voluntary Coupling Preserved", "mode": "HY_EVIDENCE", "alignment": "supported", "evidence_quote": "In the New Testament the word believe means to jump in with both feet.", "confidence": "medium", "notes": "Habermas insists NT belief is trust/surrender rather than mere assent, preserving a voluntary, non-coerced response; he explicitly denies this makes salvation by works."}, {"node_id": "P9.5", "name": "P9.5 — Grace Available To All", "mode": "HY_EVIDENCE", "alignment": "relevant_but_not_asserted", "evidence_quote": "", "confidence": "low", "notes": "The gospel is presented as universally offered and universally preached, but the lecture does not formulate an availability axiom."}, {"node_id": "P10.1", "name": "P10.1 — Soul Continuity", "mode": "HY_EVIDENCE", "alignment": "supported", "evidence_quote": "If you'll ever be eternal in the future, you're eternal now.", "confidence": "medium", "notes": "Eternal life is said to begin in this life and continue into eternity, implying continuity of the person across death."}, {"node_id": "P10.2", "name": "P10.2 — Soul Identity Persistence", "mode": "HY_EVIDENCE", "alignment": "relevant_but_not_asserted", "evidence_quote": "", "confidence": "low", "notes": "The claim that believers 'belong to the Lord' and leave with their king for eternity assumes personal persistence, but identity persistence is not argued."}, {"node_id": "T12.1", "name": "T12.1 — Heaven As High-Phi Attractor", "mode": "HY_EVIDENCE", "alignment": "relevant_but_not_asserted", "evidence_quote": "", "confidence": "low", "notes": "Heaven and eternal reward are discussed in ordinary theological terms, not as a coherence attractor state."}, {"node_id": "T12.2", "name": "T12.2 — Hell As Low-Phi Attractor", "mode": "HY_EVIDENCE", "alignment": "relevant_but_not_asserted", "evidence_quote": "", "confidence": "low", "notes": "The alternative to salvation is implied ('if not, you're not') but never characterized as a low-coherence attractor."}, {"node_id": "T16.1", "name": "T16.1 — Christianity 8 of 8 BCs", "mode": "HY_EVIDENCE", "alignment": "relevant_but_not_asserted", "evidence_quote": "", "confidence": "low", "notes": "Habermas argues Christianity is uniquely vindicated by the resurrection data, which is structurally parallel to the 8-of-8 BC claim, but he never invokes the BC framework."}, {"node_id": "T16.6", "name": "T16.6 — Atheism Fails BC1-BC6", "mode": "HY_EVIDENCE", "alignment": "relevant_but_not_asserted", "evidence_quote": "", "confidence": "low", "notes": "Atheist and agnostic scholars are cited as conceding the historical data yet not believing, which Habermas attributes to worldview rather than evidence; this is adjacent to but not the BC1-BC6 failure claim."}, {"node_id": "EV15.1", "name": "EV15.1 — Biblical Prophecy Validation", "mode": "HY_EVIDENCE", "alignment": "supported", "evidence_quote": "How that Christ died for our sins according to the scriptures, he was buried, rose again the third day according to the scriptures and appeared.", "confidence": "medium", "notes": "The creedal formula is quoted as grounding the resurrection in the scriptures, functioning as scriptural validation of the event."}, {"node_id": "BRIDGE-PHY-THEO", "name": "BRIDGE-PHY-THEO - Physics-Theology Bridge", "mode": "HY_EVIDENCE", "alignment": "relevant_but_not_asserted", "evidence_quote": "", "confidence": "low", "notes": "The lecture is purely historical-theological; it makes no physics bridge, though it supplies evidence the canon's bridge would need to accommodate."}, {"node_id": "PERSONHOOD", "name": "PERSONHOOD — Agency, Intentionality, Relational Capacity", "mode": "HY_EVIDENCE", "alignment": "supported", "evidence_quote": "It means to surrender.", "confidence": "medium", "notes": "Belief is characterized as personal trust, surrender, and covenant commitment ('I do'), presupposing agency, intentionality, and relational capacity."}], "unmapped_claims": ["A01", "A02", "A03", "A04", "A05", "A06", "A07", "A08", "A09", "A10", "A11", "A12", "A13", "A14", "A15", "A16", "A17", "A18", "A19", "A20", "A21", "A22"]}, "atoms": {"paper_uuid": "yt-98uoFLGOCXk-ch03", "title": "Remarkably Early Historical Information for the Resurrection of Jesus - Gary Habermas", "domainType": "theology", "summary": "Habermas argues that early, critically-accepted data (homologia, pre-Pauline creeds, Paul's conversion, and Paul's Jerusalem consultations with Peter and James) establish eyewitness testimony to the resurrection within 2-6 years of the cross, defeating 'telephone tag' myth objections. He also distinguishes factual from emotional doubt and closes with exhortation from 1 Cor 15:58.", "atoms": [{"nodeType": "claim", "stage": "01_canoni l probably knew them all.", "statementPlain": "The earliest Christian creeds came from Jerusalem within a year or two of Jesus' death, from the apostles themselves.", "claimClass": "empirical-anchor", "falsificationCondition": "Demonstration that the creeds postdate Paul or originate outside Jerusalem/apostolic circles would falsify.", "verificationStatus": "informal", "challengeStatus": "challenged-open", "edges": [{"type": "dependsOn", "target": "tp:theology/L1/C2", "grade": "structural_identity", "propagates": "true"}], "source_sentences": ["S252", "S253", "S285", "S292"], "notes": "Cites Bart Ehrman's concession.", "atom_id": "A03"}, {"nodeType": "claim", "stage": "01_canonical", "name": "Paul's conversion within 2-3 years of the cross", "statementTechnical": "Paul was converted approximately 2-3 years after the crucifixion, an event granted by critical scholars, giving an eyewitness link to the earliest data.", "statementPlain": "Paul became a Christian just two or three years after Jesus died.", "claimClass": "empirical-anchor", "falsificationCondition": "Evidence that Paul's conversion occurred much later, or that he had no contact with pre-resurrection eyewitnesses, would falsify.", "verificationStatus": "informal", "challengeStatus": "challenged-open", "edges": [{"type": "feedsInto", "target": "tp:theology/L1/C4", "grade": "structural_identity", "propagates": "true"}], "source_sentences": ["S294", "S304", "S377"], "notes": "", "atom_id": "A04"}, {"nodeType": "claim", "stage": "01_canonical", "name": "Paul verified the gospel with Peter and James (Gal 1-2)", "statementTechnical": "Paul visited Jerusalem ~3 years post-conversion (Gal 1:18) spending 15 days with Peter and James, and again 14 years later (Gal 2:2,9) where the pillars added nothing to his gospel and gave the right hand of fellowship.", "statementPlain": "Paul checked his gospel with Peter and James, the eyewitnesses, and they confirmed it.", "claimClass": "empirical-anchor", "falsificationCondit  again 14 years later (Galatians 2:2).", "plot_or_sequence": "Paul, formerly a persecutor who stood at Stephen's killing, is converted 2-3 years after the cross. Three years later he goes to Jerusalem and spends 15 days with Peter and James. Habermas imagines Paul saying: 'Tell me what you saw on Easter Sunday morning, and I'll tell you what I saw on the road to Damascus.' Paul uses the Greek word historesai (to check out, investigate, question). Fourteen years later Paul returns and presents his gospel to the 'pillars'—Peter, James, and John—to see if he had run in vain. They added nothing to him and gave him the right hand of fellowship.", "intended_function": "explain", "claims_illustrated": ["A04", "A05", "A19", "A06"], "emotional_or_rhetorical_load": "Dramatic reconstruction; positions Paul as a careful researcher and the Jerusalem leaders as eyewitness verifiers.", "boundaries": {"what_it_shows": "That Paul reports visiting Peter and James and later checking his gospel with the Jerusalem leaders (Gal 1-2).", "what_it_does_not_show": "That the content of their conversation was specifically about resurrection appearances, or that their agreement guarantees the resurrection occurred.", "what_would_falsify_the_narrative": "Evidence that Galatians 1-2 does not describe a verification of the gospel, or that the visits did not involve Peter and James."}, "evidence_for_historical_content": ["A04", "A05"], "is_separable_from_argument": false, "notes": "Structurally load-bearing: this narrative is the core of Habermas's fourth argument against 'telephone tag.' The imagined dialogue is explicitly a reconstruction, not a quotation."}, {"story_id": "st-008", "title_or_label": "God Uses Wounded Lives: Peter, James, and Paul", "story_type": "sermon_arc", "source_span": "P03 S500-S527", "characters_or_agents": ["Peter", "James", "Paul", "Jesus", "Habermas"], "setting_or_context": "Application point within the lecture, imagining the conversation between Paul, Peter, and James.", "plot_or_sequence": "Habermas imagines Paul saying to Peter and James: all three of us have been losers. Peter denied the Savior three times; James grew up with Jesus and likely resented him; Paul killed people. Yet all three were commissioned. The practical conclusion: God uses wounded lives and huge ministries.", "intended_function": "motivate", "claims_illustrated": ["A21"], "emotional_or_rhetorical_load": "Pastoral, encouraging; uses the failures of the three leaders to offer hope.", "boundaries": {"what_it_shows": "That the NT depicts Peter, James, and Paul as having significant failures before being used by God.", "what_it_does_not_show": "That this pattern is universal, or that it provides evidence for the resurrection.", "what_would_falsify_the_narrative": "Evidence that the NT does not depict these figures as having failed, or that their commissioning did not follow failure."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "Application/exhortation; separable from the historical argument."}, {"story_id": "st-009", "title_or_label": "Emotional Doubters and the 'What If' Spiral", "story_type": "illustration", "source_span": "P03 S548-S602", "characters_or_agents": ["Habermas", "clinical psychologist collaborator", "emotional doubters", "Habermas's wife", "C. S. Lewis"], "setting_or_context": "Habermas's research on doubt, including a psychological battery of tests administered with a clinical psychologist.", "plot_or_sequence": "Habermas says most doubts are emotional, not factual. Emotional doubters ask 'What if?' questions with no evidence and are not helped by more data. He cites C. S. Lewis's line about telling your emotions where to get off. His wife jokes that women doubt more but at least know they're emotional, while men turn over the wrong rocks thinking it's a fact.", "intended_function": "explain", "claims_illustrated": ["A08", "A18"], "emotional_or_rhetorical_load": "Humorous, pastoral; uses gender stereotype humor to make a point about the nature of doubt.", "boundaries": {"what_it_shows": "That Habermas and a psychologist found many doubts to be emotional rather than factual.", "what_it_does_not_show": "That all doubt is emotional, or that factual evidence is irrelevant to all doubters.", "what_would_falsify_the_narrative": "Evidence that most doubt is in fact driven by factual concerns, or that the psychological battery did not support the conclusion."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "Illustrates the distinction between factual and emotional doubt; supports the claim that data alone will not resolve most doubt."}, {"story_id": "st-010", "title_or_label": "Boiling a Frog Slowly: The Deceitfulness of Sin", "story_type": "illustration", "source_span": "P03 S629-S633", "characters_or_agents": ["a frog", "Habermas"], "setting_or_context": "Closing exhortation on steadfastness.", "plot_or_sequence": "Habermas cites the old saying that a frog placed in water will not jump out as the water heats slowly. He uses this to illustrate Hebrews' warning not to be hardened by the deceitfulness of sin.", "intended_function": "motivate", "claims_illustrated": ["A22"], "emotional_or_rhetorical_load": "Cautionary; uses a familiar folk image to warn against gradual spiritual drift.", "boundaries": {"what_it_shows": "A memorable image of gradual hardening.", "what_it_does_not_show": "That the frog anecdote is biologically accurate, or that spiritual hardening works exactly like the metaphor.", "what_would_falsify_the_narrative": "Evidence that frogs do jump out of slowly heated water (the anecdote is scientifically dubious)."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "Folk illustration; not load-bearing for any historical claim."}, {"story_id": "st-011", "title_or_label": "Paul Trash-Talking Death and the Devil", "story_type": "sermon_arc", "source_span": "P03 S667-S724", "characters_or_agents": ["Paul", "Death", "the devil", "Jesus", "Habermas"], "setting_or_context": "Closing exposition of 1 Corinthians 15:55-58.", "plot_or_sequence": "Paul quotes the Old Testament: 'Death, where is your sting? Grave, where is your victory?' Habermas says Paul is not being a poet but is trash-talking death and the devil. Death has been defeated; the empty tomb means the devil has lost his prized possession. Believers can be hurt but cannot be kept. Therefore be steadfast, work, and know that eternal life starts now.", "intended_function": "motivate", "claims_illustrated": ["A22", "A10"], "emotional_or_rhetorical_load": "Triumphalistic, rousing; the climax of the lecture.", "boundaries": {"what_it_shows": "That 1 Corinthians 15 ends with a triumphant exhortation based on the resurrection.", "what_it_does_not_show": "That the resurrection occurred, or that the devil exists as a personal being.", "what_would_falsify_the_narrative": "Evidence that 1 Corinthians 15:55-58 is not about victory over death, or that Paul did not intend it as a taunt."}, "evidence_for_historical_content": [], "is_separable_from_argument": true, "notes": "Exhortational climax; depends on the resurrection claim but does not establish it."}], "narrative_arc": {"opening_device": "Habermas opens with the bold claim that the resurrection is Christianity's load-bearing claim: 'If Jesus was raised from the dead, Christianity is true. You don't have to solve every problem in the Bible.'", "central_tension": "Critics dismiss the resurrection as late legend ('telephone tag'), but Habermas argues that the earliest data—homologia, creeds, Paul's conversion, and Paul's verification with Peter and James—are too early for myth.", "resolution_or_payoff": "By approximately six years after the cross, the earliest preaching, the creeds, Paul's conversion, and Paul's verification with the eyewitnesses are all in place, ruling out telephone tag and providing early eyewitness evidence.", "return_to_opening": true}, "notes": "The lecture is structured as a cumulative historical argument with embedded illustrations and a closing sermon. The most structurally load-bearing story is st-007 (Paul's verification with Peter and James), which is not separable from the argument. The other stories are illustrative, comparative, or exhortational and are separable from the historical case. Historical claims within stories are linked to evidence atoms where the schema provides them; the imagined dialogue in st-007 is explicitly a reconstruction, not a quotation."}, "master_equation": {"core_relation": {"sentence": "The resurrection of Jesus is established as true if and only if the earliest Christian testimony (homologia, creeds, Paul's conversion, and Paul's verification with Peter and James) is both early enough and rooted in eyewitnesses, which together rule out legend or 'telephone tag'.", "quote": "If Jesus was raised from the dead, Christianity is true. [S006]"}, "core_relation_run2": {"sentence": "The truth of Christianity stands or falls on the historical fact of the resurrection, which is established by early, eyewitness-grounded testimony (homologia, creeds, Paul's conversion, and his Jerusalem verification) that collectively rules out legend or telephone-tag distortion.", "quote": "If Jesus was raised from the dead, Christianity is true. [S006]"}, "product_test": {"run1": "multiplicative", "run2": "multiplicative", "status": "agreed", "quote": "You get the resurrection of Jesus, as my good buddy Mike Licona says, you get the resurrection, it's game, set, and match. Christianity is true. [S011]", "reason": "The argument is structured so that if any one of the four early-evidence pillars (immediate preaching, early creeds, Paul's conversion, Paul's verification with eyewitnesses) is removed or shown to be late/misconstrued, the conclusion of a reliably transmitted resurrection witness collapses entirely, not merely weakens. Habermas explicitly treats the chain as a package: 'How do you know it's not phone tag? ... It rules phone tag out because he got it from the eyewitnesses.' [S412-S413]"}, "slots": [{"slot": "G", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "External negentropy influx: the revelatory act of God raising Jesus, which is the outside source that initiates and sustains the entire chain of testimony.", "quote": "If Jesus was raised from the dead, Christianity is true. [S006]"}, {"slot": "M", "fit_1": "analogous", "fit_2": "direct", "status": "contested", "plays_role": "Alignment: the apostolic church and Paul are aligned with the gospel kernel; the Jerusalem pillars and Paul verify they are on the same page.", "quote": "I went to see them again, and I gave them the gospel presentation that I was preaching to see if I was running or had run in vain. [S456]"}, {"slot": "E", "fit_1": "direct", "fit_2": "direct", "status": "agreed", "plays_role": "Signal fidelity: the transmission of the resurrection message through homologia, creeds, and Paul's testimony without distortion; 'telephone tag' is the noise the argument rules out.", "quote": "It rules phone tag out because he got it from the eyewitnesses. [S413]"}, {"slot": "S_eff", "fit_1": "analogous", "fit_2": "direct", "status": "contested", "plays_role": "Effective entropy: the tendency of oral tradition to decay into myth or misconstrued data, which the early dating and eyewitness links are meant to counteract.", "quote": "You know how long it takes to make a myth? ... Paul was too early to be myth. Baloney. [S325-S331]"}, {"slot": "T", "fit_1": "direct", "fit_2": "direct", "status": "agreed", "plays_role": "Temporal integration: the compressed timeline from the cross to the creeds, Paul's conversion, and the Jerusalem meetings is the central evidence; time is the variable that makes or breaks the case.", "quote": "How about six? ... How about six four arguments all from eyewitnesses. [S214]"}, {"slot": "K", "fit_1": "direct", "fit_2": "direct", "status": "agreed", "plays_role": "Compression: the homologia and creeds are deliberately compressed, memorizable kernels that preserve the gospel for an illiterate audience.", "quote": "Picture a sunflower seed. The kernel, the part you eat, is the homologia, but now a shell has been put around it. [S276-S277]"}, {"slot": "R", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "Phase transition: Paul's conversion on the Damascus road is a discontinuous state change from persecutor to apostle, which the argument treats as a discrete event that validates the creeds.", "quote": "And then something happened. Boom. He meets Jesus and now magically all the creeds are true. [S296-S297]"}, {"slot": "Q", "fit_1": "stretched", "fit_2": "stretched", "status": "agreed", "plays_role": "Superposition: the open question of whether the tradition is reliable or 'telephone tag' is held unresolved until the evidence is examined; the argument aims to collapse it to one outcome.", "quote": "How do you know we don't have homologia and creeds and Paul's testimony, but it's telephone tag? [S324]"}, {"slot": "F", "fit_1": "analogous", "fit_2": "analogous", "status": "agreed", "plays_role": "Non-local correlation: the early church in Jerusalem, Paul, Peter, James, and John are correlated witnesses whose independent testimonies converge; the 'right people, right place, right time' convergence.", "quote": "The earliest ones came out of Jerusalem, right place, within 1 to 2 years after the cross, right time, possibly or probably came from the apostles, right people, and Paul probably knew all of them. [S292]"}, {"slot": "C", "fit_1": "analogous", "fit_2": "direct", "status": "contested", "plays_role": "Integration: Paul functions as the local integrator who gathers the homologia, creeds, and eyewitness testimony into a verified gospel, checking it with the pillars.", "quote": "He goes to Jerusalem plus six, talks to James and Peter and questions them. [S441]"}], "contes var STo=D.stories||{},arc=STo.narrative_arc||{};var s6=sec("st","6 · Stories",(STo.stories||[]).length+" found",arc.opening_device?'Arc: <b>'+esc(arc.opening_device)+'</b> → <b>'+esc(arc.central_tension)+'</b> → <b>'+esc(arc.resolution_or_payoff)+'</b> · returns to opening: '+arc.return_to_opening:"");
table(s6,["Story","Type","Function","Span","Shows","Does not show","Load-bearing"],(STo.stories||[]).map(function(x){var b=x.boundaries||{};return ['<b>'+esc(x.title_or_label)+'</b>',esc(x.story_type),esc(x.intended_function),'<span class="id">'+esc(x.source_span)+'</span>',esc(b.what_it_shows),esc(b.what_it_does_not_show),x.is_separable_from_argument===false?'<span class="pill neg">yes</span>':'no'];}));

/* 7 MASTER EQUATION */
var pt=me.product_test||{},cr=me.core_relation||{};var s7=sec("me","7 · Master equation analog","strength "+(me.analog_strength!=null?me.analog_strength:"—")+" ("+(me.analog_strength_spread||"")+") · two independent runs",
 'χ = G·M·E·S<sub>eff</sub>·T·K·R·Q·F·C. Core relation: '+esc(cr.sentence||cr)+'<br>Product test: <b>'+esc(pt.run1)+'</b> / <b>'+esc(pt.run2)+'</b> ('+esc(pt.status)+') — '+esc(pt.reason));
var mdv=document.createElement("div");s7.appendChild(mdv);
charts.push(function(){mdv.innerHTML='';var sl=me.slots||[];if(!sl.length)return;var s=svgIn(mdv,10*64+10,110),fit={direct:1,analogous:.66,stretched:.33,absent:0};
 sl.forEach(function(r,i){var cx=36+i*64,v1=fit[r.fit_1],v2=fit[r.fit_2],v=((v1||0)+(v2||0))/2;
  var c=el("circle",{cx:cx,cy:44,r:6+v*18,fill:v>=.66?css("--g2"):v>=.33?css("--g1"):css("--mid"),stroke:r.status==="contested"?css("--b2"):"none","stroke-width":2.5,"stroke-dasharray":r.status==="contested"?"4 2":"none"},s);
  tx(s,cx,96,r.slot,{"text-anchor":"middle","font-weight":600});hover(c,'<div class="t1">'+r.slot+' · '+esc(r.fit_1)+' / '+esc(r.fit_2)+' ('+r.status+')</div>'+esc(r.plays_role)+'<br><span style="color:var(--muted)">'+esc(r.quote)+'</span>');});
});
s7.insertAdjacentHTML("beforeend",'<p class="sub">Circle size = fit (direct &gt; analogous &gt; stretched &gt; absent), averaged over both runs. Dashed red ring = the two runs disagree.</p>'+(me.one_line?'<p>“'+esc(me.one_line)+'”</p>':''));

/* 8 COHERENCE */
var s8=sec("co","8 · Coherence",co.score!=null?co.score+"/"+(co.score_ceiling||10):"",esc(co.summary||""));
(D.coherence&&D.coherence.dimensions||[]).forEach(function(d){s8.insertAdjacentHTML("beforeend",'<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><b>'+esc(nm(d.name||""))+'</b><span class="id">'+d.score+'/10</span></div><div class="bar"><i style="width:'+(d.score||0)*10+'%;background:'+((d.score||0)>=7?css("--g2"):(d.score||0)>=5?css("--g1"):css("--b2"))+'"></i></div><div class="sub" style="margin-top:4px">'+esc((d.reasons||[]).join(' · '))+'</div></div>');});
["contradictions","tensions","missing_definitions"].forEach(function(k){var a=(D.coherence||{})[k]||[];if(a.length)s8.insertAdjacentHTML("beforeend",'<h3>'+nm(k)+'</h3><ul class="q">'+a.map(function(x){return '<li>'+(typeof x==="object"?(x.term?'<b>'+esc(x.term)+'</b>: ':'')+esc(x.description||x.note||JSON.stringify(x))+(x.severity?' <span class="pill neu">'+esc(x.severity)+'</span>':''):esc(x))+'</li>';}).join('')+'</ul>');});

/* 9 ALL SENTENCES */
var s9=sec("ss","9 · Every sentence","searchable","Nine cells per sentence in fruit order (love … self-control). Type to filter by text, id or trigger word.");
s9.insertAdjacentHTML("beforeend",'<input class="search" id="q" placeholder="Filter sentences…">');var tb=document.createElement("div");s9.appendChild(tb);
function sentRows(f){f=(f||"").toLowerCase();var rs=D.sentences.filter(function(s){return !f||(s.id+" "+s.t+" "+JSON.stringify(s.x)+" "+JSON.stringify(s.w)).toLowerCase().indexOf(f)>=0;});
 tb.innerHTML='';table(tb,["Id","Fruits","Sentence","Why / trigger words"],rs.map(function(s){return ['<span class="id">'+s.id+'<br>'+s.p+'</span>','<span style="white-space:nowrap">'+FR.map(function(fr,j){var v=s.v?s.v[j]:null;return '<span class="cell" title="'+nm(fr)+' '+v+'" style="background:'+div(v)+';color:'+(Math.abs(v||0)===2?"#fff":"inherit")+'">'+(v?(v>0?'+':'−'):'')+'</span>';}).join('')+'</span>',esc(s.t),'<span class="id">'+esc(Object.keys(s.w).map(function(k){return k+': '+s.w[k];}).concat(Object.keys(s.x).map(function(k){return k.replace('_',' ')+': '+s.x[k].join(', ');})).join(' · '))+'</span>'];}));}
document.getElementById("q").addEventListener("input",function(e){sentRows(e.target.value);});

/* AUDIT */
var sa=sec("au","Audit","","Each call's tokens; reused = taken from an earlier run because its prompt had not changed.");
table(sa,["Call","Tokens","Status"],D.calls.map(function(c){return [esc(c.name),c.tokens.toLocaleString(),c.error?'<span class="pill neg">'+esc(c.error)+'</span>':c.reused?'<span class="pill neu">reused</span>':'<span class="pill pos">ok</span>'];}));

render();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",render);
</script></body></html>
