var D=[{"key": "c61084f7-G1", "id": "G1", "name": "Resurrection is central to Christianity", "source": "Gary Habermas - Chapter 004 - The Resurrection Connection to All of Life - Gary Habermas @Sean McDowell", "speaker": "Gary Habermas", "domain": "theology", "case_map": ["F4", "K16"], "strength": 4.25, "originality": 1.5, "strength_runs": [4.0, 4.5], "originality_runs": [2, 1], "agreement": 0.83, "disagree": ["st8", "or1"], "weakest_link": "The premise that the resurrection is related to virtually every major doctrine and practice is asserted without an enumeration or criterion.", "develop_next": "Give a concrete list (or table) of doctrines and practices and show the dependency link for each, so the centrality claim can be checked.", "prior_art": "Gary Habermas, The Risen Jesus and Future Hope, 2003", "conclusion": "The resurrection is the central doctrine of Christianity, giving meaning to the deity, death, gospel, pastoral theology, and practice.", "items": {"st1": {"v": [2, 2], "quote": "It gives meaning to the deity, the death, the resurrection, what we call [music] the gospel message, all of pastoral theology, all of practice.", "why": ""}, "st2": {"v": [2, 2], "quote": "There are hundreds of verses on the resurrection New [music] Testament. And it is related to virtually every major doctrine and to most of the major practices in the Christian faith.", "why": ""}, "st3": {"v": [1, 1], "quote": "Paul says, \"Remove that one thing and forget all the heavy theology we talk about.", "why": ""}, "st4": {"v": [1, 1], "quote": "I can't think of any other doctrine that's no more closely tied.", "why": ""}, "st5": {"v": [0, 0], "quote": "", "why": ""}, "st6": {"v": [1, 1], "quote": "It's everything.", "why": ""}, "st7": {"v": [0, 0], "quote": "", "why": ""}, "st8": {"v": [1, 2], "quote": "A new book came out last year, 500 pages on 1 Corinthians 15 alone... He ties into the diamond, so to speak, and he finds the whole New Testament tied to the resurrection.", "why": "  \"Go and do the likewise.\"", "why": ""}, "st4": {"v": [1, 1], "quote": "So what I'm thinking is like in marriage all of me for my wife and all of my wife to me. We're saying that to Jesus when we come to know him.", "why": ""}, "st5": {"v": [1, 0], "quote": "The next question is, has anybody ever done that? The answer is nope. That's impossible. But it's by God's mercy and by grace we can be saved nonetheless.", "why": ""}, "st6": {"v": [1, 1], "quote": "Not by, but unto. And I think that's the radical commitment thing.", "why": ""}, "st7": {"v": [0, 0], "quote": "", "why": ""}, "st8": {"v": [1, 1], "quote": "Jesus sold him his I mean he died for us. He gave us everything. And he calls us to be as radically committed to him as he was to us.", "why": ""}, "or1": {"v": [1, 1], "quote": "The chapter title is uh faith and radical commitment.", "why": "A devotional variant on standard grace-and-works theology rather than a new argument."}, "or2": {"v": [1, 0], "quote": "I use the example of um marriage uh when we get married basically we're saying to each other all of me belongs to you.", "why": "The marriage analogy is a fresh illustrative premise."}, "or3": {"v": [0, 0], "quote": "", "why": "No cross-domain connection."}, "or4": {"v": [0, 0], "quote": "", "why": "No formalization."}}, "total": 4.25}, {"key": "c61084f7-G3", "id": "G3", "name": "Resurrection is the antidote to suffering and persecution", "source": "Gary Habermas - Chapter 004 - The Resurrection Connection to All of Life - Gary Habermas @Sean McDowell", "speaker": "Gary Habermas", "domain": "psychology", "case_map": ["F2", "F4", "K14", "K18"], "strength": 4.75, "originality": 2.0, "strength_runs": [4.5, 5.0], "originality_runs": [2, 2], "agreement": 0.92, "disagree": ["st8"], "weakest_link": "The claim that the resurrection 'takes the force out of' suffering rests on one anecdote and personal testimony.", "develop_next": "Provide controlled or comparative evidence (e.g., studies of coping among believers vs. non-believers) rather than a single anecdote.", "prior_art": "Gary Habermas, The Risen Jesus and Future Hope, 2003", "conclusion": "The resurrection provides the central truth that enables Christians to endure suffering and persecution by taking the force out of them.", "items": {"st1": {"v": [2, 2], "quote": "It takes the force out of suffering.", "why": ""}, "st2": {"v": [2, 2], "quote": "If Jesus was raised from the dead and you committed yourself to him, you're going to heaven.", "why": ""}, "st3": {"v": [1, 1], "quote": "Joseph Son who uh was the Eastern European pastor who was under he used to tell his his Russian guards he said... if you take my life you're doing a favor for me because you're sending me to heaven faster.", "why": ""}, "st4": {"v": [1, 1], "quote": "It doesn't mess with my message. to live as Christ and to die is gain.", "why": ""}, "st5": {"v": [1, 1], "quote": "No matter how much I say, hey, Psalm 91, what happened to those wings around me... but it's not going to touch us.", "why": ""}, "st6": {"v": [1, 1], "quote": "It takes the force out of suffering.", "why": ""}, "st7": {"v": [0, 0], "quote": "", "why": ""}, "st8": {"v": [1, 2], "quote": "He said he kept saying that for years and they left him alone. They were afraid to do anything to him.", "why": ""}, "or1": {"v": [1, 1], "quote": "It takes the force out of suffering.", "why": "A practical variant of the standard resurrection-hope response to suffering."}, "or2": {"v": [1, 1], "quote": "Joseph Son who uh was the Eastern European pastor... he would say to them... you're sending me to heaven faster.", "why": "Brings a specific anecdotal case (Joseph Son) not in the prior art."}, "or3": {"v": [0, 0], "quote": "", "why": "No cross-domain connection."}, "or4": {"v": [0, 0], "quote": "", "why": "No formalization."}}, "total": 4.75}, {"key": "c61084f7-G4", "id": "G4", "name": "Resurrection helps emotional doubt", "source": "Gary Habermas - Chapter 004 - The Resurrection Connection to All of Life - Gary Habermas @Sean McDowell", "speaker": "Gary Habermas", "domain": "psychology", "case_map": ["F3", "F4", "K03", "K16"], "strength": 4.25, "originality": 3.0, "strength_runs": [4.5, 4.0], "originality_runs": [3, 3], "agreement": 0.92, "disagree": ["st5"], "weakest_link": "The 70-80% emotional-doubt figure is asserted with no source or study.", "develop_next": "Cite the survey or clinical data behind the 70-80% figure and behind the claim that resurrection-focused cognitive replacement outperforms generic cognitive therapy.", "prior_art": "Gary Habermas, The Thomas Factor, 1990", "conclusion": "The resurrection is the key truth to apply in overcoming emotional doubt, which constitutes 70-80% of all doubt.", "items": {"st1": {"v": [2, 2], "quote": "The resurrection is the key. And if the resurrection is true, I'm going to center on the resurrection for emotional doubts.", "why": ""}, "st2": {"v": [2, 2], "quote": "Emotional doubts by far the most common 70 to 80%. About 10 to 15% factual about 10 to 15% um the last one which I won't even start talking about because the valitional doubt.", "why": ""}, "st3": {"v": [1, 1], "quote": "I teach emotional doubters the well Albert Ellis the famous atheist master of of cognitive therapy.", "why": ""}, "st4": {"v": [1, 1], "quote": "We have to fill our mind with truth to counteract the garbage we're telling ourselves. And the pain often goes just as quickly as you apply that.", "why": ""}, "st5": {"v": [1, 0], "quote": "I'm not saying I'm special or anything. But within about a week, that idea quit coming into my mind.", "why": ""}, "st6": {"v": [1, 1], "quote": "You can get the PL pain to go in in minutes.", "why": ""}, "st7": {"v": [0, 0], "quote": "", "why": ""}, "st8": {"v": [1, 1], "quote": "Whether it's Albert Ellis non-Christian application whether it's Paul in Roman in Philippians chapter 4 or Psalms and Proverbs it's always stop thinking the garbage you're thinking.", "why": ""}, "or1": {"v": [1, 1], "quote": "I teach emotional doubters the well Albert Ellis the famous atheist master of of cognitive therapy.", "why": "A variant that adds Ellis-style cognitive therapy to the earlier doubt taxonomy."}, "or2": {"v": [1, 1], "quote": "Emotional doubts by far the most common 70 to 80%.", "why": "Supplies percentage estimates not present in the earlier work."}, "or3": {"v": [1, 1], "quote": "I teach emotional doubters the well Albert Ellis the famous atheist master of of cognitive therapy.", "why": "Connects secular cognitive therapy to resurrection application."}, "or4": {"v": [0, 0], "quote": "", "why": "No formalization."}}, "total": 4.25}, {"key": "c61084f7-G5", "id": "G5", "name": "Resurrection addresses fear of death", "source": "Gary Habermas - Chapter 004 - The Resurrection Connection to All of Life - Gary Habermas @Sean McDowell", "speaker": "Gary Habermas", "domain": "philosophy", "case_map": ["F4", "K13", "K16"], "strength": 4.5, "originality": 2.5, "strength_runs": [4.5, 4.5], "originality_runs": [3, 2], "agreement": 0.92, "disagree": ["or2"], "weakest_link": "The premise that fear of death is 'the leading question' of Western philosophy is supported only by an appeal to a colleague's book.", "develop_next": "Give a survey of the philosophical literature (Epicurus, Plato, Heidegger, etc.) showing fear of death is a central problem and then show the resurrection answer's superiority.", "prior_art": "Gary Habermas, The Risen Jesus and Future Hope, 2003", "conclusion": "The resurrection of the body provides a powerful answer to the fear of death, which is a leading question in Western philosophy.", "items": {"st1": {"v": [2, 2], "quote": "The resurrection has a powerful response to that that of course is evidenced as well. But it solves arguably the leading question that has driven the development of philosophy.", "why": ""}, "st2": {"v": [2, 2], "quote": "Resurrection demands bodily resurrection. Bodily resurrection tells us how we're going to enjoy life, eternal life.", "why": ""}, "st3": {"v": [1, 1], "quote": "Our mutual friend Klay Jones, who used to teach the resurrection class before I was at at Talbot talks about in his book on immortality that really the heart of the question that Western philosophy and beyond have wrestled with is just the fear of death and the unknown.", "why": ""}, "st4": {"v": [1, 1], "quote": "If the resurrection is true, what does it say about the human body? Well, I think if the resurrection is true, we're going to rise bodily, not just as a uh wispy spirit like Plato believed.", "why": ""}, "st5": {"v": [1, 1], "quote": "You can find echoes of Plato and all kinds of things, but what I'm arguing about there is the resurrection of the body.", "why": ""}, "st6": {"v": [1, 1], "quote": "It solves arguably the leading question that has driven the development of philosophy.", "why": ""}, "st7": {"v": [0, 0], "quote": "", "why": ""}, "st8": {"v": [1, 1], "quote": "Philippians 3:10 that I may come to know him in the power of his resurrection. So Paul wants to uh use the resurrection for his own suffering.", "why": ""}, "or1": {"v": [1, 1], "quote": "The resurrection has a powerful response to that... it solves arguably the leading question that has driven the development of philosophy.", "why": "A variant of the standard bodily-resurrection answer to death, with a philosophical framing."}, "or2": {"v": [1, 0], "quote": "Our mutual friend Klay Jones... talks about in his book on immortality that really the heart of the question... is just the fear of death and the unknown.", "why": "Adds a secondary source (Clay Jones) not used in the prior art."}, "or3": {"v": [1, 1], "quote": "It solves arguably the leading question that has driven the development of philosophy.", "why": "Links the resurrection to a claim in the history of philosophy."}, "or4": {"v": [0, 0], "quote": "", "why": "No formalization."}}, "total": 4.5}, {"key": "c61084f7-G6", "id": "G6", "name": "Resurrection empowers victory over sin and fear", "source": "Gary Habermas - Chapter 004 - The Resurrection Connection to All of Life - Gary Habermas @Sean McDowell", "speaker": "Gary Habermas", "domain": "psychology", "case_map": ["F2", "F4", "K03", "K08", "K16"], "strength": 4.25, "originality": 2.0, "strength_runs": [4.5, 4.0], "originality_runs": [2, 2], "agreement": 0.92, "disagree": ["st5"], "weakest_link": "The evidence is a single autobiographical report with no control or independent verification.", "develop_next": "Turn the 'What does the resurrection say about this?' protocol into a testable intervention with outcome measures and compare it to standard cognitive restructuring.", "prior_art": "Gary Habermas, The Thomas Factor, 1990", "conclusion": "Living in the power of the resurrection helps overcome sin and fear in daily life by applying the truth of the resurrection to specific struggles.", "items": {"st1": {"v": [2, 2], "quote": "Yes, because I have been thinking about that question the last few weeks... take the truth of Christianity and apply it to either the sin, apply it to the pain, whatever it is.", "why": ""}, "st2": {"v": [2, 2], "quote": "Every time the fear or whatever comes in my mind, I go, \"Time out. What's the resurrection say about this?\" And I bring the resurrection.", "why": ""}, "st3": {"v": [1, 1], "quote": "Within about a week, that idea quit coming into my mind. It was like it was out. It was gone.", "why": ""}, "st4": {"v": [1, 1], "quote": "I can change the subject right now because this is garbage by by the force of Jesus Christ.", "why": ""}, "st5": {"v": [1, 0], "quote": "I'm not saying I'm special or anything. But within about a week, that idea quit coming into my mind.", "why": ""}, "st6": {"v": [1, 1], "quote": "This discipline can become second nature and is powerful against fear of death and sin.", "why": ""}, "st7": {"v": [0, 0], "quote": "", "why": ""}, "st8": {"v": [1, 1], "quote": "That discipline is so powerful whether it's fear of death, whether it's  song from if resurrection then heaven and I think that same argument is in the res is in new the new testament.", "why": ""}, "st5": {"v": [0, 0], "quote": "", "why": ""}, "st6": {"v": [1, 1], "quote": "So I start with resurrection I end with heaven because there's a chain that connects the two an unbreakable chain between the two and it's because of the resurrection that we have eternal life.", "why": ""}, "st7": {"v": [0, 0], "quote": "", "why": ""}, "st8": {"v": [1, 1], "quote": "Near-death experiences to me are almost are almost irrefutable.", "why": ""}, "or1": {"v": [1, 1], "quote": "But if I get a hint that there's already an afterlife that's going to be somewhere, and then if I know the resurrection's true, that opens the door to Jesus and the whole Christian message.", "why": "Variant of his own earlier afterlife/NDE work, now chained to the resurrection."}, "or2": {"v": [1, 1], "quote": "Near-death experiences to me are almost are almost irrefutable.", "why": "Reuses NDE evidence he already deployed elsewhere."}, "or3": {"v": [1, 0], "quote": "So there's a direct argument in the song from if resurrection then heaven and I think that same argument is in the res is in new the new testament.", "why": "Links popular song lyric to New Testament argument, a mild cross-domain move."}, "or4": {"v": [0, 0], "quote": "", "why": "No formalization, equation or model."}}, "total": 4.0}, {"key": "c61084f7-G8", "id": "G8", "name": "Resurrection is the minimal fact that secures Christianity", "source": "Gary Habermas - Chapter 004 - The Resurrection Connection to All of Life - Gary Habermas @Sean McDowell", "speaker": "Gary Habermas", "domain": "history", "case_map": ["F4", "K16"], "strength": 5.0, "originality": 1.0, "strength_runs": [5.0, 5.0], "originality_runs": [1, 1], "agreement": 0.83, "disagree": ["or1", "or4"], "weakest_link": "The move from 'errors in the gospels do not disprove the resurrection' to 'the resurrection alone establishes Christianity' assumes the
