 of coherence, active, and personal, which matches classical divine attributes.", "items": {"st1": {"v": [2, 2], "quote": "Those properties have had a name for thousands of years", "why": ""}, "st2": {"v": [2, 2], "quote": "1. **Necessary** -- it cannot not exist, or the system collapses. 2. **Self-grounding** -- it cannot depend on something else (infinite regress). 3. **Origin of coherence** -- it must be the source of truth, order, beauty, goodness, life. 4. **Active** -- passive maintenance is thermodynamically impossible (the Second Law). 5. **Personal** -- only persons can ground moral facts (moral realism).", "why": ""}, "st3": {"v": [1, 1], "quote": "If closed systems collapse and the universe has not collapsed, then something external sustains it.", "why": ""}, "st4": {"v": [0, 1], "quote": "If coherence and decoherence are real, measurable, and universal, then the source of coherence must be equally real and universal.", "why": ""}, "st5": {"v": [0, 0], "quote": "", "why": ""}, "st6": {"v": [0, 1], "quote": "We started from five mathematical proofs and arrived at the exact description theologians have been writing about since the beginning.", "why": ""}, "st7": {"v": [0, 0], "quote": "", "why": ""}, "st8": {"v": [1, 1], "quote": "If closed systems collapse and the universe has not collapsed, then something external sustains it. If coherence and decoherence are real, measurable, and universal, then the source of coherence must be equally real and universal.", "why": ""}, "or1": {"v": [1, 1], "quote": "Those properties have had a name for thousands of years", "why": "A variant of the classical necessary-ground / cosmological argument re-expressed with five 'mathematical requirements'."}, "or2": {"v": [1, 1], "quote": "If coherence and decoherence are real, measurable, and universal, then the source of coherence must be equally real and universal.", "why": "Adds decoherence/coherence language as evidence, though it is asserted rather than documented."}, "or3" 's do the pros and cons.", "why": "A distinct sub-argument about Bultmann's own position rather than a restatement of the minimal-facts case."}, "or2": {"v": [1, 0], "quote": "By the way, here's here's Bultmann's quote. It is 1941 essay.", "why": "Uses the 1941 essay's opening line as direct textual evidence."}, "or3": {"v": [0, 0], "quote": "", "why": "No cross-domain link."}, "or4": {"v": [0, 0], "quote": "", "why": "No formal structure."}}, "total": 3.75}, {"key": "ddf2201b-G5", "id": "G5", "name": "Scholarly consensus should target informed scholars who publish", "source": "Gary Habermas - Chapter 007 - Which Scholars Accept the Facts for the Resurrection - Gary Habermas", "speaker": "Gary Habermas", "domain": "history", "case_map": ["F4", "K15"], "strength": 4.5, "originality": 2.5, "strength_runs": [4.5, 4.5], "originality_runs": [3, 2], "agreement": 0.92, "disagree": ["or4"], "weakest_link": "The claim that publication guarantees an 'informed opinion' is a proxy that is asserted rather than validated.", "develop_next": "Show empirically that published resurrection scholars agree on the six facts at a much higher rate than non-publishing PhDs, so the selection rule is defensible.", "prior_art": "Gary Habermas, The Risen Jesus and Future Hope / minimal-facts volumes, 2003", "conclusion": "A scholarly consensus argument should focus on scholars who have published in the field of resurrection research because they have informed opinions, not on all PhDs regardless of expertise.", "items": {"st1": {"v": [2, 2], "quote": "how can you make a scholarly consensus argument if you're not interviewing all scholars, only the subset who publish in the literature.", "why": ""}, "st2": {"v": [2, 2], "quote": "when I say I I say a critical scholar ha- it I this is defined in volume one in particular has the following uh characteristics. They have a terminal degree.", "why": ""}, "st3": {"v": [1, 1], "quote": "Bethany Hughes, she she has a PhD in history, she she's quali- she
