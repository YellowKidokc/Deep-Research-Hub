var D=[{"key": "ddf2201b-G1", "id": "G1", "name": "Minimal facts consensus is not merely Christian bias", "source": "Gary Habermas - Chapter 007 - Which Scholars Accept the Facts for the Resurrection - Gary Habermas", "speaker": "Gary Habermas", "domain": "history", "case_map": ["F4", "K15", "K16"], "strength": 5.0, "originality": 1.0, "strength_runs": [5.0, 5.0], "originality_runs": [1, 1], "agreement": 1.0, "disagree": [], "weakest_link": "P3 (Flew's acceptance of all 12 facts) rests on Habermas's recollection of a debate rather than a citable published statement.", "develop_next": "Cite the exact debate transcript/date and Flew's own words accepting the 12 facts, plus a published Jesus Seminar volume page for the minimal facts.", "prior_art": "Gary Habermas & Michael Licona, The Case for the Resurrection of Jesus, 2004", "conclusion": "The scholarly consensus on the minimal facts for the resurrection is not undermined by the fact that many scholars who accept them are Christians, because non-Christian and skeptical scholars also accept them.", "items": {"st1": {"v": [2, 2], "quote": "Sure, you've got the scholarly consensus, but take a look at the Society of Biblical Literature or, you know, the EPS or something. The The vast majority of those scholars are already Christians and therefore they're committed to that.", "why": ""}, "st2": {"v": [2, 2], "quote": "And the two volumes the two major volumes put up by the Jesus Seminar. Now, I'm not going to argue whether they are Christians or not Christians, but when they de- uh devote their book to people like David Hume, Thomas Jefferson who took scissors and paste to the Gospels.", "why": ""}, "st3": {"v": [1, 1], "quote": "Tony Flew as far as I know when he was an atheist had no problems with the minimal facts. In fact, we started one of the three debates. I put 12 facts up.", "why": ""}, "st4": {"v": [1, 1], "quote": "But no, Gary's research and and scholarship has shown that no, they're being honest to the data, right? Because if if that was true, then the empty tomb would be a minimal fact.", "why": ""}, "st5": {"v": [1, 1], "quote": "So, they'll just say, \"Well, that's a bi- it's a bias in that the sample no one uh Christians are going to agree with your minimal facts to begin with.", "why": ""}, "st6": {"v": [1, 1], "quote": "And then what are they going to say? Oh, isn't he your fellow professor at Liberty University? I mean, you know, they'll try to they'll try to squeeze anything to anything", "why": ""}, "st7": {"v": [0, 0], "quote": "", "why": ""}, "st8": {"v": [2, 2], "quote": "I can find my six facts over and over and over and over and over in James D. G. Dunn. And then what are they going to say? ... Tony Flew as far as I know when he was an atheist had no problems with the minimal facts.", "why": ""}, "or1": {"v": [0, 0], "quote": "One of the number one objections, not just to you, but to to anytime a minimal facts approach is brought up, it's it's an objection I've always heard", "why": "This is Habermas's own long-running defense of the minimal-facts method, restated in interview form against the standard bias objection."}, "or2": {"v": [1, 1], "quote": "the two major volumes put up by the Jesus Seminar. Now, I'm not going to argue whether they are Christians or not Christians, but when they de- uh devote their book to people like David Hume, Thomas Jefferson who took scissors and paste to the Gospels.", "why": "Adds the Jesus Seminar's own dedication to Hume/Jefferson/Strauss and the Flew 12-facts anecdote as specific supporting data."}, "or3": {"v": [0, 0], "quote": "", "why": "No cross-domain connection is made; the argument stays within historical-critical scholarship."}, "or4": {"v": [0, 0], "quote": "", "why": "No formalization, model or structure is introduced."}}, "total": 5.0}, {"key": "ddf2201b-G2", "id": "G2", "name": "Even radical critics like Bultmann support early sources", "source": "Gary Habermas - Chapter 007 - Which Scholars Accept the Facts for the Resurrection - Gary Habermas", "speaker": "Gary Habermas", "domain": "history", "case_map": ["F4", "K13", "K15"], "strength": 4.75, "originality": 2.5, "strength_runs": [5.0, 4.5], "originality_runs": [2, 3], "agreement": 0.83, "disagree": ["st5", "or2"], "weakest_link": "P2/P3 rely on paraphrased Bultmann quotes whose exact wording and context are not checked in the source.", "develop_next": "Quote Bultmann's 1941 essay verbatim with page numbers and give the Soards/Brown appendix citation so the pre-37 claim can be verified.", "prior_art": "Gary Habermas, The Historical Jesus (and minimal-facts volumes), 1996", "conclusion": "Even Rudolf Bultmann, a very liberal scholar, affirms key historical data such as a pre-Markan passion narrative and early Jerusalem church sayings, which strengthens the case for the minimal facts.", "items": {"st1": {"v": [2, 2], "quote": "if I'm going to cite Rudolf Bultmann, who sorry, Bart, but maybe you don't care if people are to the left of you, but but Bart Ehrman would I I would say Rudolf Bultmann's to the left of Ehrman.", "why": ""}, "st2": {"v": [2, 2], "quote": "Bultmann's name is in that list, and he doesn't accept a whole lot of the verses, but he says there was a Markan pre-Markan narrative, and he only uses a few verses.", "why": ""}, "st3": {"v": [2, 2], "quote": "Also, in his 1941 essay, uh New Testament Mythology, the very famous thing that got rolling toward demythologization, uh Bultmann says, \"What can we say about the um aftermath of the cross?\" He says, \"The earliest disciples preached that he was raised from the dead.\"", "why": ""}, "st4": {"v": [1, 1], "quote": "Guess what Rudolf Bultmann says, way to the left. He says, \"These early sayings go back to the very earliest Jerusalem church.\"", "why": ""}, "st5": {"v": [1, 0], "quote": "And he lists a bunch of critical scholars who think that Mark did use a source that some say, and I won't give the reasons, but that some say predates 37 AD.", "why": ""}, "st6": {"v": [1, 1], "quote": "That's Bultmann, very earliest. If you If you know what I'm Look, these people aren't in the book because I generally don't go back to the to 1941 for sources, but you can find these guys.", "why": ""}, "st7": {"v": [0, 0], "quote": "", "why": ""}, "st8": {"v": [1, 1], "quote": "In the back of Raymond Brown's two-volume The Death of the Messiah ... he's reproduced Soards' essay on the pre-Markan passion narrative. And he lists a bunch of critical scholars who think that Mark did use a source", "why": ""}, "or1": {"v": [1, 1], "quote": "Bultmann's name is in that list, and he doesn't accept a whole lot of the verses, but he says there was a Markan pre-Markan narrative", "why": "A variant of Habermas's standing appeal to hostile-witness concessions, here focused on Bultmann's source-critical admissions."}, "or2": {"v": [1, 2], "quote": "In the back of Raymond Brown's two-volume The Death of the Messiah ... he's reproduced Soards' essay on the pre-Markan passion narrative.", "why": "Brings Soards' essay and Brown's appendix as concrete documentation of the pre-Markan source."}, "or3": {"v": [0, 0], "quote": "", "why": "No cross-domain bridge; purely within NT source criticism."}, "or4": {"v": [0, 0], "quote": "", "why": "No formal apparatus introduced."}}, "total": 4.75}, {"key": "ddf2201b-G3", "id": "G3", "name": "Christian scholars debate the evidence, not just assume resurrection", "source": "Gary Habermas - Chapter 007 - Which Scholars Accept the Facts for the Resurrection - Gary Habermas", "speaker": "Bill (co-host)", "domain": "history", "case_map": ["F4", "K15"], "strength": 4.25, "originality": 0.5, "strength_runs": [4.0, 4.5], "originality_runs": [0, 1], "agreement": 0.83, "disagree": ["st2", "or1"], "weakest_link": "P3 ('the data is so strong') is asserted, not argued, so it cannot carry the conclusion.", "develop_next": "Specify which data points are strong and show a case where a Christian scholar changed a conclusion because of evidence.", "prior_art": "Gary Habermas & Michael Licona, The Case for the Resurrection of Jesus, 2004", "conclusion": "The fact that many scholars are Christians does not mean they simply assume the resurrection; they debate the evidence and reach conclusions based on data.", "items": {"st1": {"v": [2, 2], "quote": "This easy assumption that Oh, well, just because they were Christian, that means they're just going to biasly accept them in all facts. But no, Gary's research and and scholarship has shown that no, they're being honest to the data, right?", "why": ""}, "st2": {"v": [1, 2], "quote": "Because if if that was true, then the empty tomb would be a minimal fact. Not You know, if if they're all just a bunch of Christians, why on earth are Christians denying the empty tomb?", "why": ""}, "st3": {"v": [1, 1], "quote": "So, just because someone's a Christian and maybe oh, okay, they already believe in the resurrection. That alone says nothing about their conclusions about the minimal facts because you can see from the quotes in there, they're debating the evidence.", "why": ""}, "st4": {"v": [1, 1], "quote": "It's because even though they're Christians, they're basing their conclusions on the data. And the data is so strong in the case of your six minimal facts, that's why there is that strong consensus.", "why": ""}, "st5": {"v": [1, 1], "quote": "they'll just say, \"Well, that's a bi- it's a bias in that the sample no one uh Christians are going to agree with your minimal facts to begin with.\"", "why": ""}, "st6": {"v": [1, 1], "quote": "That alone says nothing about their conclusions about the minimal facts because you can see from the quotes in there, they're debating the evidence.", "why": ""}, "st7": {"v": [0, 0], "quote": "", "why": ""}, "st8": {"v": [1, 1], "quote": "Because if if that was true, then the empty tomb would be a minimal fact. Not You know, if if they're all just a bunch of Christians, why on earth are Christians denying the empty tomb?", "why": ""}, "or1": {"v": [0, 1], "quote": "This easy assumption that Oh, well, just because they were Christian, that means they're just going to biasly accept them in all facts.", "why": "A restatement of the standard Habermas/Licona reply to the bias objection, voiced by the co-host."}, "or2": {"v": [0, 0], "quote": "", "why": "No new evidence is introduced beyond the empty-tomb example already used in G1."}, "or3": {"v": [0, 0], "quote": "", "why": "No cross-domain connection."}, "or4": {"v": [0, 0], "quote": "", "why": "No formal structure."}}, "total": 4.25}, {"key": "ddf2201b-G4", "id": "G4", "name": "Bultmann himself calls resurrection a myth", "source": "Gary Habermas - Chapter 007 - Which Scholars Accept the Facts for the Resurrection - Gary Habermas", "speaker": "Gary Habermas", "domain": "history", "case_map": ["F4", "K15"], "strength": 3.75, "originality": 1.5, "strength_runs": [3.5, 4.0], "originality_runs": [3, 0], "agreement": 0.75, "disagree": ["st3", "or1", "or2"], "weakest_link": "The quote is recalled from memory and a rhetorical question is read as a flat denial.", "develop_next": "Give the exact sentence and page from New Testament and Mythology, with surrounding context, to confirm Bultmann denies the event.", "prior_art": "Rudolf Bultmann, New Testament and Mythology (1941), as read by Habermas", "conclusion": "Bultmann explicitly dismisses the resurrection as a myth, showing that even a scholar who accepts some historical data rejects the resurrection itself.", "items": {"st1": {"v": [2, 2], "quote": "He starts a section out called the resurrection. And here's the first thing he says. And what about the resurrection? {question mark} Is it not a myth pure and simple? {question mark}", "why": ""}, "st2": {"v": [2, 2], "quote": "And then he doesn't say, well, let's do the pros and cons. No, he's done with it. He's already said it's a myth. It didn't happen.", "why": ""}, "st3": {"v": [1, 2], "quote": "By the way, here's here's Bultmann's quote. It is 1941 essay. I'm only going to miss this by a word or two.", "why": ""}, "st4": {"v": [1, 1], "quote": "He's already said it's a myth. It didn't happen.", "why": ""}, "st5": {"v": [0, 0], "quote": "", "why": ""}, "st6": {"v": [1, 1], "quote": "He's already said it's a myth. It didn't happen.", "why": ""}, "st7": {"v": [0, 0], "quote": "", "why": ""}, "st8": {"v": [0, 0], "quote": "", "why": ""}, "or1": {"v": [2, 0], "quote": "Is it not a myth pure and simple? {question mark} And then he doesn't say, well, let's do the pros and cons.", "why": "A distinct sub-argument about Bultmann's own position rather than a restatement of the minimal-facts case."}, "or2": {"v": [1, 0], "quote": "By the way, here's here's Bultmann's quote. It is 1941 essay.", "why": "Uses the 1941 essay's opening line as direct textual evidence."}, "or3": {"v": [0, 0], "quote": "", "why": "No cross-domain link."}, "or4": {"v": [0, 0], "quote": "", "why": "No formal structure."}}, "total": 3.75}, {"key": "ddf2201b-G5", "id": "G5", "name": "Scholarly consensus should target informed scholars who publish", "source": "Gary Habermas - Chapter 007 - Which Scholars Accept the Facts for the Resurrection - Gary Habermas", "speaker": "Gary Habermas", "domain": "history", "case_map": ["F4", "K15"], "strength": 4.5, "originality": 2.5, "strength_runs": [4.5, 4.5], "originality_runs": [3, 2], "agreement": 0.92, "disagree": ["or4"], "weakest_link": "The claim that publication guarantees an 'informed opinion' is a proxy that is asserted rather than validated.", "develop_next": "Show empirically that published resurrection scholars agree on the six facts at a much higher rate than non-publishing PhDs, so the selection rule is defensible.", "prior_art": "Gary Habermas, The Risen Jesus and Future Hope / minimal-facts volumes, 2003", "conclusion": "A scholarly consensus argument should focus on scholars who have published in the field of resurrection research because they have informed opinions, not on all PhDs regardless of expertise.", "items": {"st1": {"v": [2, 2], "quote": "how can you make a scholarly consensus argument if you're not interviewing all scholars, only the subset who publish in the literature.", "why": ""}, "st2": {"v": [2, 2], "quote": "when I say I I say a critical scholar ha- it I this is defined in volume one in particular has the following uh characteristics. They have a terminal degree.", "why": ""}, "st3": {"v": [1, 1], "quote": "Bethany Hughes, she she has a PhD in history, she she's quali- she does a bunch of BBC documentaries. If you want to know the history of Socrates, she's great, but she doesn't know anything about resurrection research. She's never published anything.", "why": ""}, "st4": {"v": [1, 1], "quote": "the reason you target the ones that are publishing is because we when we have a scholarly consensus, we want it to be an informed group of scholars.", "why": ""}, "st5": {"v": [1, 1], "quote": "some skeptics say, well, how can you make a scholarly consensus argument if you're not interviewing all scholars, only the subset who publish in the literature.", "why": ""}, "st6": {"v": [1, 1], "quote": "They have a terminal degree. Now, we usually think of that as a PhD, but in in England and Europe, they have different letters.", "why": ""}, "st7": {"v": [0, 0], "quote": "", "why": ""}, "st8": {"v": [1, 1], "quote": "I also allow history, historians, philosophers, people with doctorates in archaeology, believe it or not. ... Somebody I would accept somebody with a PhD in world religions.", "why": ""}, "or1": {"v": [1, 1], "quote": "when I say I I say a critical scholar ha- it I this is defined in volume one in particular has the following uh characteristics.", "why": "A methodological variant within Habermas's own program, spelling out the critical-scholar criteria."}, "or2": {"v": [1, 1], "quote": "G. A. Wells, yeah, he had a PhD in German. I I I wouldn't call that in somebody in a field, but I cite him cuz he knows how to do research.", "why": "Adds the Wells exception and the list of accepted fields as concrete selection data."}, "or3": {"v": [0, 0], "quote": "", "why": "No cross-domain connection."}, "or4": {"v": [1, 0], "quote": "They have a terminal degree. ... I say, I'll I would accept New Testament. I even say, I will accept Old Testament.", "why": "Offers an explicit eligibility rule (terminal degree + relevant field + publication) that can be applied as a criterion."}}, "total": 4.5}, {"key": "ddf2201b-G6", "id": "G6", "name": "Habermas is deliberately lenient toward liberal scholars", "source": "Gary Habermas - Chapter 007 - Which Scholars Accept the Facts for the Resurrection - Gary Habermas", "speaker": "Gary Habermas", "domain": "history", "case_map": ["F4", "K15"], "strength": 4.25, "originality": 2.0, "strength_runs": [4.0, 4.5], "originality_runs": [2, 2], "agreement": 0.92, "disagree": ["st5"], "weakest_link": "The evidence for leniency is Habermas's own self-report, with no independent audit of who was included or excluded.", "develop_next": "Publish the full inclusion/exclusion list with each scholar's theological position so the liberal slant can be independently checked.", "prior_art": "Gary Habermas, The Historical Jesus, 1996 (preface on slant toward critical scholars)", "conclusion": "Habermas's selection criteria are biased in favor of liberal scholars, not conservative ones, because he wants to include critics and give everyone a fair shot.", "items": {"st1": {"v": [2, 2], "quote": "I do say I am slanted toward liberal scholars. And you go, \"Well, that's not you. I know where you teach.\" Well, you're you're not listening to my nuance.", "why": ""}, "st2": {"v": [2, 2], "quote": "I really do think I I'm more lenient with liberals than I am with conservatives because I want to put people in there who don't have all the training, but I want to be honest giving everybody a shot.", "why": ""}, "st3": {"v": [1, 1], "quote": "Almost none of those German philosophers 19th century have earned doctorates, have terminal degrees in their field. But they did a lot of research in those days and and and they did these things. So I I approve even if I can't stand maybe what they're saying.", "why": ""}, "st4": {"v": [1, 1], "quote": "I'm more lenient with liberals than I am with conservatives because I want to put people in there who don't have all the training", "why": ""}, "st5": {"v": [0, 1], "quote": "And people who question me on that, they're they're not being fair with reading through the data.", "why": ""}, "st6": {"v": [1, 1], "quote": "So so in a way it's prejudiced, if you call this prejudice, in favor of those who have written on this topic.", "why": ""}, "st7": {"v": [0, 0], "quote": "", "why": ""}, "st8": {"v": [1, 1], "quote": "I get I get attacked so often by the so-called Jesus mythers. \"Why don't you allow us?\" ... I make a little allowance here and there", "why": ""}, "or1": {"v": [1, 1], "quote": "I do say I am slanted toward liberal scholars.", "why": "A variant of Habermas's own recurring self-description of his selection policy."}, "or2": {"v": [1, 1], "quote": "Almost none of those German philosophers 19th century have earned doctorates, have terminal degrees in their field. But they did a lot of research in those days", "why": "Adds the 19th-century German philosophers and the Wells case as evidence of deliberate leniency."}, "or3": {"v": [0, 0], "quote": "", "why": "No cross-domain link."}, "or4": {"v": [0, 0], "quote": "", "why": "No formalization or model."}}, "total": 4.25}, {"key": "ddf2201b-G7", "id": "G7", "name": "Jesus Seminar presupposes that dead men do not rise", "source": "Gary Habermas - Chapter 007 - Which Scholars Accept the Facts for the Resurrection - Gary Habermas", "speaker": "Gary Habermas", "domain": "history", "case_map": ["F4", "K16"], "strength": 4.75, "originality": 3.0, "strength_runs": [3.5, 6.0], "originality_runs": [3, 3], "agreement": 0.58, "disagree": ["st3", "st4", "st5", "st6", "st8"
