rection-to-God inference, extended to the deity of Christ."}, "or2": {"v": [2, 1], "quote": "Even critical scholars, Dale Allison, I mean others, uh, they think it's likely that Jesus foretold his death and resurrection ahead of time.", "why": "It brings critical-scholarship support for Jesus' prediction of his resurrection."}, "or3": {"v": [1, 0], "quote": "God doesn't wouldn't raise a heretic from the dead.", "why": "It connects resurrection to the moral argument and God's omnibenevolence."}, "or4": {"v": [0, 0], "quote": "", "why": "No formalization is added."}}, "total": 5.25}, {"key": "4f4c545f-G5", "id": "G5", "name": "Scripture is entailed by the resurrection", "source": "Gary Habermas - Chapter 001 - The Resurrection Connection to Christian Theology - Gary Habermas with @Real Seekers", "speaker": "Gary Habermas", "domain": "theology", "case_map": ["K16"], "strength": 4.75, "originality": 3.0, "strength_runs": [4.5, 5.0], "originality_runs": [4, 2], "agreement": 0.75, "disagree": ["st6", "or2", "or3"], "weakest_link": "P2 (Scripture follows from accepting Jesus' teaching) is asserted without showing Jesus' own view of Scripture.", "develop_next": "Cite Jesus' explicit statements about Scripture (e.g., Matthew 5:17-18) to ground the entailment.", "prior_art": "None known", "conclusion": "Scripture is entailed by the resurrection, though further down the line than the kingdom and ethics.", "items": {"st1": {"v": [2, 2], "quote": "I think scriptures entailed somewhere down the line, just like I think ethics are entailed somewhere down the line.", "why": ""}, "st2": {"v": [2, 2], "quote": "If he is our Lord that's a New Testament view I think if Jesus is our Lord then we should take his view on things.", "why": ""}, "st3": {"v": [1, 1], "quote": "Galatians chapter 6, Paul says, and this this sounds like a little bit with a down a downsizing of the good Samaritan.", "why": ""}, "st4": {"v": [1, 1], "quote": "Jesus only numbers the two greatest theological doctrines in Luke 10.", "why": ""}, "st5": {"v": [1, 1], "quote": "I think a lot of these things come from resurrection.", "why": ""}, "st6": {"v": [1, 2], "quote": "I don't think God raised him from the dead to say uh Jesus loves me this I know for the Bible tells me so.", "why": ""}, "st7": {"v": [0, 0], "quote": "", "why": ""}, "st8": {"v": [1, 1], "quote": "Now, somebody could say, I suppose, I've thought about this a lot. Yeah, he didn't say where they were the two most important overall.", "why": ""}, "or1": {"v": [2, 2], "quote": "I think scriptures entailed somewhere down the line, just like I think ethics are entailed somewhere down the line.", "why": "It is a new ordering of entailments from the resurrection, placing Scripture below kingdom and ethics."}, "or2": {"v": [1, 0], "quote": "Galatians chapter 6, Paul says, and this this sounds like a little bit with a down a downsizing of the good Samaritan.", "why": "It brings Galatians 6 and Luke 10 into the entailment argument."}, "or3": {"v": [1, 0], "quote": "Jesus only numbers the two greatest theological doctrines in Luke 10.", "why": "It connects the resurrection to a hierarchy of theological doctrines via the two greatest commandments."}, "or4": {"v": [0, 0], "quote": "", "why": "No formalization is added."}}, "total": 4.75}, {"key": "4f4c545f-G6", "id": "G6", "name": "Criteria for identifying a miracle", "source": "Gary Habermas - Chapter 001 - The Resurrection Connection to Christian Theology - Gary Habermas with @Real Seekers", "speaker": "Gary Habermas", "domain": "philosophy", "case_map": ["K16"], "strength": 7.75, "originality": 3.5, "strength_runs": [7.5, 8.0], "originality_runs": [4, 3], "agreement": 0.67, "disagree": ["st7", "or2", "or3", "or4"], "weakest_link": "P5 (the resurrection is unrepeatable and predicted) depends on the reliability of the prediction texts and on the uniqueness claim.", "develop_next": "Give the specific criteria and show how competing miracle claims fail each one.", "prior_art": "Richard Swinburne, The Concept of Miracle, 1970; David Hume, Of Miracles, 1748; C.S. Lewis, Miracles, 1947", "conclusion": "A miracle is best identified as a one-time event, performed by God, with very good evidence, serving as a sign to authenticate a message.", "items": {"st1": {"v": [2, 2], "quote": "I like Richard Swinsburn's definition that a miracle it's it at its best it's a one-time event where the evidence is very good.", "why": ""}, "st2": {"v": [2, 2], "quote": "a miracle is an act of God or an invisible agent.", "why": ""}, "st3": {"v": [2, 2], "quote": "I think he's right when he says if something is repeated under certain circumstances chances are that's not a miracle or if it is it's not a first rate miracle", "why": ""}, "st4": {"v": [2, 2], "quote": "I think the resurrection is a great connection between look it's never happened before.", "why": ""}, "st5": {"v": [2, 2], "quote": "some people say things like Richard Swinburn I think is a goes a little too far here", "why": ""}, "st6": {"v": [2, 2], "quote": "Virtually everybody, unless they're prepared to be accosted uh factually, almost everybody thinks that the resurrection fits that criteria like no other potential thing.", "why": ""}, "st7": {"v": [1, 2], "quote": "when Indian gurus are often said to have levitated a bit and maybe they don't do it all the time maybe they do it sometimes but it's done over and over again or certain circumstances, I say, \"Yeah, that's a really weird event. I wouldn't mind knowing how that's done, but I don't think it's a miracle.\"", "why": ""}, "st8": {"v": [2, 2], "quote": "I think there's a number of them, but I think the resurrection is the key one that's puts the glue in there, the cement between the bricks, if you will.", "why": ""}, "or1": {"v": [1, 1], "quote": "I like Richard Swinsburn's definition that a miracle it's it at its best it's a one-time event where the evidence is very good.", "why": "It adopts Swinburne's definition and applies it to the resurrection."}, "or2": {"v": [2, 1], "quote": "Even critical scholars, Dale Allison, I mean others, uh, they think it's likely that Jesus foretold his death and resurrection ahead of time.", "why": "It brings the prediction of the resurrection as additional evidence beyond the event itself."}, "or3": {"v": [1, 0], "quote": "I think that's Jesus's point in in Mark chapter 2 when the guy comes through the roof and Jesus said, \"Your sins are forgiven.\"", "why": "It connects miracle criteria to Jesus' forgiveness healing as a sign."}, "or4": {"v": [0, 1], "quote": "I think he said levitation might be a miracle.", "why": "No formalization is added."}}, "total": 7.75}, {"key": "4f4c545f-G7", "id": "G7", "name": "Future-unknown appeals cannot defeat miracles", "source": "Gary Habermas - Chapter 001 - The Resurrection Connection to Christian Theology - Gary Habermas with @Real Seekers", "speaker": "Gary Habermas", "domain": "philosophy", "case_map": ["K16"], "strength": 4.5, "originality": 3.0, "strength_runs": [5.0, 4.0], "originality_runs": [3, 3], "agreement": 0.83, "disagree": ["st5", "st7"], "weakest_link": "P2 ('maybe it won't happen') is a bare counter-assertion that by itself does not settle the evidential question.", "develop_next": "Give a criterion for when a future-unknown appeal is legitimate vs. ad hoc, rather than a symmetric 'maybe it won't.'", "prior_art": "David Hume, Of Miracles (An Enquiry Concerning Human Understanding, 1748); Habermas, The Resurrection, vol. 2 (2022)", "conclusion": "The skeptical appeal to a future unknown natural explanation is self-defeating and cannot rationally defeat a miracle claim.", "items": {"st1": {"v": [2, 2], "quote": "And the comeback, the right comeback is, and maybe it won't happen in the future.", "why": ""}, "st2": {"v": [2, 2], "quote": "you can say it about anything you don't like well maybe it'll be done in the future", "why": ""}, "st3": {"v": [1, 1], "quote": "In volume two, I have a lot of pages, two chapters divi devoted to David Hume.", "why": ""}, "st4": {"v": [1, 1], "quote": "If naturalism is not an empirical claim, but your epistemology requires empirical claims. Guess what? You flunked.", "why": ""}, "st5": {"v": [1, 0], "quote": "Well, maybe find an answer in the future. Oh, that's brilliant there, man.", "why": ""}, "st6": {"v": [1, 1], "quote": "you can say it about anything you don't like well maybe it'll be done in the future", "why": ""}, "st7": {"v": [1, 0], "quote": "If we're in the category of yes, no, yes, no. Then we did it.", "why": ""}, "st8": {"v": [1, 1], "quote": "one of which is it just makes induction impossible.", "why": ""}, "or1": {"v": [1, 1], "quote": "I argue against I think it's 17 or 18 of them in the second Hume chapter in in volume two.", "why": "A variant: it inverts Hume's future-evidence move rather than restating Hume's argument."}, "or2": {"v": [1, 1], "quote": "What if I find out in the future we didn't go to the moon?", "why": "Adds a systematic catalogue of 17-18 Humean empirical comebacks, but the underlying data are Hume's own examples."}, "or3": {"v": [1, 1], "quote": "If naturalism is not an empirical claim, but your epistemology requires empirical claims.", "why": "Connects philosophy of science (induction, empiricism) to the miracle debate."}, "or4": {"v": [0, 0], "quote": "", "why": "No formalization or model offered."}}, "total": 4.5}, {"key": "4f4c545f-G8", "id": "G8", "name": "Supernatural events can be linked to God rather than Satan", "source": "Gary Habermas - Chapter 001 - The Resurrection Connection to Christian Theology - Gary Habermas with @Real Seekers", "speaker": "Gary Habermas", "domain": "philosophy", "case_map": ["F4", "K07", "K11", "K13"], "strength": 3.5, "originality": 1.0, "strength_runs": [3.5, 3.5], "originality_runs": [0, 2], "agreement": 0.67, "disagree": ["st5", "st6", "or1", "or3"], "weakest_link": "P2 asserts all five items 'require' God without argument for any of them.", "develop_next": "Arg
